    <button class="search-clear" id="searchClear" onclick="clearSearch()" title="검색 초기화"><i class="ti ti-x"></i></button>
    <span class="search-result-tag" id="searchResultTag"></span>
  </div>

  <div class="mtabs" id="monthTabs"></div>

  <div class="tbl-wrap">
    <table id="tbl">
      <colgroup>
        <col style="width:40px">
        <col style="width:110px">
        <col style="width:110px">
        <col style="width:145px">
        <col style="width:80px">
        <col style="width:135px">
        <col style="width:80px">
        <col style="width:90px">
        <col style="width:125px">
        <col style="width:90px">
        <col style="width:110px">
        <col style="width:100px">
        <col style="width:36px">
      </colgroup>
      <thead>
        <tr id="headRow">
          <th style="width:32px">#</th>
          <th>정산시작일<span class="filter-btn" data-key="startDate" onclick="toggleFilterPanel(event,'startDate')"><i class="ti ti-filter"></i></span></th>
          <th>정산종료일<span class="filter-btn" data-key="endDate" onclick="toggleFilterPanel(event,'endDate')"><i class="ti ti-filter"></i></span></th>
          <th>소속 협력사<span class="filter-btn" data-key="company" onclick="toggleFilterPanel(event,'company')"><i class="ti ti-filter"></i></span></th>
          <th>대표자<span class="filter-btn" data-key="rep" onclick="toggleFilterPanel(event,'rep')"><i class="ti ti-filter"></i></span></th>
          <th>계좌번호<span class="filter-btn" data-key="acct" onclick="toggleFilterPanel(event,'acct')"><i class="ti ti-filter"></i></span></th>
          <th>은행<span class="filter-btn" data-key="bank" onclick="toggleFilterPanel(event,'bank')"><i class="ti ti-filter"></i></span></th>
          <th>정산구분<span class="filter-btn" data-key="settleType" onclick="toggleFilterPanel(event,'settleType')"><i class="ti ti-filter"></i></span></th>
          <th style="text-align:right">이체금액 (원)<span class="filter-btn" data-key="amount" onclick="toggleFilterPanel(event,'amount')"><i class="ti ti-filter"></i></span></th>
          <th>정산현황<span class="filter-btn" data-key="settle" onclick="toggleFilterPanel(event,'settle')"><i class="ti ti-filter"></i></span></th>
          <th>세금계산서 발행<span class="filter-btn" data-key="tax" onclick="toggleFilterPanel(event,'tax')"><i class="ti ti-filter"></i></span></th>
          <th>메모</th>
          <th style="width:36px"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="filterPanel"></div>
</div>

<script>
const today = new Date().toISOString().split('T')[0];

// ── Supabase ──────────────────────────────────────────────
const _SB_URL  = 'https://micquonnaxyhwxwksctf.supabase.co';
const _SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pY3F1b25uYXh5aHd4d2tzY3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTY0MDgsImV4cCI6MjA5NjY5MjQwOH0.9S0DhscVBWUw1nerK5weF5GMoJaTTZHLtL91yOaqHR0';
const _RECORD  = 'main';
const sb = supabase.createClient(_SB_URL, _SB_KEY);
// ─────────────────────────────────────────────────────────

// ── 앱 시작 (로그인 없이 바로 실행) ──────────────────────────
window.addEventListener('DOMContentLoaded', init);
// ─────────────────────────────────────────────────────────────

// localStorage로 즉시 초기 렌더링 (Supabase 로드 전 빠른 표시)
let rows = JSON.parse(localStorage.getItem('settle_rows') || 'null') || [
  {startDate:today,endDate:today,company:'',rep:'',acct:'',bank:'',settleType:'',amount:'',settle:'미완료',tax:'미완료',memo:''}
];
function migrateRows(arr){
  arr.forEach(r=>{
    if(r.startDate===undefined) r.startDate = r.date || today;
    if(r.endDate===undefined) r.endDate = r.date || today;
    if(!r.settle) r.settle = '미완료';
    if(!r.tax)    r.tax    = '미완료';
    if(r.settleType===undefined) r.settleType = '';
    if(r.memo===undefined) r.memo = '';
    if(r.amount && String(r.amount).includes('.')){const _n=parseFloat(r.amount);if(!isNaN(_n))r.amount=String(Math.round(_n));}
  });
}
migrateRows(rows);

let collapsedGroups    = JSON.parse(localStorage.getItem('settle_collapsed')     || '[]');
let collapsedSubGroups = JSON.parse(localStorage.getItem('settle_sub_collapsed') || '[]');
let acctMap            = JSON.parse(localStorage.getItem('settle_acctmap')       || '{}');
let sectionTarget = null;
function setSectionTarget(indices, startDate, endDate){
  sectionTarget = {indices, startDate: startDate||today, endDate: endDate||today};
}
const FILTER_COLS = {
  startDate:{label:'정산시작일'},
  endDate:{label:'정산종료일'},
  company:{label:'소속 협력사'},
  rep:{label:'대표자'},
  acct:{label:'계좌번호'},
  bank:{label:'은행'},
  settleType:{label:'정산구분', display:v=>v||'-'},
  amount:{label:'이체금액', numeric:true, display:v=>v===''?'(공백)':formatAmount(v)},
  settle:{label:'정산현황', display:v=>v==='완료'?'✓ 완료':v==='미완료'?'✗ 미완료':'-'},
  tax:{label:'세금계산서 발행', display:v=>v==='완료'?'✓ 완료':v==='미완료'?'✗ 미완료':'-'}
};

let columnFilters = {}; // key -> Set of allowed raw values (없으면 전체 허용)
let monthTab = JSON.parse(localStorage.getItem('settle_month_tab') || '""'); // 보고 있는 월 탭 ("ALL" = 전체, "" = 가장 최근 월)

// ── 월 탭 (정산종료일 기준) ──
function monthKeyOf(r){ return r.endDate ? r.endDate.slice(0,7) : 'none'; }
function monthKeys(){
  return [...new Set(rows.map(monthKeyOf))].sort((a,b)=>{
    if(a==='none') return 1;
    if(b==='none') return -1;
    return b.localeCompare(a);
  });
}
function curTab(){
  if(monthTab==='ALL') return 'ALL';
  const keys = monthKeys();
  return keys.includes(monthTab) ? monthTab : (keys[0] || 'ALL');
}
function setMonthTab(k){ monthTab = k; localStorage.setItem('settle_month_tab', JSON.stringify(k)); }
function pickMonthTab(k){ setMonthTab(k); render(); }
function inTab(r, tab){ return tab==='ALL' || monthKeyOf(r)===tab; }
function renderMonthTabs(tab){
  const counts = {}; let total = 0;
  rows.forEach(r=>{ if(!matchesFilters(r)) return; const k = monthKeyOf(r); counts[k] = (counts[k]||0)+1; total++; });
  let html = `<button class="mtab${tab==='ALL'?' on':''}" onclick="pickMonthTab('ALL')">전체<span class="cnt">${total}건</span></button>`;
  monthKeys().forEach(k=>{
    const n = counts[k] || 0;
    const label = k==='none' ? '날짜없음' : groupKey(k+'-01');
    html += `<button class="mtab${tab===k?' on':''}${n?'':' zero'}" onclick="pickMonthTab('${k}')">${label}<span class="cnt">${n}건</span></button>`;
  });
  document.getElementById('monthTabs').innerHTML = html;
}
let searchQuery = '';
let searchField = 'rep';

function matchesFilters(r){
  if(searchQuery){
    const val = (r[searchField]||'').toLowerCase();
    if(!val.includes(searchQuery.toLowerCase())) return false;
  }
  for(const key in columnFilters){
    if(!columnFilters[key].has(r[key]||'')) return false;
  }
  return true;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function toggleFilterPanel(e,key){
  e.stopPropagation();
  const panel = document.getElementById('filterPanel');
  const wasOpenForKey = panel.classList.contains('open') && panel.dataset.key===key;
  panel.classList.remove('open');
  if(wasOpenForKey) return;

  panel.dataset.key = key;
  panel.innerHTML = buildFilterPanel(key);

  const rect = e.currentTarget.getBoundingClientRect();
  let left = rect.left;
  const maxLeft = window.innerWidth - 220;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  panel.style.top = (rect.bottom + 4) + 'px';
  panel.style.left = left + 'px';
  panel.classList.add('open');
}

document.addEventListener('click', (e)=>{
  const panel = document.getElementById('filterPanel');
  if(panel.classList.contains('open') && !e.target.closest('#filterPanel') && !e.target.closest('.filter-btn')){
    panel.classList.remove('open');
  }
});

function buildFilterPanel(key){
  const col = FILTER_COLS[key];
  const valuesSet = new Set();
  rows.forEach(r=> valuesSet.add(r[key] || ''));
  const values = Array.from(valuesSet).sort((a,b)=>{
    if(col.numeric) return (parseFloat(String(a).replace(/[^0-9.\-]/g,''))||0) - (parseFloat(String(b).replace(/[^0-9.\-]/g,''))||0);
    return String(a).localeCompare(String(b),'ko');
  });

  const active = columnFilters[key];
  const checkedSet = active || new Set(values);

  const itemsHtml = values.map(v=>{
    const label = col.display ? col.display(v) : (v===''?'(공백)':v);
    const checked = checkedSet.has(v);
    return `<label class="fp-item"><input type="checkbox" value="${escapeHtml(v)}" ${checked?'checked':''}><span>${escapeHtml(label)}</span></label>`;
  }).join('');

  return `
    <div class="fp-sort">
      <button onclick="sortByColumn('${key}','asc')"><i class="ti ti-sort-ascending-2"></i> 오름차순 정렬</button>
      <button onclick="sortByColumn('${key}','desc')"><i class="ti ti-sort-descending-2"></i> 내림차순 정렬</button>
    </div>
    <input type="text" class="fp-search" placeholder="검색" oninput="filterFpList(this,'${key}')">
    <div class="fp-actions">
      <a onclick="fpSelectAll('${key}',true)">모두 선택</a>
      <a onclick="fpSelectAll('${key}',false)">모두 지우기</a>
    </div>
    <div class="fp-list" id="fp-list-${key}">${itemsHtml}</div>
    <div class="fp-buttons">
      <button onclick="closeFilterPanel()">취소</button>
      <button class="primary" onclick="applyFilter('${key}')">확인</button>
    </div>
  `;
}

function filterFpList(input,key){
  const term = input.value.trim().toLowerCase();
  document.querySelectorAll(`#fp-list-${key} .fp-item`).forEach(item=>{
    item.style.display = item.textContent.toLowerCase().includes(term) ? '' : 'none';
  });
}

function fpSelectAll(key,checked){
  document.querySelectorAll(`#fp-list-${key} .fp-item`).forEach(item=>{
    if(item.style.display !== 'none') item.querySelector('input').checked = checked;
  });
}

function closeFilterPanel(){
  document.getElementById('filterPanel').classList.remove('open');
}

function doSearch(){
  searchQuery = document.getElementById('searchInput').value.trim();
  searchField = document.getElementById('searchField').value;
  const clearBtn = document.getElementById('searchClear');
  const tag = document.getElementById('searchResultTag');
  clearBtn.classList.toggle('visible', searchQuery.length > 0);
  if(!searchQuery){ tag.textContent = ''; render(); return; }
  render();
  const matchCount = rows.filter(r=>matchesFilters(r)).length;
  tag.textContent = `${matchCount}건`;
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('searchClear').classList.remove('visible');
  document.getElementById('searchResultTag').textContent = '';
  render();
}

function applyFilter(key){
  const checked = new Set();
  let allChecked = true;
  document.querySelectorAll(`#fp-list-${key} .fp-item input`).forEach(cb=>{
    if(cb.checked) checked.add(cb.value); else allChecked = false;
  });
  if(allChecked) delete columnFilters[key];
  else columnFilters[key] = checked;
  closeFilterPanel();
  render();
}

function sortByColumn(key,dir){
  const col = FILTER_COLS[key];
  rows.sort((a,b)=>{
    const av = a[key]||'', bv = b[key]||'';
    let cmp = col.numeric
      ? (parseFloat(String(av).replace(/[^0-9.\-]/g,''))||0) - (parseFloat(String(bv).replace(/[^0-9.\-]/g,''))||0)
      : String(av).localeCompare(String(bv),'ko');
    return dir==='asc' ? cmp : -cmp;
  });
  closeFilterPanel();
  autoSave();
  render();
}

function buildAcctLookup(){
  // acctMap(계좌정보 업로드) + 기존 행에 직접 입력된 데이터를 합산
  const map = Object.assign({}, acctMap);
  rows.forEach(r=>{
    if(r.company && (r.rep||r.acct||r.bank||r.settleType)){
      map[r.company] = {
        rep:        r.rep        || (map[r.company]||{}).rep        || '',
        acct:       r.acct       || (map[r.company]||{}).acct       || '',
        bank:       r.bank       || (map[r.company]||{}).bank       || '',
        settleType: r.settleType || (map[r.company]||{}).settleType || ''
      };
    }
  });
  return map;
}

function applyAcctMap(){
  rows.forEach(r=>{
    if(r.company && acctMap[r.company]){
      r.rep = acctMap[r.company].rep;
      r.acct = acctMap[r.company].acct;
      r.bank = acctMap[r.company].bank;
    }
  });
}

// 엑셀 업로드 후 자동완성: 비어있는 필드만 채움
function autoFillNewRows(){
  const map = buildAcctLookup();
  rows.forEach(r=>{
    if(r.company && map[r.company]){
      const m = map[r.company];
      if(!r.rep && !r.acct && !r.bank){
        r.rep = m.rep; r.acct = m.acct; r.bank = m.bank;
      }
      if(!r.settleType && m.settleType) r.settleType = m.settleType;
    }
  });
}

function onCompanyBlur(i){
  const company = rows[i].company;
  const map = buildAcctLookup();
  if(company && map[company]){
    const m = map[company];
    rows[i].rep = m.rep; rows[i].acct = m.acct; rows[i].bank = m.bank;
    if(!rows[i].settleType && m.settleType) rows[i].settleType = m.settleType;
    autoSave();
    render();
  }
}

function groupKey(dateStr){
  if(!dateStr) return '날짜없음';
  const [y,m] = dateStr.split('-');
  return `${y.slice(2)}년 ${parseInt(m,10)}월`;
}

function formatShortDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m,10)}.${parseInt(d,10)}`;
}

function dateRangeLabel(start,end){
  if(!start && !end) return '날짜없음';
  if(start===end) return formatShortDate(start);
  return `${formatShortDate(start)} ~ ${formatShortDate(end)}`;
}

function toggleGroup(key){
  const idx = collapsedGroups.indexOf(key);
  if(idx>=0) collapsedGroups.splice(idx,1); else collapsedGroups.push(key);
  autoSave();
  render();
}

function toggleSubGroup(key){
  const idx = collapsedSubGroups.indexOf(key);
  if(idx>=0) collapsedSubGroups.splice(idx,1); else collapsedSubGroups.push(key);
  autoSave();
  render();
}

function rowHtml(r,i){
  return `
      <td class="row-num">${i+1}</td>
      <td><input class="editable" type="date" value="${r.startDate}" onchange="rows[${i}].startDate=this.value;autoSave()"></td>
      <td><input class="editable" type="date" value="${r.endDate}" onchange="rows[${i}].endDate=this.value;autoSave();render()"></td>
      <td><input class="editable" placeholder="협력사명" value="${r.company}" oninput="rows[${i}].company=this.value;autoSave()" onblur="onCompanyBlur(${i})" style="min-width:100px"></td>
      <td><input class="editable" placeholder="대표자명" value="${r.rep}" oninput="rows[${i}].rep=this.value;autoSave()" style="min-width:80px"></td>
      <td><input class="editable" placeholder="계좌번호" value="${r.acct}" oninput="rows[${i}].acct=this.value;autoSave()" style="min-width:140px"></td>
      <td><input class="editable" placeholder="은행명" value="${r.bank}" oninput="rows[${i}].bank=this.value;autoSave()" style="min-width:80px"></td>
      <td>
        <button type="button" class="status-btn ${settleTypeClass(r.settleType)}" onclick="toggleSettleType(${i},this)">${settleTypeLabel(r.settleType)}</button>
      </td>
      <td><input class="editable amount-input" placeholder="0" value="${formatAmount(r.amount)}" onfocus="const _v=parseFloat(rows[${i}].amount);this.value=isNaN(_v)?'':Math.round(_v)" onblur="this.value=formatAmount(rows[${i}].amount)" oninput="rows[${i}].amount=this.value;autoSave();updateSummary()" style="min-width:110px"></td>
      <td>
        <button type="button" class="status-btn ${statusClass(r.settle)}" onclick="toggleStatus(${i},'settle',this)">${r.settle==='완료'?'✓ 완료':'✗ 미완료'}</button>
      </td>
      <td>
        <button type="button" class="status-btn ${statusClass(r.tax)}" onclick="toggleStatus(${i},'tax',this)">${r.tax==='완료'?'✓ 완료':'✗ 미완료'}</button>
      </td>
      <td><input class="editable" placeholder="메모" value="${escapeHtml(r.memo||'')}" oninput="rows[${i}].memo=this.value;autoSave()"></td>
      <td><button class="del-btn" onclick="delRow(${i})" title="삭제">✕</button></td>
    `;
}

function render(){
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';

  const tab = curTab();
  renderMonthTabs(tab);

  // 정산종료일 기준 연/월 그룹으로 묶기 (필터 + 월 탭 적용)
  const groups = {};
  rows.forEach((r,i)=>{
    if(!matchesFilters(r) || !inTab(r, tab)) return;
    const key = groupKey(r.endDate);
    (groups[key] = groups[key] || []).push(i);
  });
  const sortedKeys = Object.keys(groups).sort((a,b)=>{
    const da = rows[groups[a][0]].endDate || '';
    const db = rows[groups[b][0]].endDate || '';
    return db.slice(0,7).localeCompare(da.slice(0,7));
  });

  if(sortedKeys.length===0){
    tb.innerHTML = `<tr><td colspan="12" style="text-align:center;color:#888780;padding:20px">${tab==='ALL' ? '검색 결과가 없어요.' : '이 달에는 보여줄 내용이 없어요. 다른 월 탭이나 <b>전체</b> 탭을 확인해 보세요.'}</td></tr>`;
    updateSummary();
    updateFilterBtnStates();
    return;
  }

  sortedKeys.forEach(key=>{
    const indices = groups[key];
    const collapsed = tab==='ALL' && collapsedGroups.includes(key);

    if(tab==='ALL'){   // 월 탭에서는 월 머리줄 없이 바로 기간 그룹
      const headerTr = document.createElement('tr');
      headerTr.className = 'group-header'+(collapsed?' collapsed':'');
      headerTr.innerHTML = `<td colspan="12" onclick="toggleGroup('${key}')"><i class="ti ti-chevron-down"></i>${key}<span class="group-count">${indices.length}건</span></td>`;
      tb.appendChild(headerTr);
    }

    if(!collapsed){
      // 정산시작일~정산종료일 구간(주차)별로 다시 묶기
      const subGroups = {};
      indices.forEach(i=>{
        const r = rows[i];
        const subKey = `${r.startDate}__${r.endDate}`;
        (subGroups[subKey] = subGroups[subKey] || []).push(i);
      });
      const subKeys = Object.keys(subGroups).sort((a,b)=>{
        const sa = rows[subGroups[a][0]].startDate || '';
        const sb = rows[subGroups[b][0]].startDate || '';
        return sa.localeCompare(sb);
      });

      subKeys.forEach(subKey=>{
        const subIndices = subGroups[subKey];
        const first = rows[subIndices[0]];
        const label = dateRangeLabel(first.startDate, first.endDate);
        const subCollapsed = collapsedSubGroups.includes(subKey);
        const escapedSubKey = subKey.replace(/'/g,"\\'");

        const subHeaderTr = document.createElement('tr');
        subHeaderTr.className = 'subgroup-header' + (subCollapsed ? ' collapsed' : '');
        subHeaderTr.innerHTML = `<td colspan="12" onclick="toggleSubGroup('${escapedSubKey}')"><div style="display:flex;align-items:center;gap:6px"><i class="ti ti-chevron-down sub-ti"></i>${label}<span class="group-count">${subIndices.length}건</span><span style="margin-left:auto;display:flex;gap:4px"><button class="sec-btn" onclick="event.stopPropagation();setSectionTarget([${subIndices.join(',')}],'${first.startDate}','${first.endDate}');document.getElementById('excelInput').click()" title="이 구간 엑셀 업로드"><i class="ti ti-file-spreadsheet" style="font-size:11px"></i> 엑셀 업로드</button><button class="sec-btn" onclick="event.stopPropagation();setSectionTarget([${subIndices.join(',')}]);document.getElementById('acctInput').click()" title="이 구간 계좌정보 업로드"><i class="ti ti-building-bank" style="font-size:11px"></i> 계좌 업로드</button><button class="sec-btn" onclick="event.stopPropagation();resetSectionExcel([${subIndices.join(',')}])" title="이 구간 협력사·이체금액·정산일 초기화"><i class="ti ti-eraser" style="font-size:11px"></i> 초기화</button><button class="sec-btn" onclick="event.stopPropagation();resetSectionAcct([${subIndices.join(',')}])" title="이 구간 대표자·계좌·은행 초기화"><i class="ti ti-trash" style="font-size:11px"></i> 계좌 초기화</button><button class="sec-btn" style="color:#E24B4A;border-color:#F5C0BF" onclick="event.stopPropagation();deleteSectionRows([${subIndices.join(',')}])" title="이 구간 행 전체 삭제"><i class="ti ti-trash-x" style="font-size:11px"></i> 전체 삭제</button></span></div></td>`;
        tb.appendChild(subHeaderTr);

        if(!subCollapsed){
          subIndices.forEach(i=>{
            const tr = document.createElement('tr');
            tr.dataset.idx = i;
            tr.innerHTML = rowHtml(rows[i], i);
            tb.appendChild(tr);
          });

          const subtotal = subIndices.reduce((s,i)=>s+(parseFloat(String(rows[i].amount).replace(/[^0-9.\-]/g,''))||0),0);
          const subtotalTr = document.createElement('tr');
          subtotalTr.className = 'group-subtotal';
          subtotalTr.innerHTML = `<td colspan="8" class="subtotal-label">${label} 이체 합계</td><td class="subtotal-amt">${formatAmount(subtotal)}</td><td colspan="4"></td>`;
          tb.appendChild(subtotalTr);
        }
      });
    }
  });

  updateSummary();
  updateFilterBtnStates();
}

function updateFilterBtnStates(){
  document.querySelectorAll('#headRow .filter-btn').forEach(btn=>{
    btn.classList.toggle('active', !!columnFilters[btn.dataset.key]);
  });
}

function statusClass(v){
  return v==='완료' ? 'done' : v==='미완료' ? 'pending' : 'none';
}

// 완료 ↔ 미완료 토글 (정산현황·세금계산서)
function toggleStatus(i, field, btn){
  const val = rows[i][field]==='완료' ? '미완료' : '완료';
  rows[i][field] = val;
  btn.className = 'status-btn ' + statusClass(val);
  btn.textContent = val==='완료' ? '✓ 완료' : '✗ 미완료';
  autoSave();
  if(field==='settle') updateSummary();
}

function settleTypeClass(v){
  return v==='일선정산' ? 'type-il' : v==='주정산' ? 'type-ju' : v==='보험료 소급' ? 'type-so' : 'none';
}

function settleTypeLabel(v){
  return v==='일선정산' ? '일선정산' : v==='주정산' ? '주정산' : v==='보험료 소급' ? '보험료 소급' : '-';
}

// 일선정산 → 주정산 → 보험료 소급 순환 (빈칸 → 일선정산 → 주정산 → 보험료 소급 → 일선정산 ...)
function toggleSettleType(i, btn){
  const cur = rows[i].settleType;
  const val = cur==='일선정산' ? '주정산' : cur==='주정산' ? '보험료 소급' : '일선정산';
  rows[i].settleType = val;
  btn.className = 'status-btn ' + settleTypeClass(val);
  btn.textContent = settleTypeLabel(val);
  autoSave();
}

function resetSectionExcel(indices){
  if(!confirm(`이 구간 ${indices.length}건의 협력사명·이체금액·정산시작일·정산종료일을 초기화할까요?`)) return;
  indices.forEach(i=>{
    rows[i].company=''; rows[i].amount='';
    rows[i].startDate=today; rows[i].endDate=today;
  });
  autoSave(); render();
}

function resetSectionAcct(indices){
  if(!confirm(`이 구간 ${indices.length}건의 대표자·계좌번호·은행을 초기화할까요?`)) return;
  indices.forEach(i=>{ rows[i].rep=''; rows[i].acct=''; rows[i].bank=''; });
  autoSave(); render();
}

function deleteSectionRows(indices){
  if(!confirm(`이 구간 ${indices.length}건을 모두 삭제할까요?\n되돌릴 수 없어요.`)) return;
  const idxSet = new Set(indices);
  rows = rows.filter((_,i)=>!idxSet.has(i));
  if(rows.length===0) rows.push({startDate:today,endDate:today,company:'',rep:'',acct:'',bank:'',settleType:'',amount:'',settle:'미완료',tax:'미완료',memo:''});
  autoSave(); render();
}

function formatAmount(v){
  if(v===''||v===null||v===undefined) return '';
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  if(isNaN(n)) return '';
  return n.toLocaleString('ko-KR',{maximumFractionDigits:0});
}

function updateSummary(){
  const tab = curTab();
  const base = rows.filter(r=>inTab(r, tab));
  const total = base.length;
  const done = base.filter(r=>r.settle==='완료').length;
  const pending = total - done;
  const totalAmt = base.reduce((s,r)=>s+(parseFloat(String(r.amount).replace(/[^0-9.\-]/g,''))||0),0);
  const tabName = tab==='ALL' ? '전체' : tab==='none' ? '날짜없음' : groupKey(tab+'-01');
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="stat-label">${tabName} 건수</div><div class="stat-val amber">${total}건</div></div>
    <div class="stat"><div class="stat-label">정산 완료</div><div class="stat-val green">${done}건</div></div>
    <div class="stat"><div class="stat-label">정산 미완료</div><div class="stat-val amber">${pending}건</div></div>
    <div class="stat"><div class="stat-label">총 이체금액</div><div class="stat-val amber">${totalAmt.toLocaleString()}원</div></div>
  `;
}

function addRow(){
  const newIdx = rows.length;
  rows.push({startDate:today,endDate:today,company:'',rep:'',acct:'',bank:'',settleType:'',amount:'',settle:'미완료',tax:'미완료',memo:''});
  if(monthTab!=='ALL') setMonthTab(today.slice(0,7));
  autoSave();
  render();
  setTimeout(()=>{
    const tr = document.querySelector(`#tbody tr[data-idx="${newIdx}"]`);
    const inputs = tr ? tr.querySelectorAll('input') : [];
    if(inputs[2]) inputs[2].focus();
  },50);
}

function delRow(i){
  if(rows.length<=1){alert('마지막 행은 삭제할 수 없어요.');return;}
  if(confirm('이 행을 삭제할까요?')){rows.splice(i,1);autoSave();render();}
}

let autoTimer;
let _lastSyncStr = null; // 내 저장으로 발생한 realtime 이벤트 무시용

function setSaveStatus(state){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  if(state==='saving'){
    el.className='save-status saving';
    el.innerHTML='<i class="ti ti-loader-2"></i><span>저장 중...</span>';
  } else if(state==='loading'){
    el.className='save-status saving';
    el.innerHTML='<i class="ti ti-loader-2"></i><span>불러오는 중...</span>';
  } else {
    const now = new Date();
    const t = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
    el.className='save-status saved';
    el.innerHTML='<i class="ti ti-cloud-check"></i><span>저장됨 '+t+'</span>';
  }
}

async function saveToDB(){
  const payload = {
    id: _RECORD,
    rows,
    acct_map: acctMap,
    collapsed_groups: collapsedGroups,
    collapsed_sub_groups: collapsedSubGroups,
    updated_at: new Date().toISOString()
  };
  _lastSyncStr = JSON.stringify(rows);
  // localStorage 백업
  localStorage.setItem('settle_rows',           JSON.stringify(rows));
  localStorage.setItem('settle_collapsed',       JSON.stringify(collapsedGroups));
  localStorage.setItem('settle_sub_collapsed',   JSON.stringify(collapsedSubGroups));
  localStorage.setItem('settle_acctmap',         JSON.stringify(acctMap));
  const { error } = await sb.from('settlement_data').upsert(payload);
  if(error) console.error('Supabase 저장 오류:', error);
}

function autoSave(){
  setSaveStatus('saving');
  clearTimeout(autoTimer);
  autoTimer = setTimeout(async ()=>{
    await saveToDB();
    setSaveStatus('saved');
  }, 400);
}

function forceSave(){
  clearTimeout(autoTimer);
  saveToDB().then(()=>setSaveStatus('saved'));
}

function subscribeToChanges(){
  sb.channel('settlement-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'settlement_data', filter:`id=eq.${_RECORD}`}, payload=>{
      if(!payload.new || !payload.new.rows) return;
      const d = payload.new;
      // 내 저장으로 발생한 이벤트 무시
      if(_lastSyncStr && JSON.stringify(d.rows) === _lastSyncStr){ _lastSyncStr=null; return; }
      _lastSyncStr = null;
      rows              = d.rows;
      acctMap           = d.acct_map           || {};
      collapsedGroups    = d.collapsed_groups    || [];
      collapsedSubGroups = d.collapsed_sub_groups|| [];
      migrateRows(rows);
      render();
      setSaveStatus('saved');
    })
    .subscribe();
}

async function init(){
  setSaveStatus('loading');
  try {
    const { data, error } = await sb.from('settlement_data').select('*').eq('id', _RECORD).single();
    if(!error && data && data.rows){
      rows              = data.rows.length ? data.rows : rows;
      acctMap           = data.acct_map            || {};
      collapsedGroups    = data.collapsed_groups    || [];
      collapsedSubGroups = data.collapsed_sub_groups|| [];
      migrateRows(rows);
    }
  } catch(e){ console.warn('Supabase 로드 실패, localStorage 사용:', e); }
  render();
  initColResize();
  setSaveStatus('saved');
  subscribeToChanges();
}

function excelDateToStr(v){
  if(v instanceof Date && !isNaN(v)) {
    return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  }
  if(typeof v==='string'){
    const m = v.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
    if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    return v;
  }
  if(typeof v==='number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
  }
  return today;
}

function importExcel(file){
  if(!file) return;
  const target = sectionTarget; sectionTarget = null;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    if(aoa.length < 2){ alert('데이터가 없는 파일이에요.'); return; }

    const header = aoa[0].map(h=>String(h||'').trim());
    const startCol = header.findIndex(h=>h.includes('정산시작일'));
    const endCol = header.findIndex(h=>h.includes('정산종료일'));
    let companyCol = header.findIndex(h=>h.includes('협력사명'));
    if(companyCol===-1) companyCol = header.findIndex(h=>h.includes('협력사')&&!h.includes('아이디')&&!h.toUpperCase().includes('ID'));
    const amountCol = header.findIndex(h=>h.includes('정산예정금액'));

    if(companyCol===-1||amountCol===-1){
      alert('필요한 컬럼(협력사명/정산예정금액)을 찾을 수 없어요.');
      return;
    }

    const dataRows = aoa.slice(1).filter(r=>r && r[companyCol]);

    if(target){
      // 섹션별 업로드: 해당 섹션 행 순서대로 업데이트, 초과분은 섹션 날짜로 신규 추가
      let updated = 0, added = 0;
      dataRows.forEach((r, idx)=>{
        const rowIdx = target.indices[idx];
        if(rowIdx !== undefined){
          rows[rowIdx].company = String(r[companyCol]);
          rows[rowIdx].amount  = Number(r[amountCol]||0).toFixed(0);
          rows[rowIdx].startDate = target.startDate;
          rows[rowIdx].endDate   = target.endDate;
          updated++;
        } else {
          rows.push({startDate:target.startDate, endDate:target.endDate,
            company:String(r[companyCol]), rep:'', acct:'', bank:'',
            settleType:'', amount:Number(r[amountCol]||0).toFixed(0), settle:'미완료', tax:'미완료', memo:''});
          added++;
        }
      });
      autoFillNewRows(); render(); autoSave();
      alert(`${updated}건 업데이트, ${added}건 신규 추가했어요.`);
    } else {
      // 전체 업로드
      if(startCol===-1||endCol===-1){
        alert('필요한 컬럼(정산시작일/정산종료일)을 찾을 수 없어요.'); return;
      }
      if(rows.length===1 && !rows[0].company && !rows[0].amount) rows = [];
      let added = 0;
      dataRows.forEach(r=>{
        rows.push({startDate:excelDateToStr(r[startCol]), endDate:excelDateToStr(r[endCol]),
          company:String(r[companyCol]), rep:'', acct:'', bank:'',
          settleType:'', amount:Number(r[amountCol]||0).toFixed(0), settle:'미완료', tax:'미완료', memo:''});
        added++;
      });
      autoFillNewRows(); render(); autoSave();
      alert(`${added}건의 데이터를 불러왔어요.`);
    }
  };
  reader.readAsArrayBuffer(file);
  document.getElementById('excelInput').value='';
}

function importAccountInfo(file){
  if(!file) return;
  const target = sectionTarget; sectionTarget = null;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    if(aoa.length < 2){ alert('데이터가 없는 파일이에요.'); return; }

    const header = aoa[0].map(h=>String(h||'').trim());
    let companyCol = header.findIndex(h=>h.includes('협력사명'));
    if(companyCol===-1) companyCol = header.findIndex(h=>h.includes('협력사')&&!h.includes('아이디')&&!h.toUpperCase().includes('ID'));
    const repCol = header.findIndex(h=>h.includes('대표자'));
    let acctCol = header.findIndex(h=>h.includes('계좌번호'));
    if(acctCol===-1) acctCol = header.findIndex(h=>h.includes('계좌'));
    let bankCol = header.findIndex(h=>h.includes('은행명'));
    if(bankCol===-1) bankCol = header.findIndex(h=>h.includes('은행'));

    if(companyCol===-1||repCol===-1||acctCol===-1||bankCol===-1){
      alert('필요한 컬럼(소속협력사/대표자/계좌번호/은행)을 찾을 수 없어요.');
      return;
    }

    const infoMap = {};
    for(let i=1;i<aoa.length;i++){
      const r = aoa[i];
      const company = String(r[companyCol]||'').trim();
      if(!company) continue;
      infoMap[company] = {
        rep: String(r[repCol]||'').trim(),
        acct: String(r[acctCol]||'').trim(),
        bank: String(r[bankCol]||'').trim()
      };
    }

    // 섹션 또는 전체에서 협력사명 기준 매칭
    const targetIndices = target ? target.indices : rows.map((_,i)=>i);
    let updated = 0;
    targetIndices.forEach(i=>{
      const r = rows[i];
      if(r.company && infoMap[r.company]){
        const info = infoMap[r.company];
        r.rep = info.rep; r.acct = info.acct; r.bank = info.bank;
        acctMap[r.company] = info;
        updated++;
      }
    });

    const unmatched = Object.keys(infoMap).filter(c=>!targetIndices.some(i=>rows[i].company===c)).length;

    localStorage.setItem('settle_acctmap', JSON.stringify(acctMap));
    render(); autoSave();

    let msg = `${updated}건의 계좌정보를 갱신했어요.`;
    if(unmatched>0) msg += `\n소속협력사가 일치하지 않는 ${unmatched}건은 반영되지 않았어요.`;
    alert(msg);
  };
  reader.readAsArrayBuffer(file);
  document.getElementById('acctInput').value='';
}

function exportCSV(){
  const headers=['정산시작일','정산종료일','소속협력사','대표자','계좌','은행','정산구분','이체금액','정산현황','세금계산서발행','메모'];
  const lines=['\uFEFF'+headers.join(',')];
  rows.forEach(r=>lines.push([r.startDate,r.endDate,'"'+r.company+'"','"'+r.rep+'"','"'+r.acct+'"','"'+r.bank+'"',r.settleType||'',r.amount,r.settle,r.tax,'"'+(r.memo||'')+'"'].join(',')));
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='정산현황_'+today+'.csv';a.click();
}

function initColResize(){
  const cols = document.querySelectorAll('#tbl colgroup col');
  const ths = document.querySelectorAll('#headRow th');
  const LAYOUT_VER = '4';
  if(localStorage.getItem('settle_layout_ver') !== LAYOUT_VER){
    localStorage.removeItem('settle_colwidths');
    localStorage.setItem('settle_layout_ver', LAYOUT_VER);
  }
  const saved = JSON.parse(localStorage.getItem('settle_colwidths')||'null');
  if(saved){
    cols.forEach((col,i)=>{ if(saved[i]) col.style.width = saved[i]+'px'; });
  }
  ths.forEach((th,i)=>{
    if(i>=cols.length-1) return; // 마지막(삭제) 컬럼은 크기 조절 제외
    const resizer = document.createElement('span');
    resizer.className = 'col-resizer';
    th.appendChild(resizer);
    resizer.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      const startX = e.pageX;
      const startW = cols[i].getBoundingClientRect().width;
      resizer.classList.add('active');
      function onMove(ev){
        const w = Math.max(30, startW + (ev.pageX - startX));
        cols[i].style.width = w+'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        resizer.classList.remove('active');
        const widths = Array.from(cols).map(c=>c.getBoundingClientRect().width);
        localStorage.setItem('settle_colwidths', JSON.stringify(widths));
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

window.addEventListener('beforeunload', forceSave);

     ▼ 탭: 📑 알디솔루션 정산   (원본: 새로 만듦 — 저장 위치: Supabase fee_state 표의 rd_main 줄)
       - 월 탭 안에 '주차 그룹'(1주차, 2주차…)이 있고, 주차마다 세 항목이 한 묶음:
           ① 알디솔루션 정산현황 : 정산 현황 관리(settlement_data)에서 대표자가 '알디솔루션'인 행 중
                                  정산종료일이 그 주차 기간에 들어가는 행 (읽기 전용, 실시간으로 따라옴)
           ② 배민 일선정산      : 캡쳐 이미지를 올리면 표 머리글 위치를 보고 13개 칸으로 나눠 넣음(OCR)
           ③ 쿠팡 일선정산      : '결제일 기준' 메모 + 협력사·결제금액
       - 정산 현황 관리에 새 기간이 생기면 그 기간의 주차 그룹이 자동으로 만들어짐
       - '확인용 파일 만들기' : 고른 주차만 담은 html 파일을 내려받음. 더블클릭하면 같은 화면이 '읽기 전용'으로 열림 (로그인 불필요)
     ============================================================ -->

<!DOCTYPE html>

<head>

<style>
  :root{
    --bg:#F5F3F8; --ink:#2F2B3A; --muted:#857E99; --faint:#B5AFC6; --line:#ECE8F3; --line2:#DCD5EA;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

  /* ── 월 탭 ── */

  .toolbar button.primary{background:var(--main);color:#fff;border-color:var(--main)}

  /* ── 주차 그룹 ── */
  .week{background:#fff;border:1px solid var(--line2);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 3px rgba(80,60,130,.05)}

  .week-period{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);cursor:default}

  /* ── 항목(섹션) : 색은 --c 계열로 ── */
  .sec{--c:var(--main);--cd:var(--main-d);--cl:var(--main-l);--cll:var(--main-ll);--cline:var(--line2);border:1px solid var(--cline);border-radius:10px;overflow:hidden;background:#fff}
  .sec.bm{--c:var(--bm);--cd:var(--bm-d);--cl:var(--bm-l);--cll:var(--bm-ll);--cline:var(--bm-line)}
  .sec.cp{--c:var(--cp);--cd:var(--cp-d);--cl:var(--cp-l);--cll:var(--cp-ll);--cline:var(--cp-line)}

  .sec-body{overflow-x:auto}
  .handle{color:var(--faint);cursor:grab;display:inline-flex;padding:2px;border-radius:4px}
  .handle:hover{color:var(--ink);background:rgba(255,255,255,.7)}
  .drop-before{box-shadow:0 -3px 0 0 var(--main)}
  .drop-after{box-shadow:0 3px 0 0 var(--main)}
  .sec-btn{background:#fff;border:1px solid var(--cline,var(--line2));border-radius:6px;font-size:12px;padding:4px 10px;cursor:pointer;color:var(--ink);font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .sec-btn:hover{border-color:var(--c,var(--main))}

  .copy .chev{transition:transform .15s;color:var(--main)}
  .copy.closed .chev{transform:rotate(-90deg)}
  .copy.closed .copy-body{display:none}
  .copy-body{padding:0 10px 10px;display:flex;flex-direction:column;gap:10px}
  .week-add{width:100%;padding:12px;border:1px dashed var(--line2);border-radius:12px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
  .week-add:hover{border-color:var(--main);color:var(--ink);background:#fff}

  /* ── 표 (칸 너비는 머리글 오른쪽 끝을 끌어서 조절) ── */
  table.grid{border-collapse:collapse;font-size:13px;table-layout:fixed}

  table.grid th{position:relative;padding:9px 10px;text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;overflow:hidden;text-overflow:ellipsis}
  table.grid td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.grid tbody tr:hover td{background:var(--cll)}
  .col-resizer{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;user-select:none;touch-action:none}
  .col-resizer:hover,.col-resizer.active{background:var(--c)}
  .num{text-align:right}
  .row-num{color:var(--faint);font-size:11px;text-align:center}
  .subtotal td{background:var(--cl);font-weight:600}
  .subtotal .sub-label{text-align:right;color:var(--muted);font-weight:500}
  .badge{display:inline-block;font-size:12px;padding:3px 11px;border-radius:20px;border:1px solid;font-weight:500;white-space:nowrap}

  .badge.type-ju{background:#F1E8F8;color:#7A3FA0;border-color:#C9A5E0}
  .badge.type-so{background:#FBE7E8;color:#B04A51;border-color:#EBA9AD}
  .editable{background:transparent;border:none;outline:none;font-size:13px;color:var(--ink);width:100%;font-family:inherit;padding:3px 5px;border-radius:5px}
  .editable:focus{background:var(--cll);outline:2px solid var(--c);outline-offset:-1px}
  .editable.num{text-align:right}
  table.grid td.fill{padding:0}
  table.grid td.del-cell{padding:4px 2px;text-overflow:clip;text-align:center}

  .ocr-table td input.n{text-align:right}

  .ocr-progress{padding:30px 0;text-align:center;color:var(--main-d)}

  .ocr-progress .bar i{display:block;height:100%;background:var(--main);width:0;transition:width .2s}
  details.raw{margin-top:12px;color:var(--muted)}

  #flash.show{opacity:1;transform:translate(-50%,0)}
  /* 배민: 수수료 차감 표시 / 대표자 필터 / 수수료 미차감 표 */
  td .adj{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
  td .adj[hidden],td .raw[hidden]{display:none}

  td .adj small{font-size:10.5px;color:var(--muted);font-weight:400}
  .th-filter{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:4px;border-radius:4px;color:var(--faint);cursor:pointer;vertical-align:middle}
  .th-filter:hover{background:#fff;color:var(--ink)}
  .th-filter.on{color:var(--bm-d);background:#fff}
  .hmenu{position:fixed;z-index:150;width:240px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(47,43,58,.15);padding:8px;font-size:12px}

  .hm-sort{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line)}

  .hm-sort button:hover{background:var(--main-ll)}
  .hm-search{width:100%;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;font:inherit;font-size:12px;margin-bottom:6px}
  .hm-actions{display:flex;justify-content:space-between;margin-bottom:4px}

  .hm-list{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:2px}
  .hm-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer}
  .hm-item:hover{background:var(--main-ll)}
  .hm-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hm-item em{font-style:normal;color:var(--faint)}
  .hm-btns{display:flex;gap:6px;margin-top:8px}

  .hm-btns button.primary{background:var(--main);border-color:var(--main);color:#fff}
  .fee-box{margin:12px;border:1px dashed var(--bm-line);border-radius:10px;overflow:hidden}
  .fee-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bm-ll);flex-wrap:wrap;font-size:13px;color:var(--bm-d)}
  .fee-head .sec-actions{margin-left:auto}
  .fee-rate-wrap{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
  input.fee-rate{width:46px;padding:3px 5px;border:1px solid var(--bm-line);border-radius:5px;font:inherit;font-size:12px;text-align:right}
  td.neg{color:var(--cp-d);font-weight:600}
  .fee-ok{color:var(--bm-d);font-size:12px}
  .fee-no{color:var(--cp-d);font-size:12px}
  body.ro .owner-only{display:none!important}
  @media(max-width:768px){
    .wrap{padding:1rem .75rem}
    .topbar{padding:0 1rem}
    .week-sum{margin-left:0}
  }
</style>

       ["정산구분", 100], ["이체금액 (원)", 112, "num"], ["정산현황", 96], ["세금계산서 발행", 106], ["메모", 90]],

/* ── 데이터 ──
   D.weeks : [{ id, month:"2026-10", title:"1주차", start, end, order, sections:["rd","bm","cp"],

   D.months: 직접 추가한 월 목록 */

let settleRows = READONLY ? [] : (loadJSON("settle_rows", []) || []);
let UI = Object.assign({ month: "", closed: [], colw: {} }, READONLY ? {} : loadJSON(LS_UI, {}));
let rowMap = new Map();       // 주차 id → 그 주차의 알디솔루션 행
let cloudReady = false;       // 클라우드에서 불러오기 전에는 클라우드에 덮어쓰지 않음

function loadJSON(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function pad(n) { return String(n).padStart(2, "0"); }

function fmt(v) {
  if (v === "" || v == null) return "";

  return isNaN(n) ? "" : n.toLocaleString("ko-KR", { maximumFractionDigits: 0 });
}
function won(n) { return Math.round(n).toLocaleString("ko-KR") + "원"; }
function sum(list, key) { return list.reduce((s, r) => s + num(r[key]), 0); }

function fixWeek(w) {
  w = Object.assign({}, w);
  w.id = w.id || uid();
  w.month = w.month || "";
  w.title = w.title ?? "";

  w.sections = [...new Set([...secs, ...SECTIONS])];
  w.baemin = (Array.isArray(w.baemin) ? w.baemin : []).map(b => Object.assign({ id: uid() }, b));
  const c = w.coupang && typeof w.coupang === "object" ? w.coupang : {};

  const bf = w.bmFee && typeof w.bmFee === "object" ? w.bmFee : {};

  w.copies = (Array.isArray(w.copies) ? w.copies : []).map(x => {

    c.sections = c.sections.filter(sec => sec === "rd" || (sec === "bm" && c.baemin.length) || (sec === "cp" && (c.coupang.rows.length || c.coupang.basis)));
    return c;
  });

}
function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  const out = { weeks: (Array.isArray(d.weeks) ? d.weeks : []).map(fixWeek), months: Array.isArray(d.months) ? d.months : [],
                dismissed: Array.isArray(d.dismissed) ? d.dismissed : [] };   // 삭제한 주차 기간 (자동으로 다시 만들지 않음)
  // 예전 형식(월별 배민·쿠팡)으로 저장된 내용은 그 달의 '기존 입력분' 주차로 옮김
  const oldBm = Array.isArray(d.baemin) ? d.baemin : [];
  const oldCp = d.coupang && typeof d.coupang === "object" && !Array.isArray(d.coupang.rows) ? d.coupang : {};
  new Set([...oldBm.map(b => b.month || ""), ...Object.keys(oldCp)]).forEach(mk => {
    const bm = oldBm.filter(b => (b.month || "") === mk);
    const cp = oldCp[mk] || { basis: "", rows: [] };
    if (!bm.length && !(cp.rows || []).length && !cp.basis) return;
    out.weeks.push(fixWeek({ month: mk, title: "기존 입력분", order: 999,
      baemin: bm.map(b => ({ id: b.id, company: b.item || "", settle: b.amount || "" })), coupang: cp }));
  });
  return out;
}

/* ── 월 / 주차 ── */
function isRd(r) { return String(r.rep || "").replace(/\s/g, "").includes(RD_NAME); }
function rdRows() { return settleRows.filter(isRd); }
function rowDate(r) { return r.endDate || r.startDate || ""; }
function monthOf(d) { return /^\d{4}-\d{2}/.test(d || "") ? d.slice(0, 7) : ""; }
function monthLabel(k) { if (!k) return "날짜 없음"; const [y, m] = k.split("-"); return `${y.slice(2)}년 ${parseInt(m, 10)}월`; }
function curMonthKey() { const t = new Date(); return t.getFullYear() + "-" + pad(t.getMonth() + 1); }
function shortDate(d) { if (!d) return ""; const [, m, dd] = d.split("-"); return `${parseInt(m, 10)}.${parseInt(dd, 10)}`; }
function periodLabel(w) { return !w.start && !w.end ? "기간 없음" : w.start === w.end ? shortDate(w.start) : `${shortDate(w.start)} ~ ${shortDate(w.end)}`; }
function W(id) {   // 주차 또는 주차 안의 복사 묶음
  for (const w of D.weeks) {
    if (w.id === id) return w;
    const c = (w.copies || []).find(x => x.id === id);
    if (c) return c;
  }
  return null;
}
function blocksOf(w) {   // 화면 순서: 날짜가 이 주차보다 이르거나 같은 복사 묶음 → 이 주차 → 늦은 복사 묶음
  const cs = [...(w.copies || [])].sort((a, b) => (a.start || "").localeCompare(b.start || ""));
  const before = cs.filter(c => !w.start || (c.start || "") <= w.start);
  return [...before, w, ...cs.filter(c => !before.includes(c))];
}
function weeksOf(mk) { return D.weeks.filter(w => w.month === mk).sort((a, b) => a.order - b.order); }
function maxOrder(mk) { return weeksOf(mk).reduce((m, w) => Math.max(m, w.order), 0); }
function weekOfRow(r) {   // 그 행이 원래 속하는 주차 (복사본 주차는 제외)
  const d = rowDate(r);
  const list = weeksOf(monthOf(d)).filter(w => !w.linked);
  if (!d) return list.find(w => !w.start && !w.end) || null;
  return list.find(w => w.start && w.end && w.start <= d && d <= w.end) || null;
}
function newWeek(mk, title, start, end) {
  const w = fixWeek({ month: mk, title: title ?? `${weeksOf(mk).length + 1}주차`, start, end, order: maxOrder(mk) + 1 });
  D.weeks.push(w);
  return w;
}
function isDismissed(r) {
  const d = rowDate(r);
  return D.dismissed.some(p => d ? (p.start && p.end && p.start <= d && d <= p.end) : (!p.start && !p.end));
}
/* 정산 현황 관리에 아직 주차가 없는 기간이 있으면 그 기간의 주차를 만듦 (삭제한 기간은 제외) */
function ensureWeeks() {
  if (READONLY) return false;
  const periods = {};
  rdRows().forEach(r => {
    if (weekOfRow(r) || isDismissed(r)) return;
    const s = r.startDate || r.endDate || "", e = r.endDate || r.startDate || "";
    periods[s + "__" + e] = { s, e };
  });
  const list = Object.values(periods).sort((a, b) => (a.s || "9").localeCompare(b.s || "9"));
  let made = 0;
  list.forEach(p => {
    if (weekOfRow({ startDate: p.s, endDate: p.e })) return;
    const mk = monthOf(p.e);
    const w = newWeek(mk, p.e ? "" : "날짜 없음", p.s, p.e); made++;
    // 기간 순서에 맞는 자리에 끼워 넣음 (기간 없는 주차보다는 앞)
    const rest = weeksOf(mk).filter(x => x !== w);
    let i = rest.findIndex(x => !x.start || x.start > p.s);
    if (i < 0) i = rest.length;
    rest.splice(i, 0, w);
    rest.forEach((x, n) => x.order = n + 1);
  });
  return made > 0;
}
function buildRowMap() {
  const m = new Map();
  if (READONLY) { D.weeks.forEach(w => blocksOf(w).forEach(b => m.set(b.id, b.rd || []))); return m; }
  rdRows().forEach(r => {
    const w = weekOfRow(r); if (!w) return;
    if (!m.has(w.id)) m.set(w.id, []);
    m.get(w.id).push(r);
  });
  // 다른 곳으로 복사한 주차는 같은 기간의 데이터를 그대로 따라옴
  D.weeks.flatMap(blocksOf).filter(w => w.linked && w.start && w.end).forEach(w => {
    m.set(w.id, rdRows().filter(r => { const d = rowDate(r); return d && w.start <= d && d <= w.end; }));
  });
  m.forEach(list => list.sort((a, b) => (a.startDate || "").localeCompare(b.startDate || "")));
  return m;
}
function blockStats(b) {
  const rd = rowMap.get(b.id) || [];
  return { rd, rdSum: sum(rd, "amount"), bmSum: sum(b.baemin, "final"), cpSum: sum(b.coupang.rows, "amount"), bm: b.baemin.length, cp: b.coupang.rows.length };
}
function weekStats(w) {   // 주차 + 복사해 온 묶음 합계
  const t = { rd: [], rdSum: 0, bmSum: 0, cpSum: 0, bm: 0, cp: 0 };
  blocksOf(w).forEach(b => { const s = blockStats(b); t.rd.push(...s.rd); t.rdSum += s.rdSum; t.bmSum += s.bmSum; t.cpSum += s.cpSum; t.bm += s.bm; t.cp += s.cp; });
  return t;
}

  const s = new Set(D.weeks.map(w => w.month));

  return [...s].sort((a, b) => (b || "0").localeCompare(a || "0"));   // 최근 월이 앞, '날짜 없음'은 맨 뒤
}

  if (i >= 0) UI.closed.splice(i, 1); else UI.closed.push(k);

}
function openKey(k) { UI.closed = UI.closed.filter(x => x !== k); saveUi(); }

function render() {
  if (ensureWeeks()) save();
  rowMap = buildRowMap();
  const months = allMonths();
  if (!months.includes(UI.month)) {   // 처음 열면 데이터가 있는 가장 최근 월
    UI.month = months.find(mk => weeksOf(mk).length) ?? months[0] ?? curMonthKey();
  }
  renderMonths(months);
  renderWeeks();
  refreshTotals();
}

function renderMonths(months) {
  const tabs = months.map(mk => {
    const n = weeksOf(mk).length;
    return `<button class="mtab${mk === UI.month ? " on" : ""}" onclick="pickMonth('${mk}')">${monthLabel(mk)}<span class="cnt">${n}주</span></button>`;
  }).join("");
  document.getElementById("months").innerHTML = tabs +
    `<label class="madd owner-only" title="다른 월 추가"><i class="ti ti-plus"></i> 월 추가<input type="month" onchange="addMonth(this.value)"></label>`;
}

function handleHtml(type, id) {
  if (READONLY) return "";
  return `<span class="handle" draggable="true" ondragstart="dragStart(event,'${type}','${id}')" onclick="event.stopPropagation()" title="끌어서 순서 바꾸기"><i class="ti ti-grip-vertical"></i></span>`;
}

function renderWeeks() {
  const list = weeksOf(UI.month);
  let html = list.map(weekHtml).join("");
  if (!list.length) html = `<div class="msg-box" style="margin-bottom:12px">${monthLabel(UI.month)}에는 아직 주차가 없어요.${READONLY ? "" : " 정산 현황 관리에 알디솔루션 데이터가 생기면 자동으로 만들어지고, 아래 버튼으로 직접 만들 수도 있어요."}</div>`;
  if (!READONLY) html += `<button class="week-add" onclick="addWeek()"><i class="ti ti-plus"></i> 주차 추가</button>`;
  document.getElementById("weeks").innerHTML = html;
}

function weekHtml(w) {
  const k = "w:" + w.id;

    : `<input class="week-title" value="${esc(weekTitle(w))}" onclick="event.stopPropagation()" oninput="setWeek('${w.id}','title',this.value)" title="이름 바꾸기">`;
  const period = READONLY ? esc(periodLabel(w))
    : `<input type="date" value="${w.start}" onchange="setWeekDate('${w.id}','start',this.value)"> ~ <input type="date" value="${w.end}" onchange="setWeekDate('${w.id}','end',this.value)">`;
  const actions = READONLY ? "" : `<span class="sec-actions" onclick="event.stopPropagation()">
      <button class="sec-btn" onclick="openCopy('${w.id}')"><i class="ti ti-copy"></i> 다른 월로 복사</button>
      <button class="sec-btn danger" onclick="delWeek('${w.id}')"><i class="ti ti-trash"></i> 주차 삭제</button></span>`;
  return `<div class="week${isClosed(k) ? " closed" : ""}" data-id="${w.id}" onclick="activeWeek='${w.id}'"
      ondragover="dragOver(event,'week','${w.id}')" ondragleave="dragLeave(event)" ondrop="dropOn(event,'week','${w.id}')">
    <div class="week-head" onclick="toggleClosed('${k}')">
      ${handleHtml("week", w.id)}<i class="ti ti-chevron-down chev"></i>${title}
      <span class="week-period" onclick="event.stopPropagation()"><i class="ti ti-calendar"></i> ${period}</span>
      ${w.linked ? `<span class="chip" title="다른 월에서 복사한 주차예요. 이 기간의 알디솔루션 데이터를 그대로 따라와요.">복사본</span>` : ""}

    <div class="week-body">${blocksOf(w).map(b => b === w ? w.sections.map(s => secHtml(w, s)).join("") : copyHtml(b)).join("")}</div>
  </div>`;
}

function copyHtml(c) {
  const k = "c:" + c.id;
  const del = READONLY ? "" : `<button class="sec-btn danger" onclick="event.stopPropagation();delCopy('${c.id}')"><i class="ti ti-trash"></i> 이 복사본 삭제</button>`;

function delCopy(id) {

}

function secHtml(w, s) {

    count = rd.length;

  } else if (s === "bm") {

    body = (READONLY ? "" : `<div class="hint"><i class="ti ti-info-circle"></i> <b>가장 정확한 방법:</b> 배민 정산 화면의 표를 마우스로 끌어 선택해 복사한 뒤, 이 항목을 한 번 누르고 <b>Ctrl+V</b> (또는 붙여넣기 버튼). 줄마다 칸에 맞춰 바로 들어가요. 캡쳐 이미지를 올려도 글자를 읽어서 넣어 줘요.</div>`) + bmTable(w) + feeHtml(w);

        <button class="sec-btn" onclick="pasteButton('${w.id}','cp')" title="엑셀에서 복사한 내용 넣기"><i class="ti ti-clipboard-text"></i> 붙여넣기</button>
        <button class="sec-btn" onclick="addCp('${w.id}')"><i class="ti ti-plus"></i> 행 추가</button>
        <button class="sec-btn danger" onclick="clearCp('${w.id}')"><i class="ti ti-trash"></i> 전체 삭제</button></span>`)
      + `<div class="sec-basis" onclick="event.stopPropagation()"><i class="ti ti-calendar-event"></i> 결제일 기준 `
      + (READONLY ? `<b>${esc(w.coupang.basis) || "-"}</b>`
                  : `<input placeholder="예) 10.1 ~ 10.7 결제분 / 매주 수요일 결제" value="${esc(w.coupang.basis)}" oninput="setBasis('${w.id}',this.value)">`)
      + `</div>`;
    body = (READONLY ? "" : `<div class="hint"><i class="ti ti-info-circle"></i> 엑셀에서 <b>협력사 · 결제금액</b> 칸을 여러 줄 복사한 뒤, 이 항목을 한 번 누르고 <b>Ctrl+V</b> 하면 줄마다 행으로 들어가요.</div>`) + cpTable(w);
  }
  return `<div class="sec ${s}${isClosed(k) ? " closed" : ""}" data-sec="${s}" data-wid="${w.id}" ondragover="dragOver(event,'sec','${id}')" ondragleave="dragLeave(event)" ondrop="dropOn(event,'sec','${id}')">
    <div class="sec-head" onclick="toggleClosed('${k}')">
      ${handleHtml("sec", id)}<i class="ti ti-chevron-down chev"></i>${titleHtml}
      <span class="sec-count">${count}건</span><span class="sec-sum" id="ssum-${w.id}-${s}"></span>${extra}
    </div>
    <div class="sec-body">${body}</div>
  </div>`;
}

/* ── 표 머리 (칸 너비 조절 손잡이 포함) ── */
function colDefs(k) { return READONLY && k !== "rd" ? COLS[k].slice(0, -1) : COLS[k]; }
function colWidths(k) {
  const defs = colDefs(k);
  let saved = (UI.colw || {})[k] || [];
  if (saved.length !== COLS[k].length && saved.length !== defs.length) saved = [];   // 칸이 바뀌었으면 기본 너비
  return defs.map((c, i) => saved[i] || c[1]);
}
function tableOpen(k, thExtra) {
  const ws = colWidths(k);
  return `<table class="grid" data-k="${k}" style="width:100%;min-width:${ws.reduce((a, b) => a + b, 0)}px">
    <colgroup>${ws.map(w => `<col style="width:${w}px">`).join("")}<col></colgroup>
    <thead><tr>${colDefs(k).map((c, i) => `<th class="${c[2] || ""}">${c[0]}${thExtra ? thExtra(i) : ""}${c[0] ? `<span class="col-resizer" onmousedown="startResize(event,'${k}',${i})"></span>` : ""}</th>`).join("")}</tr></thead>`;
}
/* 칸을 줄여도 표 오른쪽이 하얗게 비지 않도록: 줄마다 맨 끝에 남는 폭을 채우는 빈 칸을 붙임 */
function fillRows(html) { return html.replace(/<\/tr>/g, '<td class="fill"></td></tr>'); }
function startResize(e, k, i) {
  e.preventDefault(); e.stopPropagation();
  const ws = colWidths(k), startX = e.pageX, startW = ws[i], el = e.target;
  el.classList.add("active");
  const apply = w => {
    ws[i] = w;
    document.querySelectorAll(`table.grid[data-k="${k}"]`).forEach(t => {
      t.querySelectorAll("col")[i].style.width = w + "px";
      t.style.minWidth = ws.reduce((a, b) => a + b, 0) + "px";
    });
  };
  const mv = ev => apply(Math.max(36, startW + ev.pageX - startX));
  const up = () => {
    document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up);
    el.classList.remove("active");
    UI.colw = UI.colw || {}; UI.colw[k] = ws; saveUi();
  };
  document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
}

/* 정산 현황 관리와 같은 칸으로 보여줌 (읽기 전용) */
function settleTypeClass(v) { return v === "일선정산" ? "type-il" : v === "주정산" ? "type-ju" : v === "보험료 소급" ? "type-so" : "none"; }
function statusBadge(v) { return v === "완료" ? `<span class="badge done">✓ 완료</span>` : `<span class="badge pending">✗ 미완료</span>`; }
function rdTable(list) {
  if (!list.length) return `<div class="empty">이 주차 기간에 대표자가 '${RD_NAME}'인 정산 데이터가 없어요.</div>`;
  const body = list.map((r, i) => `<tr>
      <td class="row-num">${i + 1}</td>
      <td>${esc(r.startDate)}</td><td>${esc(r.endDate)}</td>
      <td title="${esc(r.company)}">${esc(r.company)}</td><td>${esc(r.rep)}</td>
      <td>${esc(r.acct)}</td><td>${esc(r.bank)}</td>
      <td><span class="badge ${settleTypeClass(r.settleType)}">${esc(r.settleType) || "-"}</span></td>
      <td class="num">${fmt(r.amount)}</td>
      <td>${statusBadge(r.settle)}</td><td>${statusBadge(r.tax)}</td>
      <td title="${esc(r.memo)}">${esc(r.memo)}</td>
    </tr>`).join("");
  return fillRows(tableOpen("rd") + `<tbody>${body}<tr class="subtotal"><td colspan="8" class="sub-label">이체 합계</td><td class="num">${fmt(sum(list, "amount"))}</td><td colspan="3"></td></tr></tbody></table>`);
}

/* 입력칸 (공유 보기에서는 글자만) */
function cellInput(val, handler, opts = {}) {
  if (READONLY) return opts.amount ? fmt(val) : esc(val);
  if (opts.amount) {
    return `<input class="editable num" value="${fmt(val)}" onfocus="this.value=this.value.replace(/[^0-9\\-]/g,'')" onblur="this.value=fmt(this.value)" oninput="${handler}">`;
  }
  return `<input class="editable" placeholder="${opts.ph || ""}" value="${esc(val)}" oninput="${handler}">`;
}
function delCell(fn) { return READONLY ? "" : `<td class="del-cell"><button class="del-btn" onclick="${fn}" title="삭제">✕</button></td>`; }

function bmTable(w) {
  if (!w.baemin.length) return `<div class="empty">아직 배민 일선정산 내역이 없어요.${READONLY ? "" : " 표를 복사해서 붙여넣거나 캡쳐를 올려 주세요."}</div>`;
  const rows = bmRows(w);
  const body = rows.map((b, i) => `<tr><td class="row-num">${i + 1}</td>`
    + BM_FIELDS.map(f => f.k === "diff"
        ? `<td class="num" id="bd-${b.id}"><span class="raw">${cellInput(b.diff, `setBm('${w.id}','${b.id}','diff',this.value)`, { amount: true })}</span><span class="adj" hidden></span></td>`
        : `<td class="${f.amount ? "num" : ""}">${cellInput(b[f.k], `setBm('${w.id}','${b.id}','${f.k}',this.value)`, { amount: f.amount })}</td>`).join("")
    + delCell(`delBm('${w.id}','${b.id}')`) + `</tr>`).join("");
  const filtered = rows.length !== w.baemin.length;
  const foot = `<tr class="subtotal"><td colspan="${BM_TEXT.length + 1}" class="sub-label">합계${filtered ? ` (필터 ${rows.length} / ${w.baemin.length}건)` : ""}</td>`
    + BM_AMOUNT.map(k => `<td class="num" id="bf-${w.id}-${k}"></td>`).join("") + (READONLY ? "" : "<td></td>") + `</tr>`;
  const holderCol = BM_FIELDS.findIndex(f => f.k === "holder") + 1;
  const on = bmView[w.id] && bmView[w.id].holders;
  const thExtra = i => i === holderCol ? `<span class="th-filter${on ? " on" : ""}" title="대표자(계좌주)로 정렬·골라 보기" onclick="openHolderMenu(event,'${w.id}')"><i class="ti ti-filter"></i></span>` : "";
  return fillRows(tableOpen("bm", thExtra) + `<tbody>${body}${foot}</tbody></table>`);
}

/* ── 대표자(계좌주) 정렬 · 필터 ── 정렬은 저장되고, 필터는 이 화면에서만 */
let bmView = {};   // 묶음 id → { holders: Set(보이는 계좌주) }
function bmRows(w) { const v = bmView[w.id]; return v && v.holders ? w.baemin.filter(b => v.holders.has(b.holder || "")) : w.baemin; }
function openHolderMenu(e, wid) {
  e.stopPropagation();
  const w = W(wid); if (!w) return;
  const menu = document.getElementById("holderMenu");
  const vals = [...new Set(w.baemin.map(b => b.holder || ""))].sort((a, b) => a.localeCompare(b, "ko"));
  const cur = (bmView[wid] || {}).holders;
  menu.innerHTML = `<div class="hm-sort">
      <button onclick="sortBm('${wid}',1)"><i class="ti ti-sort-ascending-letters"></i> 대표자 오름차순 (가→하)</button>
      <button onclick="sortBm('${wid}',-1)"><i class="ti ti-sort-descending-letters"></i> 대표자 내림차순 (하→가)</button></div>
    <input class="hm-search" placeholder="대표자 검색" oninput="hmSearch(this.value)">
    <div class="hm-actions"><a onclick="hmAll(true)">모두 선택</a><a onclick="hmAll(false)">모두 지우기</a></div>
    <div class="hm-list">${vals.map(v => `<label class="hm-item"><input type="checkbox" value="${esc(v)}" ${!cur || cur.has(v) ? "checked" : ""}><span>${esc(v) || "(빈칸)"}</span><em>${w.baemin.filter(b => (b.holder || "") === v).length}</em></label>`).join("")}</div>
    <div class="hm-btns"><button onclick="closeHolderMenu()">취소</button><button class="primary" onclick="applyHolder('${wid}')">확인</button></div>`;
  const r = e.currentTarget.getBoundingClientRect();
  menu.style.top = (r.bottom + 4) + "px";
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 250)) + "px";
  menu.hidden = false;
}
function closeHolderMenu() { document.getElementById("holderMenu").hidden = true; }
function hmSearch(q) { q = q.trim().toLowerCase(); document.querySelectorAll("#holderMenu .hm-item").forEach(el => el.style.display = el.textContent.toLowerCase().includes(q) ? "" : "none"); }
function hmAll(on) { document.querySelectorAll("#holderMenu .hm-item").forEach(el => { if (el.style.display !== "none") el.querySelector("input").checked = on; }); }
function applyHolder(wid) {
  const boxes = [...document.querySelectorAll("#holderMenu .hm-item input")];
  bmView[wid] = boxes.every(b => b.checked) ? {} : { holders: new Set(boxes.filter(b => b.checked).map(b => b.value)) };
  closeHolderMenu(); render();
}
function sortBm(wid, dir) {
  const w = W(wid); if (!w) return;
  w.baemin.sort((a, b) => {
    const x = a.holder || "", y = b.holder || "";
    if (!x !== !y) return x ? -1 : 1;   // 빈칸은 항상 맨 아래
    return x.localeCompare(y, "ko") * dir || (a.company || "").localeCompare(b.company || "", "ko");
  });
  closeHolderMenu(); save(); render();
}
document.addEventListener("click", e => { const m = document.getElementById("holderMenu"); if (!m.hidden && !e.target.closest("#holderMenu")) m.hidden = true; });

/* ── 배민 일선정산 수수료 미차감된 협력사 내역 ──
   수수료 = 총배달료 × 수수료율(기본 1.1%), 최종 정산액 = 본 정산액 − 수수료
   협력사 이름이 같은 배민 행이 있으면 그 행의 정산차액에서 수수료를 뺌 (원래 값은 그대로 두고 계산해서 보여줌) */
function nameKey(s) { return String(s || "").replace(/\s/g, "").toLowerCase(); }
function feeAmount(w, f) { return Math.round(num(f.total) * (parseFloat(w.bmFee.rate) || 0) / 100); }
function feeByCompany(w) {
  const m = {};
  w.bmFee.rows.forEach(f => { const k = nameKey(f.company); if (k) m[k] = (m[k] || 0) + feeAmount(w, f); });
  return m;
}
function adjDiff(w, b, fees) { const fee = (fees || feeByCompany(w))[nameKey(b.company)]; return fee ? { fee, value: num(b.diff) - fee } : null; }
function diffValue(w, b, fees) { const a = adjDiff(w, b, fees); return a ? String(a.value) : b.diff; }
function feeHtml(w) {
  const F = w.bmFee;
  const rate = READONLY ? `<b>${esc(F.rate)}%</b>` : `<input class="fee-rate" value="${esc(F.rate)}" oninput="setFeeRate('${w.id}',this.value)">%`;
  const actions = READONLY ? "" : `<span class="sec-actions">
      <button class="sec-btn" onclick="pasteButton('${w.id}','fee')" title="엑셀에서 복사한 내용 넣기"><i class="ti ti-clipboard-text"></i> 붙여넣기</button>
      <button class="sec-btn" onclick="addFee('${w.id}')"><i class="ti ti-plus"></i> 행 추가</button>
      ${F.rows.length ? `<button class="sec-btn danger" onclick="clearFee('${w.id}')"><i class="ti ti-trash"></i> 전체 삭제</button>` : ""}</span>`;
  const amt = (f, k) => READONLY ? fmt(f[k])
    : `<input class="editable num" value="${fmt(f[k])}" onfocus="this.value=this.value.replace(/[^0-9\\-]/g,'')" onblur="this.value=fmt(this.value)" oninput="setFee('${w.id}','${f.id}','${k}',this.value)">`;
  const body = F.rows.map((f, i) => `<tr>
      <td class="row-num">${i + 1}</td>
      <td>${READONLY ? esc(f.company) : `<input class="editable" placeholder="협력사명" value="${esc(f.company)}" oninput="setFee('${w.id}','${f.id}','company',this.value)">`}</td>
      <td class="num">${amt(f, "total")}</td>
      <td class="num" id="ff-${f.id}"></td>
      <td class="num">${amt(f, "settle")}</td>

  const table = F.rows.length ? fillRows(tableOpen("fee") + `<tbody>${body}<tr class="subtotal"><td colspan="2" class="sub-label">합계</td>`
      + `<td class="num" id="ft-${w.id}-total"></td><td class="num" id="ft-${w.id}-fee"></td><td class="num" id="ft-${w.id}-settle"></td><td class="num" id="ft-${w.id}-final"></td><td></td>${READONLY ? "" : "<td></td>"}</tr></tbody></table>`)
    : `<div class="empty">${READONLY ? "없음" : "수수료가 차감되지 않은 협력사가 있으면 행 추가 또는 엑셀에서 복사해 붙여넣기 해 주세요. (협력사 · 총배달료 · 수수료 · 본 정산액 · 최종 정산액)"}</div>`;
  return `<div class="fee-box">
    <div class="fee-head"><i class="ti ti-receipt-tax"></i><b>배민 일선정산 수수료 미차감된 협력사 내역</b>
      <span class="fee-rate-wrap">수수료율 ${rate}</span>${actions}</div>

}
function setFeeRate(wid, v) { const w = W(wid); if (!w) return; w.bmFee.rate = v; save(); refreshTotals(); }
function setFee(wid, fid, k, v) { const f = (W(wid) || { bmFee: { rows: [] } }).bmFee.rows.find(x => x.id === fid); if (!f) return; f[k] = v; save(); refreshTotals(); }
function addFee(wid) { const w = W(wid); if (!w) return; w.bmFee.rows.push({ id: uid(), company: "", total: "", settle: "" }); save(); render(); }
function delFee(wid, fid) { if (!confirm("이 행을 삭제할까요?")) return; const w = W(wid); w.bmFee.rows = w.bmFee.rows.filter(x => x.id !== fid); save(); render(); }
function clearFee(wid) {
  const w = W(wid); if (!w || !w.bmFee.rows.length) return;
  if (!confirm(`수수료 미차감 협력사 ${w.bmFee.rows.length}건을 모두 삭제할까요?`)) return;
  w.bmFee.rows = []; save(); render();
}
function pasteFee(wid, text) {
  const w = W(wid); if (!w) return;
  const add = [];
  text.replace(/\r/g, "").split("\n").forEach(line => {
    const cells = line.split("\t").map(c => c.trim()).filter(Boolean);
    const nums = cells.filter(looksMoney), texts = cells.filter(c => !looksMoney(c));
    if (!nums.length) return;   // 제목·머리글 줄

    const total = nums[0], settle = nums.length >= 3 ? nums[2] : nums.length === 2 ? nums[1] : "";
    add.push({ id: uid(), company: texts[0] || "", total: cleanAmount(total), settle: settle ? cleanAmount(settle) : "" });

function cpTable(w) {

/* 합계만 다시 계산 (입력 중에 화면을 다시 그리지 않도록) */
function refreshTotals() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  let tJu = 0, tDiff = 0, tCp = 0;   // 맨 위 요약: 알디 '주정산' 합계 · 배민 정산차액 합계 (수수료 차감 반영) · 쿠팡 결제금액 합계
  weeksOf(UI.month).forEach(w => {
    blocksOf(w).forEach(b => {
      tJu += (rowMap.get(b.id) || []).filter(r => r.settleType === "주정산").reduce((t, r) => t + num(r.amount), 0);
      const allFees = feeByCompany(b);
      tDiff += b.baemin.reduce((t, r) => t + num(diffValue(b, r, allFees)), 0);
      tCp += sum(b.coupang.rows, "amount");
      const bs = blockStats(b);
      set(`ssum-${b.id}-rd`, "이체 합계 " + won(bs.rdSum));
      set(`ssum-${b.id}-bm`, "최종송금 합계 " + won(bs.bmSum));
      set(`ssum-${b.id}-cp`, "결제 합계 " + won(bs.cpSum));
      const fees = feeByCompany(b), vis = bmRows(b);
      BM_AMOUNT.forEach(k => set(`bf-${b.id}-${k}`, fmt(k === "diff" ? vis.reduce((t, r) => t + num(diffValue(b, r, fees)), 0) : sum(vis, k))));
      vis.forEach(r => {   // 수수료가 있는 협력사는 정산차액을 차감한 값으로
        const td = document.getElementById("bd-" + r.id); if (!td) return;
        const a = adjDiff(b, r, fees);
        td.querySelector(".raw").hidden = !!a;
        const adj = td.querySelector(".adj"); adj.hidden = !a;
        if (a) adj.innerHTML = `<b>${fmt(a.value)}</b><small>원래 ${fmt(r.diff)} − 수수료 ${fmt(a.fee)}</small>`;
        td.title = a ? `원래 정산차액 ${fmt(r.diff)}에서 수수료 ${fmt(a.fee)}을 뺀 값이에요. (수수료는 아래 '수수료 미차감 협력사 내역'에서 고칠 수 있어요)` : "";
      });
      const bmNames = new Set(b.baemin.map(r => nameKey(r.company))), ft = { total: 0, fee: 0, settle: 0, final: 0 };
      b.bmFee.rows.forEach(f => {
        const fee = feeAmount(b, f), fin = num(f.settle) - fee;
        ft.total += num(f.total); ft.fee += fee; ft.settle += num(f.settle); ft.final += fin;
        set("ff-" + f.id, fmt(fee));
        const fn = document.getElementById("fn-" + f.id); if (fn) { fn.textContent = fmt(fin); fn.className = "num" + (fin < 0 ? " neg" : ""); }
        const st = document.getElementById("fs-" + f.id);
        if (st) st.innerHTML = !nameKey(f.company) ? "" : bmNames.has(nameKey(f.company))
          ? `<span class="fee-ok"><i class="ti ti-check"></i> 정산차액에서 차감</span>` : `<span class="fee-no"><i class="ti ti-alert-triangle"></i> 일치하는 협력사 없음</span>`;
      });
      Object.entries(ft).forEach(([k, v]) => set(`ft-${b.id}-${k}`, fmt(v)));
      set(`cf-${b.id}`, fmt(bs.cpSum));
    });
  });
  document.getElementById("summary").innerHTML = `
    <div class="stat"><div class="stat-label">${monthLabel(UI.month)} 알디솔루션 주정산 합계</div><div class="stat-val">${won(tJu)}</div></div>
    <div class="stat bm"><div class="stat-label">${monthLabel(UI.month)} 배민 일선정산 정산차액 합계</div><div class="stat-val">${won(tDiff)}</div></div>
    <div class="stat cp"><div class="stat-label">${monthLabel(UI.month)} 쿠팡 일선정산 결제금액 합계</div><div class="stat-val">${won(tCp)}</div></div>`;
}

/* =========================================================

function setWeek(id, k, v) { const w = W(id); if (!w) return; w[k] = v; save(); }

function delCp(wid, id) { if (!confirm("이 행을 삭제할까요?")) return; const w = W(wid); w.coupang.rows = w.coupang.rows.filter(x => x.id !== id); save(); render(); }

/* ── 끌어서 순서 바꾸기 (주차끼리 / 같은 주차 안의 항목끼리) ── */
let drag = null;
function dragStart(e, type, id) {
  drag = { type, id };
  e.stopPropagation();
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", id); } catch (_) {}
}
function dragOver(e, type, id) {
  if (!drag || drag.type !== type) return;
  if (type === "sec" && drag.id.split(":")[0] !== id.split(":")[0]) return;
  e.preventDefault(); e.stopPropagation();
  const el = e.currentTarget, r = el.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  el.classList.toggle("drop-after", after); el.classList.toggle("drop-before", !after);
}
function dragLeave(e) { e.currentTarget.classList.remove("drop-before", "drop-after"); }
function dropOn(e, type, id) {
  if (!drag || drag.type !== type) return;
  e.preventDefault(); e.stopPropagation();
  const el = e.currentTarget, after = el.classList.contains("drop-after");
  el.classList.remove("drop-before", "drop-after");
  const src = drag.id; drag = null;
  if (src === id) return;
  if (type === "week") {
    const list = weeksOf(UI.month), moving = W(src);
    const rest = list.filter(w => w.id !== src);
    let i = rest.findIndex(w => w.id === id); if (after) i++;
    rest.splice(i, 0, moving);
    rest.forEach((w, n) => w.order = n + 1);
  } else {
    const [wid, s] = src.split(":"), t = id.split(":")[1], w = W(wid);
    const arr = w.sections.filter(x => x !== s);
    let i = arr.indexOf(t); if (after) i++;
    arr.splice(i, 0, s); w.sections = arr;
  }
  save(); render();
}
document.addEventListener("dragend", () => {
  drag = null;
  document.querySelectorAll(".drop-before,.drop-after").forEach(el => el.classList.remove("drop-before", "drop-after"));
});

/* ── 주차 복사 (다른 월로) ── */
let copySrc = null;
function shiftMonths(d, n) {
  if (!d) return "";
  const [y, m, dd] = d.split("-").map(Number);
  const t = new Date(y, m - 1 + n, 1), last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(Math.min(dd, last))}`;
}
function openCopy(id) {
  const w = W(id); if (!w) return;
  copySrc = id;
  document.getElementById("copyTitle").textContent = `'${weekTitle(w)}' (${periodLabel(w)}) 복사`;
  document.getElementById("copyRdLabel").textContent = `알디솔루션 정산현황 (${(rowMap.get(w.id) || []).length}건 · 같은 기간으로 연동)`;
  document.getElementById("copyMonth").value = w.month ? shiftMonths(w.month + "-01", 1).slice(0, 7) : curMonthKey();
  fillCopyTargets();
  document.getElementById("copyModal").hidden = false;
}
function fillCopyTargets() {
  const mk = document.getElementById("copyMonth").value;
  document.getElementById("copyTarget").innerHTML = `<option value="new">새 주차로 추가</option>`
    + weeksOf(mk).filter(w => w.id !== copySrc).map(w => `<option value="${w.id}">${esc(weekTitle(w))} (${esc(periodLabel(w))}) 안에 넣기</option>`).join("");
}
function doCopy() {
  const src = W(copySrc), mk = document.getElementById("copyMonth").value;
  if (!src || !/^\d{4}-\d{2}$/.test(mk)) { alert("복사할 월을 골라 주세요."); return; }
  const tgt = document.getElementById("copyTarget").value;
  // 알디솔루션 정산현황 박스만 복제 (날짜 그대로 → 같은 기간 데이터를 계속 따라옴). 배민·쿠팡은 가져오지 않음
  const clone = (b, host) => ({
    id: uid(), parent: host.id, month: host.month, linked: true, from: b.from || b.month, title: weekTitle(b),
    start: b.start, end: b.end, sections: ["rd"], copies: [], baemin: [], coupang: { basis: "", rows: [] },
  });
  let dst;
  if (tgt === "new") {   // 새 큰 박스: 날짜 그대로 (배민·쿠팡은 빈 칸) + 안에 있던 복사 묶음도 함께
    dst = newWeek(mk, weekTitle(src), src.start, src.end);
    dst.linked = true;
    dst.copies = src.copies.map(c => clone(c, dst));
  } else {               // 기존 큰 박스 안에 알디솔루션 박스를 넣음 (날짜순 자리에 놓임)
    dst = W(tgt);
    dst.copies.push(clone(src, dst), ...src.copies.map(c => clone(c, dst)));
  }
  if (!D.months.includes(mk)) D.months.push(mk);
  closeModal("copyModal");
  UI.month = mk; saveUi(); save(); render();
}

function closeModal(id) { document.getElementById(id).hidden = true; }

/* =========================================================
   저장 (브라우저 + 클라우드) / 불러오기 / 실시간 따라오기
   ========================================================= */
let pushTimer = null;
function setCloud(state) {
  const el = document.getElementById("saveStatus");
  const map = {
    saving: ["saving", "ti-loader-2", "저장 중..."],
    loading: ["saving", "ti-loader-2", "불러오는 중..."],
    err: ["err", "ti-cloud-off", "클라우드 저장 실패 (이 브라우저에는 저장됨)"],
    local: ["err", "ti-cloud-off", "이 브라우저에만 저장"],
  };
  if (map[state]) {
    const [c, i, t] = map[state];
    el.className = "save-status owner-only " + c; el.innerHTML = `<i class="ti ${i}"></i><span>${t}</span>`;
  } else {
    const d = new Date();
    el.className = "save-status owner-only";
    el.innerHTML = `<i class="ti ti-cloud-check"></i><span>저장됨 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}</span>`;
  }
}
function save() {
  if (READONLY) return;
  try { localStorage.setItem(LS_DATA, JSON.stringify(D)); } catch (e) {}
  if (!sb || !cloudReady) return;
  setCloud("saving");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 600);
}
async function pushNow() {
  if (!cloudReady) return;
  try {
    const { error } = await sb.from(SB_TABLE).upsert({ id: SB_ID, data: D, updated_at: new Date().toISOString() });
    if (error) throw error;
    setCloud("ok");
  } catch (e) { console.warn("알디솔루션 정산 저장 실패:", e.message || e); setCloud("err"); }
}

/* 정산 현황 관리 데이터가 바뀌면 → 입력 중이 아니면 바로 다시 그림 */
let lastSettleStr = "", pendingRender = false;
function onSettleRows(rows) {
  if (!Array.isArray(rows)) return;
  const s = JSON.stringify(rows);
  if (s === lastSettleStr) return;
  lastSettleStr = s; settleRows = rows;
  const a = document.activeElement;
  if (a && a.tagName === "INPUT" && a.closest("#weeks")) { pendingRender = true; rowMap = buildRowMap(); refreshTotals(); }
  else render();
}
document.addEventListener("focusout", () => setTimeout(() => {
  const a = document.activeElement;
  if (pendingRender && !(a && a.tagName === "INPUT" && a.closest("#weeks"))) { pendingRender = false; render(); }
}, 0));
// 같은 브라우저의 정산 현황 관리 탭이 저장하면 바로 알 수 있음
window.addEventListener("storage", e => {
  if (READONLY || e.key !== "settle_rows" || !e.newValue) return;
  try { onSettleRows(JSON.parse(e.newValue)); } catch (_) {}
});

async function fetchSettle() {
  const { data, error } = await sb.from("settlement_data").select("rows").eq("id", "main").maybeSingle();
  if (error) throw error;
  return data && Array.isArray(data.rows) ? data.rows : null;
}
async function loadCloud() {
  lastSettleStr = JSON.stringify(settleRows);
  render();
  if (!sb) { setCloud("local"); return; }
  setCloud("loading");
  try {
    const [rows, mine] = await Promise.all([fetchSettle(), sb.from(SB_TABLE).select("data").eq("id", SB_ID).maybeSingle()]);
    if (mine.error) throw mine.error;
    if (rows) { settleRows = rows; lastSettleStr = JSON.stringify(rows); }
    const hadCloud = !!(mine.data && mine.data.data);
    if (hadCloud) D = normalize(mine.data.data);
    cloudReady = true;
    try { localStorage.setItem(LS_DATA, JSON.stringify(D)); } catch (e) {}
    const made = ensureWeeks();
    if (!hadCloud || made || mine.data.data.baemin) await pushNow(); else setCloud("ok");   // 처음이거나 바뀐 게 있으면 올림
    render();
  } catch (e) { console.warn("알디솔루션 정산 불러오기 실패:", e.message || e); setCloud("err"); }

  // 다른 컴퓨터에서 바꿔도 따라오도록: 실시간 알림 + 30초마다 한 번 확인
  sb.channel("rd-settle-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "settlement_data", filter: "id=eq.main" }, p => {
      if (p.new && Array.isArray(p.new.rows)) onSettleRows(p.new.rows);

/* =========================================================
   배민 일선정산 — 캡쳐 글자 인식 (Tesseract.js, 처음 쓸 때 한 번 내려받음)
   1) 캡쳐를 크게 키우고 흑백으로 또렷하게
   2) 글자마다 위치(x, y)를 받아서 같은 높이끼리 한 줄로 묶음
   3) 머리글(협력사명·은행명…) 줄을 찾아 칸 위치를 정하고, 각 글자를 가장 가까운 칸에 넣음
      (머리글이 없으면 '계좌번호 → 금액들' 순서로 나눔)
   ========================================================= */
let ocr = null;            // { weekId, images:[url], rows:[{use, ...칸}], raw, status, progress }
