<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>통합 정산 관리</title>
<!--
  ============================================================
  ■ 이 파일의 구조 (한 파일 안에 세 화면이 들어 있어요)
  ------------------------------------------------------------
  1) 맨 위 "탭 막대"  : 버튼을 누르면 화면이 바뀝니다.
  2) <template id="page-fee">    : 💳 수수료 지급표  (원본: 수수료/수수료 지급표.html)
  3) <template id="page-settle"> : 🧾 정산 현황 관리 (원본: settlement/index.html)
  4) <template id="page-todo">   : ✅ 업무 투두 (캘린더형 할 일 목록, 이 파일에서 새로 만듦)

  - 각 화면은 서로 섞이지 않도록 따로따로(칸막이 안에서) 실행됩니다.
  - 데이터는 두 원본과 똑같은 Supabase 저장소를 그대로 쓰므로
    지금까지 저장된 내용이 모두 그대로 보입니다.
  - 🔒 로그인해야 화면이 열립니다 (Supabase 로그인 계정 필요).
  - 탭을 하나 더 추가하려면: 아래 TABS 목록에 한 줄 추가 +
    <template id="page-새이름"> ... </template> 블록을 하나 더 붙이면 됩니다.
  ============================================================
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#191919;color:#e6e6e6;display:flex;flex-direction:column;overflow:hidden}
  .tabbar{flex:none;background:#202020;border-bottom:1px solid #2f2f2f;display:flex;align-items:flex-end;gap:4px;padding:0 1.25rem;height:52px;overflow-x:auto}
  .tabbar .brand{font-size:15px;font-weight:700;margin-right:18px;align-self:center;white-space:nowrap}
  .tab{appearance:none;border:none;background:none;font:inherit;font-size:14px;color:#8a8a8a;padding:0 16px;height:44px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;border-radius:8px 8px 0 0}
  .tab:hover{color:#e6e6e6;background:#2a2a2a}
  .tab.on{color:#fff;font-weight:700;border-bottom-color:#2383e2}
  .pages{flex:1;position:relative;min-height:0}
  .pages iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#191919}
  .pages iframe[hidden]{display:none}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a8a8a;font-size:14px}
  @media(max-width:640px){ .tabbar{padding:0 .5rem} .tabbar .brand{display:none} .tab{padding:0 10px;font-size:13px} }
  /* ── 🔒 로그인 화면 ── */
  .login-wrap{position:fixed;inset:0;z-index:50;background:#191919;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-wrap[hidden]{display:none}
  .login-box{width:100%;max-width:340px;background:#202020;border:1px solid #2f2f2f;border-radius:14px;padding:28px 24px}
  .login-box h1{font-size:18px;margin-bottom:6px}
  .login-box p{font-size:13px;color:#8a8a8a;margin-bottom:20px}
  .login-box label{display:block;font-size:12px;color:#aaa;margin:12px 0 6px}
  .login-box input{width:100%;height:42px;border-radius:8px;border:1px solid #3a3a3a;background:#191919;color:#fff;padding:0 12px;font:inherit;font-size:15px}
  .login-box input:focus{outline:none;border-color:#2383e2}
  .login-box button{width:100%;height:44px;margin-top:20px;border:none;border-radius:8px;background:#2383e2;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .login-box button:disabled{opacity:.6;cursor:default}
  .login-msg{min-height:18px;margin-top:12px;font-size:13px;color:#ff7b7b;text-align:center}
  .logout{margin-left:auto;align-self:center;appearance:none;border:1px solid #3a3a3a;background:none;color:#aaa;font:inherit;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .logout:hover{color:#fff;border-color:#666}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="tabbar" id="tabbar">
  <span class="brand">📊 통합 정산 관리</span>
</nav>
<main class="pages" id="pages"><div class="loading" id="loading">불러오는 중…</div></main>

<!-- 🔒 로그인 화면 : 로그인해야 데이터가 보여요 -->
<div class="login-wrap" id="loginWrap" hidden>
  <form class="login-box" id="loginForm" autocomplete="on">
    <h1>🔒 통합 정산 관리</h1>
    <p>로그인해야 볼 수 있어요.</p>
    <label for="loginEmail">이메일</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPw">비밀번호</label>
    <input id="loginPw" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">로그인</button>
    <div class="login-msg" id="loginMsg"></div>
  </form>
</div>

<script>
/* ── 탭 목록 : [화면 id, 탭에 보일 이름, 화면 크기(1 = 100%)] ── */
const TABS = [
  ["fee",    "💳 수수료 지급표",   0.9],   // 90% 크기로 보기
  ["settle", "🧾 정산 현황 관리", 1],
  ["todo",   "✅ 업무 투두",       1],
];

const frames = {};
const bar = document.getElementById("tabbar");
const pages = document.getElementById("pages");

TABS.forEach(([id, name]) => {
  const b = document.createElement("button");
  b.className = "tab"; b.textContent = name; b.dataset.id = id;
  b.onclick = () => showTab(id);
  bar.appendChild(b);
});

function showTab(id) {
  if (!TABS.some(t => t[0] === id)) id = TABS[0][0];
  // 처음 여는 탭이면 그때 화면을 만든다 (한 번 만든 화면은 그대로 유지)
  if (!frames[id]) {
    const tpl = document.getElementById("page-" + id);
    const f = document.createElement("iframe");
    f.title = id;
    const scale = TABS.find(t => t[0] === id)[2] || 1;
    if (scale !== 1) {   // 화면 전체를 scale 배율로 줄여서 보여줌
      f.style.width  = (100 / scale) + "%";
      f.style.height = (100 / scale) + "%";
      f.style.transform = "scale(" + scale + ")";
      f.style.transformOrigin = "0 0";
    }
    f.srcdoc = '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"></head><body>' + tpl.innerHTML + '</body></html>';
    pages.appendChild(f);
    frames[id] = f;
  }
  document.getElementById("loading").hidden = true;
  Object.entries(frames).forEach(([k, f]) => f.hidden = (k !== id));
  bar.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  document.title = TABS.find(t => t[0] === id)[1].replace(/^\S+\s/, "") + " · 통합 정산 관리";
  try { localStorage.setItem("merged_last_tab", id); } catch (e) {}
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}

/* =========================================================
   🔒 로그인 (Supabase 로그인)
   - 로그인하면 이 컴퓨터/휴대폰이 기억해서, 다음부터는 바로 열려요.
   - 로그아웃 버튼을 누르면 다시 로그인해야 해요.
   ========================================================= */
const AUTH_URL = "https://micquonnaxyhwxwksctf.supabase.co";
const AUTH_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pY3F1b25uYXh5aHd4d2tzY3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTY0MDgsImV4cCI6MjA5NjY5MjQwOH0.9S0DhscVBWUw1nerK5weF5GMoJaTTZHLtL91yOaqHR0";
let authSb = null;
let started = false;

function openFirstTab() {
  if (started) return;
  started = true;
  let first = location.hash.slice(1);
  if (!first) { try { first = localStorage.getItem("merged_last_tab"); } catch (e) {} }
  showTab(first || TABS[0][0]);
}

function showLogin(msg) {
  // 열려 있던 화면을 모두 치운다 (데이터가 남아 보이지 않게)
  Object.values(frames).forEach(f => f.remove());
  Object.keys(frames).forEach(k => delete frames[k]);
  started = false;
  document.getElementById("loading").hidden = true;
  document.getElementById("loginWrap").hidden = false;
  document.getElementById("loginMsg").textContent = msg || "";
  const lo = document.getElementById("logoutBtn"); if (lo) lo.hidden = true;
}

function afterLogin() {
  document.getElementById("loginWrap").hidden = true;
  const lo = document.getElementById("logoutBtn"); if (lo) lo.hidden = false;
  openFirstTab();
}

document.addEventListener("DOMContentLoaded", async () => {
  window.addEventListener("hashchange", () => { if (started) showTab(location.hash.slice(1)); });

  // 로그아웃 버튼 (탭 막대 오른쪽 끝)
  const lo = document.createElement("button");
  lo.className = "logout"; lo.id = "logoutBtn"; lo.textContent = "로그아웃"; lo.hidden = true;
  lo.onclick = async () => {
    if (!confirm("로그아웃할까요?")) return;
    try { await authSb.auth.signOut(); } catch (e) {}
    showLogin("로그아웃했어요.");
  };
  bar.appendChild(lo);

  if (!window.supabase) {
    document.getElementById("loading").textContent = "인터넷 연결을 확인해 주세요. (로그인 기능을 불러오지 못했어요)";
    return;
  }
  authSb = window.supabase.createClient(AUTH_URL, AUTH_KEY);

  // 이미 로그인되어 있으면 바로 열기
  const { data } = await authSb.auth.getSession();
  if (data && data.session) afterLogin(); else showLogin();

  // 로그인 버튼
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const msg = document.getElementById("loginMsg");
    btn.disabled = true; btn.textContent = "확인 중…"; msg.textContent = "";
    const { error } = await authSb.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPw").value,
    });
    btn.disabled = false; btn.textContent = "로그인";
    if (error) { msg.textContent = "이메일 또는 비밀번호가 맞지 않아요."; return; }
    document.getElementById("loginPw").value = "";
    afterLogin();
  });
});
</script>


<!-- ============================================================
     ▼ 탭: 💳 수수료 지급표   (원본: 수수료/수수료 지급표.html)
     ============================================================ -->
<template id="page-fee">
<!DOCTYPE html>
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수수료 지급표</title>

<!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- 클라우드 저장(Supabase) 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  @font-face {
    font-family: 'SUIT Variable';
    font-weight: 100 900;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.woff2') format('woff2-variations');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #16181d;
    --ink-soft: #6b7280;
    --ink-faint: #9aa1ab;
    --line: #eef0f3;
    --line-strong: #e3e5ea;
    --accent: #3b6ef5;
    --accent-soft: #eef3ff;
    --done: #16a34a;
    --done-bg: #e9f7ef;
    --wait: #d97706;
    --wait-bg: #fdf3e5;
    --danger: #ef4444;
    --group-bg: #f2f4f8;
    --range-bg: #f8fafc;
    --money: #0e7c86;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.05);
    --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
  }

  body {
    font-family: 'SUIT Variable', 'SUIT', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    letter-spacing: -0.2px;
    padding: 32px 20px 90px;
  }
  .wrap { max-width: 1560px; margin: 0 auto; }

  /* ===== 상단 제목 ===== */
  header.top {
    padding: 2px 4px;
    margin-bottom: 22px;
  }
  header.top h1 { font-size: 25px; font-weight: 800; letter-spacing: -0.6px; color: var(--ink); }
  header.top p { font-size: 13.5px; color: var(--ink-soft); margin-top: 6px; font-weight: 500; }

  /* ===== 요약 카드 ===== */
  .stats { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 20px; min-width: 140px; flex: 1;
    box-shadow: var(--shadow-sm);
  }
  .stat .k { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
  .stat .v { font-size: 25px; font-weight: 800; margin-top: 6px; letter-spacing: -0.8px; }
  .stat.done .v { color: var(--done); }
  .stat.wait .v { color: var(--wait); }
  .stat.money .v { color: var(--money); font-size: 21px; }

  /* ===== 도구 막대 ===== */
  .toolbar {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 14px;
    align-items: center; justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  button {
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    border: 1px solid var(--line-strong); background: #fff; color: var(--ink);
    padding: 9px 14px; border-radius: 10px; cursor: pointer; transition: .15s ease;
    box-shadow: var(--shadow-sm);
  }
  button:hover { background: #f7f8fa; border-color: #d4d7dd; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(59,110,245,.35); }
  button.primary:hover { background: #2f5fe0; border-color: #2f5fe0; }

  /* ===== 검색 바 ===== */
  .search-bar {
    display: flex; align-items: center;
    background: #fff; border: 1px solid var(--line-strong);
    border-radius: 12px; height: 44px; overflow: hidden;
    box-shadow: var(--shadow-sm); transition: .15s;
  }
  .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-bar select {
    border: none; background: transparent; height: 100%;
    padding: 0 12px 0 16px; font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--ink); cursor: pointer; border-right: 1px solid var(--line);
  }
  .search-bar input {
    border: none; background: transparent; height: 100%;
    padding: 0 18px; font-family: inherit; font-size: 14px; width: 300px;
  }
  .search-bar select:focus, .search-bar input:focus { outline: none; }

  .hint { font-size: 13px; color: var(--ink-soft); margin: 2px 4px 14px; line-height: 1.7; }

  /* ===== 표 카드 ===== */
  .table-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; table-layout: fixed; }

  thead th {
    background: #fbfbfc; color: var(--ink-soft);
    font-size: 12px; font-weight: 700; padding: 12px 12px;
    text-align: left; white-space: normal; letter-spacing: -0.2px;
    border-bottom: 1px solid var(--line-strong);
    position: sticky; top: 0; z-index: 2;
  }
  th .th-label {
    display: inline-block; white-space: normal; word-break: keep-all;
    line-height: 1.3; max-width: calc(100% - 30px); vertical-align: middle;
    cursor: grab;
  }
  th.th-move:active .th-label { cursor: grabbing; }
  th.drag-over { box-shadow: inset 3px 0 0 var(--accent); }
  .col-resize {
    position: absolute; top: 0; right: 0; width: 6px; height: 100%;
    cursor: col-resize; z-index: 3;
  }
  .col-resize:hover { background: rgba(47,91,234,.30); }

  /* 컬럼 필터 아이콘 */
  .th-filter {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; line-height: 17px; text-align: center;
    font-size: 10px; color: var(--ink-faint); cursor: pointer; border-radius: 5px;
    background: transparent; z-index: 3; user-select: none;
  }
  .th-filter:hover { background: #e6eaf1; color: var(--ink); }
  .th-filter.active { color: #fff; background: var(--accent); }

  /* 컬럼별 필터/정렬 메뉴 */
  .col-menu {
    position: absolute; z-index: 100; width: 252px;
    background: #fff; border: 1px solid var(--line-strong); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(16,24,40,.20); padding: 8px; font-size: 13.5px;
  }
  .col-menu .cm-sort { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
  .col-menu .cm-sort button { text-align: left; border: none; box-shadow: none; background: transparent; padding: 8px 10px; border-radius: 8px; font-weight: 600; }
  .col-menu .cm-sort button:hover { background: #f1f3f7; }
  .col-menu .cm-search { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 13.5px; margin-bottom: 6px; }
  .col-menu .cm-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .col-menu .cm-allrow { display: flex; justify-content: space-between; padding: 2px 4px 6px; }
  .col-menu .cm-allrow a { color: var(--accent); font-size: 12.5px; cursor: pointer; font-weight: 600; }
  .col-menu .cm-allrow a:hover { text-decoration: underline; }
  .col-menu .cm-list { max-height: 220px; overflow-y: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 0; }
  .col-menu .cm-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .col-menu .cm-item:hover { background: #f6f7f9; }
  .col-menu .cm-item input { width: 15px; height: 15px; accent-color: var(--accent); flex: none; }
  .col-menu .cm-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-menu .cm-empty { padding: 14px; text-align: center; color: var(--ink-soft); }
  .col-menu .cm-foot { display: flex; gap: 8px; margin-top: 8px; }
  .col-menu .cm-foot button { flex: 1; padding: 9px; border-radius: 8px; }

  td {
    border-bottom: 1px solid var(--line);
    padding: 0; font-size: 14px; vertical-align: middle;
    overflow: hidden;
  }
  tbody tr.data-row:hover { background: #f9fafc; }

  td input, td select, td textarea {
    width: 100%; border: none; background: transparent; font-family: inherit;
    font-size: 14px; padding: 11px 12px; color: var(--ink); resize: none;
  }
  td.memo { vertical-align: top; }
  td textarea.memo-ta {
    white-space: pre-wrap; word-break: break-word; overflow: hidden;
    line-height: 1.45; min-height: 44px; display: block;
  }
  td input:focus, td textarea:focus {
    outline: 2px solid var(--accent); outline-offset: -2px; background: #fff; border-radius: 4px;
  }
  td select:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.col-status select:focus { border-radius: 9px; }
  td.date input { font-variant-numeric: tabular-nums; }
  td.acct input { font-family: ui-monospace, "Consolas", monospace; letter-spacing: 0.3px; }
  td.amount input { text-align: right; font-variant-numeric: tabular-nums; color: var(--money); font-weight: 700; }
  td select { cursor: pointer; -webkit-appearance: none; appearance: none; }

  /* 상태 드롭다운 = 원형(알약) 배지, 컬럼별 색상은 인라인 스타일로 지정 */

<script>
/* =========================================================
   0) 컬럼 정의 (순서·너비 조절 대상)
   ========================================================= */
const COL_DEFS = {
  start:   { label: "정산 시작일",          type: "date",   min: 112, def: 126 },
  end:     { label: "정산 종료일",          type: "date",   min: 112, def: 126 },
  branch:  { label: "지사",                 type: "text",   min: 90,  def: 130 },
  ceo:     { label: "대표자",               type: "text",   min: 78,  def: 108 },
  acct:    { label: "계좌번호",             type: "acct",   min: 118, def: 160 },
  bank:    { label: "은행",                 type: "text",   min: 66,  def: 94 },
  amount:  { label: "금액",                 type: "amount", min: 90,  def: 120 },
  form:    { label: "수수료 양식 전달현황", type: "status", min: 96,  def: 116 },
  pay:     { label: "수수료 지급현황",      type: "status", min: 96,  def: 114 },
  invoice: { label: "계산서 발행 완료",     type: "status", min: 96,  def: 116 },
  memo:    { label: "메모",                 type: "text",   min: 150, def: 240 },
};
const DEFAULT_ORDER = ["start","end","branch","ceo","acct","bank","amount","form","pay","invoice","memo"];
const CHK_W = 40, NO_W = 42, DEL_W = 46;

/* 상태 컬럼별 색상 (완료 = 채움 / 미완료 = 연한 배경) */
const STATUS_THEME = {
  form:    { solid: "#2f5bea", tint: "#e7edfd", ink: "#1f3aa6" }, // 양식 전달 = 파랑
  pay:     { solid: "#0f9d58", tint: "#e7f6ee", ink: "#0b6b3c" }, // 지급 = 초록
  invoice: { solid: "#7c3aed", tint: "#f0e9fd", ink: "#5b23b0" }, // 계산서 = 보라
};

/* =========================================================
   1) 데이터 저장소
   ========================================================= */
const STORE_KEY = "fee_payment_rows";
const FOLD_KEY  = "fee_payment_folded";
const ORDER_KEY = "fee_payment_colorder";
const WIDTH_KEY = "fee_payment_colwidth";

/* =========================================================
   ★★★ 클라우드 연결 설정 — 여기 딱 1곳만 채우면 끝! ★★★
   ========================================================= */
const SUPABASE_URL = "https://micquonnaxyhwxwksctf.supabase.co"; // (이미 채워둠 — 그대로 두세요)
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pY3F1b25uYXh5aHd4d2tzY3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTY0MDgsImV4cCI6MjA5NjY5MjQwOH0.9S0DhscVBWUw1nerK5weF5GMoJaTTZHLtL91yOaqHR0";       // ← 여기에만 붙여넣기!
/* ========================================================= */

let sb = null;
try {
  if (window.supabase && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.indexOf("붙여넣기") === -1) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log("[클라우드] 연결 준비 완료 ✅");
  } else {
    console.log("[클라우드] anon 키가 아직 없어요. (지금은 이 브라우저에만 저장됩니다)");
  }
} catch (e) { console.warn("[클라우드] 연결 준비 실패:", e); }

let rows = load(STORE_KEY, []);
let folded = new Set(load(FOLD_KEY, []));
let colWidths = load(WIDTH_KEY, {}) || {};
let selected = new Set();   // 다중선택된 행 id (저장 안 함)
let colFilters = {};        // { 컬럼키: Set(허용값) } — 조회 필터 (세션용)
let sortState = null;       // { key, dir } — 정렬 (세션용)
let menuState = null;       // 열린 필터 메뉴의 임시 상태

let colOrder = load(ORDER_KEY, null) || [...DEFAULT_ORDER];
colOrder = colOrder.filter(k => COL_DEFS[k]);                       // 알 수 없는 키 제거
DEFAULT_ORDER.forEach(k => { if (!colOrder.includes(k)) colOrder.push(k); }); // 누락 보충

/* 시작일 컬럼은 항상 종료일 컬럼보다 앞에 오도록 보장 (뒤집혀 보이는 오류 방지) */
function ensureDatePairOrder() {
  const si = colOrder.indexOf("start");
  const ei = colOrder.indexOf("end");
  if (si > -1 && ei > -1 && si > ei) {
    colOrder.splice(si, 1);                       // start 제거
    colOrder.splice(colOrder.indexOf("end"), 0, "start"); // end 바로 앞에 삽입
  }
}
ensureDatePairOrder();

/* 시작일이 종료일보다 늦으면 두 값을 자동으로 바로잡음 (시작일 ≤ 종료일) */
function fixOrder(r) {
  if (r.start && r.end && r.start > r.end) {
    const t = r.start; r.start = r.end; r.end = t;
  }
  return r;
}

// 예전 데이터 호환: date → start, 새 필드 채우기
rows.forEach(r => {
  if (r.start   === undefined) r.start   = r.date || "";
  if (r.end     === undefined) r.end     = "";
  if (r.amount  === undefined) r.amount  = "";
  if (r.invoice === undefined) r.invoice = "미완료";
  delete r.date;
  fixOrder(r);
  // 기존 데이터는 같은 기간(start~end)끼리 한 덩어리로 유지
  if (r.gid === undefined) r.gid = "g_" + (r.start || "") + "_" + (r.end || "");
});

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch (e) { return fallback; }
}
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(rows));
  localStorage.setItem(FOLD_KEY, JSON.stringify([...folded]));
  localStorage.setItem(ORDER_KEY, JSON.stringify(colOrder));
  localStorage.setItem(WIDTH_KEY, JSON.stringify(colWidths));
  cloudSave(); // ← 클라우드에도 함께 저장
}

/* ---- 불러온 데이터 정리(옛 데이터 호환 + 컬럼순서 보정) ---- */
function normalizeData() {
  colOrder = colOrder.filter(k => COL_DEFS[k]);
  DEFAULT_ORDER.forEach(k => { if (!colOrder.includes(k)) colOrder.push(k); });
  ensureDatePairOrder();
  rows.forEach(r => {
    if (r.start   === undefined) r.start   = r.date || "";
    if (r.end     === undefined) r.end     = "";
    if (r.amount  === undefined) r.amount  = "";
    if (r.invoice === undefined) r.invoice = "미완료";
    delete r.date;
    fixOrder(r);
    if (r.gid === undefined) r.gid = "g_" + (r.start || "") + "_" + (r.end || "");
  });
}

/* ---- 클라우드에 저장 (0.6초 모아서 한 번에) ---- */
let __cloudTimer = null;
function cloudSave() {
  if (!sb) return;
  clearTimeout(__cloudTimer);
  __cloudTimer = setTimeout(async () => {
    try {
      const { error } = await sb.from('fee_state').upsert({
        id: 'main',
        data: { rows, folded: [...folded], colOrder, colWidths },
        updated_at: new Date().toISOString()
      });
      if (error) console.error("[클라우드] 저장 오류:", error.message || error);
    } catch (e) { console.error("[클라우드] 저장 예외:", e); }
  }, 600);
}

/* ---- 클라우드에서 최신 데이터 불러오기 ---- */
async function cloudLoad() {
  if (!sb) return;
  try {
    const { data, error } = await sb.from('fee_state').select('data').eq('id', 'main').maybeSingle();
    if (error) { console.error("[클라우드] 불러오기 오류:", error.message || error); return; }
    if (data && data.data) {
      const d = data.data;
      rows      = Array.isArray(d.rows) ? d.rows : [];
      folded    = new Set(Array.isArray(d.folded) ? d.folded : []);
      colWidths = d.colWidths || {};
      colOrder  = (Array.isArray(d.colOrder) && d.colOrder.length) ? d.colOrder : [...DEFAULT_ORDER];
      normalizeData();
      render();
      console.log("[클라우드] 최신 데이터 불러옴 ✅ (" + rows.length + "건)");
    } else {
      // 클라우드가 비어있으면, 지금 이 브라우저 데이터를 클라우드로 올려둠
      console.log("[클라우드] 처음이라 지금 데이터를 클라우드로 업로드합니다");
      cloudSave();
    }
  } catch (e) { console.error("[클라우드] 불러오기 예외:", e); }
}
function newId() { return Date.now() + "_" + Math.random().toString(36).slice(2, 7); }
function newGid() { return "g_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7); }
function widthOf(k) { return colWidths[k] || COL_DEFS[k].def; }

/* =========================================================
   2) 행 추가 / 삭제 / 수정
   ========================================================= */
function addRow() {
  const today = new Date().toISOString().slice(0, 10);
  rows.unshift({
    id: newId(), gid: newGid(), start: today, end: today,
    branch: "", ceo: "", acct: "", bank: "", amount: "",
    form: "미완료", pay: "미완료", invoice: "미완료", memo: ""
  });
  save();
  render();
}
function deleteRow(id) {
  if (!confirm("이 행을 삭제할까요?")) return;
  rows = rows.filter(r => r.id !== id);
  selected.delete(id);
  save();
  render();
}
function updateField(id, field, value) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  row[field] = value;
  save();
  updateStats();
}
function setRowDate(id, field, value) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  row[field] = value;
  fixOrder(row);   // 시작일 > 종료일이면 자동 정렬
  save();
  render();   // 그룹이 바뀌므로 다시 그림
}
function updateAmount(id, el) {
  const digits = el.value.replace(/[^\d]/g, "");
  el.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
  updateField(id, "amount", digits);
}

/* 기간 그룹 날짜 일괄 지정 → 그 그룹(gid)에 속한 행만 변경 */
function applyGroupDate(gid, btn) {
  const tools = btn.closest(".grp-tools");
  const ns = tools.querySelector(".gs").value;
  const ne = tools.querySelector(".ge").value;
  if (!ns && !ne) { alert("지정할 날짜를 먼저 선택하세요."); return; }

  const targets = rows.filter(r => r.gid === gid);
  if (targets.length === 0) return;
  if (!confirm(`이 그룹 ${targets.length}건의 날짜를 ${ns || "?"} ~ ${ne || "?"} (으)로 일괄 변경할까요?`)) return;

  targets.forEach(r => { r.start = ns; r.end = ne; fixOrder(r); });
  save();
  render();
}

/* =========================================================
   3) 그룹 복사 (별도의 새 덩어리로 생성)
   ========================================================= */
/* 복사본은 새 gid를 부여해 원본과 다른 그룹으로 분리됩니다. */
function copyGroup(gid) {
  const src = rows.filter(r => r.gid === gid);
  if (!src.length) return;
  if (!confirm(`이 그룹 ${src.length}건을 새 그룹으로 복사할까요?\n(날짜·금액·전달/지급/계산서 현황은 초기화되고, 지사·대표자·계좌·은행·메모는 유지됩니다.)`)) return;
  const ngid = newGid();
  rows = rows.concat(src.map(r => ({
    ...r, id: newId(), gid: ngid,
    start: "", end: "", amount: "",
    form: "미완료", pay: "미완료", invoice: "미완료"
  })));
  save();
  render();
}
function copyMonth(mk) {
  const src = rows.filter(r => monthKeyRow(r) === mk);
  if (!src.length) return;
  if (!confirm(`${monthTitle(mk)} 전체 ${src.length}건을 새 그룹으로 복사할까요?\n(날짜·금액·전달/지급/계산서 현황은 초기화되고, 지사·대표자·계좌·은행·메모는 유지됩니다.)`)) return;
  // 원본의 덩어리 구조는 유지하되, 각 덩어리를 새 그룹으로 분리 + 데이터 리셋
  const gidMap = {};
  rows = rows.concat(src.map(r => {
    if (!gidMap[r.gid]) gidMap[r.gid] = newGid();
    return {
      ...r, id: newId(), gid: gidMap[r.gid],
      start: "", end: "", amount: "",
      form: "미완료", pay: "미완료", invoice: "미완료"
    };
  }));
  save();
  render();
}

/* 덩어리(그룹) 통째로 삭제 */
function deleteGroup(gid) {
  const targets = rows.filter(r => r.gid === gid);
  if (!targets.length) return;
  if (!confirm(`이 그룹 ${targets.length}건을 모두 삭제할까요?`)) return;
  rows = rows.filter(r => r.gid !== gid);
  targets.forEach(r => selected.delete(r.id));
  save();
  render();
}
/* 한 달(예: 7월) 전체 삭제 */
function deleteMonth(mk) {
  const targets = rows.filter(r => monthKeyRow(r) === mk);
  if (!targets.length) return;
  if (!confirm(`${monthTitle(mk)} 전체 ${targets.length}건을 삭제할까요?`)) return;
  if (!confirm(`진짜 삭제하시겠습니까?\n${monthTitle(mk)}의 ${targets.length}건이 영구히 삭제됩니다.`)) return;
  const ids = new Set(targets.map(r => r.id));
  rows = rows.filter(r => !ids.has(r.id));
  ids.forEach(id => selected.delete(id));
  save();
  render();
}

/* 그룹 안에 새 행 추가 (같은 gid·같은 시작/종료일로) */
function addRowToChunk(gid) {
  const ref = rows.find(r => r.gid === gid);
  rows.unshift({
    id: newId(), gid,
    start: ref ? ref.start : "", end: ref ? ref.end : "",
    branch: "", ceo: "", acct: "", bank: "", amount: "",
    form: "미완료", pay: "미완료", invoice: "미완료", memo: ""
  });
  save();
  render();
}

/* =========================================================
   3.5) 다중 선택 삭제
   ========================================================= */
function toggleSelect(id, el) {
  if (el.checked) selected.add(id); else selected.delete(id);
  const tr = el.closest("tr");
  if (tr) tr.classList.toggle("sel", el.checked);
  refreshDelBtn();
  syncHeaderCheckbox();
}
function selectAll(check) {
  const ids = getFiltered().map(r => r.id);
  if (check) ids.forEach(id => selected.add(id));
  else ids.forEach(id => selected.delete(id));
  render();
}
function deleteSelected() {
  if (selected.size === 0) { alert("삭제할 행을 먼저 선택하세요."); return; }
  if (!confirm(`선택한 ${selected.size}건을 삭제할까요?`)) return;
  rows = rows.filter(r => !selected.has(r.id));
  selected.clear();
  save();
  render();
}
function refreshDelBtn() {
  const btn = document.getElementById("delSelBtn");
  if (!btn) return;
  btn.textContent = `🗑 선택 삭제 (${selected.size})`;
  btn.disabled = selected.size === 0;
}
function syncHeaderCheckbox() {
  const head = document.getElementById("chkAll");
  if (!head) return;
  const filtered = getFiltered();
  const selCount = filtered.filter(r => selected.has(r.id)).length;
  head.checked = filtered.length > 0 && selCount === filtered.length;
  head.indeterminate = selCount > 0 && selCount < filtered.length;
}

/* =========================================================
   4) 그룹 접기 / 펼치기
   ========================================================= */
function toggleFold(key) {
  if (folded.has(key)) folded.delete(key);
  else folded.add(key);
  save();
  render();
}

/* =========================================================
   5) 날짜 · 그룹 키 유틸
   ========================================================= */
function yearKeyRow(r) {
  const d = r.start || r.end;
  return (d && d.length >= 4) ? d.slice(0, 4) : "no-date";
}
function yearTitle(key) {
  return key === "no-date" ? "날짜 미지정" : `${key}년`;
}
function monthKeyRow(r) {
  const d = r.start || r.end;
  return (d && d.length >= 7) ? d.slice(0, 7) : "no-date";
}
function monthTitle(key) {
  if (key === "no-date") return "날짜 미지정";
  const [y, m] = key.split("-");
  return `${y}년 ${Number(m)}월`;
}
function monthShort(key) {
  if (key === "no-date") return "날짜 미지정";
  return `${Number(key.split("-")[1])}월`;
}
function rangeKeyRow(r) { return `${r.start || ""}~${r.end || ""}`; }
function md(d) {
  if (!d || d.length < 10) return "";
  const [, m, dd] = d.split("-");
  return `${Number(m)}.${Number(dd)}`;
}
function rangeTitle(s, e) {
  if (!s && !e) return "날짜 미지정";
  if (s && e) {
    const [a, b] = s <= e ? [s, e] : [e, s];   // 항상 이른 날짜 ~ 늦은 날짜
    return `${md(a)} ~ ${md(b)}`;
  }
  if (s) return `${md(s)} ~`;
  return `~ ${md(e)}`;
}

/* =========================================================
   6) 요약 카드
   ========================================================= */
function sumAmount(list) {
  return list.reduce((t, r) => t + (Number(r.amount) || 0), 0);
}
function updateStats() {
  const total = rows.length;
  const done = rows.filter(r => r.pay === "완료").length;
  document.getElementById("stTotal").textContent = total + "건";
  document.getElementById("stDone").textContent = done + "건";
  document.getElementById("stWait").textContent = (total - done) + "건";
  document.getElementById("stAmount").textContent = sumAmount(rows).toLocaleString("ko-KR") + "원";
}

/* =========================================================
   7) 검색 필터
   ========================================================= */
function getFiltered() {
  const field = document.getElementById("searchField").value;
  const q = document.getElementById("searchText").value.trim();
  const filterKeys = Object.keys(colFilters);
  return rows.filter(r => {
    if (q && !(r[field] || "").includes(q)) return false;
    for (const key of filterKeys) {
      if (!colFilters[key].has(valueOf(r, key))) return false;
    }
    return true;
  });
}

/* 컬럼 값(비교용) / 표시용 / 정렬 비교 */
function valueOf(r, key) { return String(r[key] ?? ""); }
function displayVal(key, v) {
  if (v === "") return "(값 없음)";
  if (COL_DEFS[key].type === "amount") return Number(v).toLocaleString("ko-KR") + "원";
  return v;
}
function cmpVals(key, a, b) {
  if (a === b) return 0;
  if (a === "") return 1;
  if (b === "") return -1;
  if (COL_DEFS[key].type === "amount") return Number(a) - Number(b);
  return a.localeCompare(b, "ko");
}

/* =========================================================
   7.5) 컬럼별 필터/정렬 메뉴 (엑셀식)
   ========================================================= */
function openColMenu(key, btn) {
  const map = new Map();                       // 값 -> 표시문자열 (중복 제거)
  rows.forEach(r => { const v = valueOf(r, key); if (!map.has(v)) map.set(v, displayVal(key, v)); });
  const values = [...map.keys()].sort((a, b) => cmpVals(key, a, b));
  const checked = colFilters[key] ? new Set(colFilters[key]) : new Set(values);
  menuState = { key, values, displays: map, checked, search: "" };

  const menu = document.getElementById("colMenu");
  menu.innerHTML = `
    <div class="cm-sort">
      <button onclick="colMenuSort('asc')">↑ 오름차순 정렬</button>
      <button onclick="colMenuSort('desc')">↓ 내림차순 정렬</button>
    </div>
    <input class="cm-search" placeholder="검색" oninput="colMenuSearch(this.value)">
    <div class="cm-allrow">
      <a onclick="colMenuToggleAll(true)">모두 선택</a>
      <a onclick="colMenuToggleAll(false)">모두 지우기</a>
    </div>
    <div class="cm-list" id="cmList"></div>
    <div class="cm-foot">
      <button onclick="closeColMenu()">취소</button>
      <button class="primary" onclick="colMenuApply()">확인</button>
    </div>`;
  renderColMenuList();

  menu.style.display = "block";
  const rect = btn.getBoundingClientRect();
  const mw = menu.offsetWidth;
  let left = rect.right + window.scrollX - mw;
  left = Math.max(8 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - mw - 8));
  menu.style.left = left + "px";
  menu.style.top = (rect.bottom + window.scrollY + 4) + "px";
  setTimeout(() => document.addEventListener("mousedown", onDocClickForMenu), 0);
}
function renderColMenuList() {
  const { values, displays, checked, search } = menuState;
  const q = search.trim();
  const items = values
    .map((v, i) => ({ v, i }))
    .filter(o => !q || (displays.get(o.v) || "").includes(q));
  const html = items.map(o =>
    `<label class="cm-item"><input type="checkbox" ${checked.has(o.v) ? "checked" : ""}
        onchange="colMenuToggleIdx(${o.i}, this)"><span>${esc(displays.get(o.v))}</span></label>`
  ).join("");
  document.getElementById("cmList").innerHTML = html || `<div class="cm-empty">일치하는 값이 없어요</div>`;
}
function colMenuToggleIdx(i, el) {
  const v = menuState.values[i];
  if (el.checked) menuState.checked.add(v); else menuState.checked.delete(v);
}
function colMenuToggleAll(check) {
  const q = menuState.search.trim();
  menuState.values.forEach(v => {
    if (!q || (menuState.displays.get(v) || "").includes(q)) {
      if (check) menuState.checked.add(v); else menuState.checked.delete(v);
    }
  });
  renderColMenuList();
}
function colMenuSearch(val) { menuState.search = val; renderColMenuList(); }
function colMenuSort(dir) {
  sortState = { key: menuState.key, dir };
  closeColMenu();
  render();
}
function colMenuApply() {
  const { key, values, checked } = menuState;
  if (checked.size >= values.length) delete colFilters[key];   // 전부 선택 = 필터 없음
  else colFilters[key] = new Set(checked);
  closeColMenu();
  render();
}
function closeColMenu() {
  const menu = document.getElementById("colMenu");
  menu.style.display = "none";
  menu.innerHTML = "";
  menuState = null;
  document.removeEventListener("mousedown", onDocClickForMenu);
}
function onDocClickForMenu(e) {
  const menu = document.getElementById("colMenu");
  if (!menu.contains(e.target) && !e.target.classList.contains("th-filter")) closeColMenu();
}

/* =========================================================
   8) 컬럼 순서 변경 (드래그) / 너비 조절 (리사이즈)
   ========================================================= */
let dragKey = null;
let resizing = null;

function onDragStart(e, key) {
  if (resizing) { e.preventDefault(); return; }
  dragKey = key;
  e.dataTransfer.effectAllowed = "move";
}
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; }
function onDragEnter(e) { e.currentTarget.classList.add("drag-over"); }
function onDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
function onDrop(e, targetKey) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  if (!dragKey || dragKey === targetKey) return;
  const from = colOrder.indexOf(dragKey);
  const to = colOrder.indexOf(targetKey);
  if (from < 0 || to < 0) return;
  colOrder.splice(from, 1);
  colOrder.splice(to, 0, dragKey);
  ensureDatePairOrder();   // 시작일이 종료일보다 앞에 오도록 유지
  dragKey = null;
  save();
  render();
}

function startResize(e, key) {
  e.preventDefault();
  e.stopPropagation();
  resizing = { key, startX: e.clientX, startW: widthOf(key) };
  document.addEventListener("mousemove", onResizeMove);
  document.addEventListener("mouseup", onResizeUp);
  document.body.style.userSelect = "none";
}
function onResizeMove(e) {
  if (!resizing) return;
  const def = COL_DEFS[resizing.key];
  const w = Math.max(def.min, resizing.startW + (e.clientX - resizing.startX));
  colWidths[resizing.key] = w;
  const col = document.getElementById("col-" + resizing.key);
  if (col) col.style.width = w + "px";
  const t = document.getElementById("feeTable");
  if (t) t.style.width = tableWidth() + "px";
}
function onResizeUp() {
  if (!resizing) return;
  resizing = null;
  document.removeEventListener("mousemove", onResizeMove);
  document.removeEventListener("mouseup", onResizeUp);
  document.body.style.userSelect = "";
  save();
}

function resetColumns() {
  if (!confirm("컬럼 순서와 너비를 기본값으로 되돌릴까요?")) return;
  colOrder = [...DEFAULT_ORDER];
  colWidths = {};
  save();
  render();
}

function tableWidth() {
  let w = CHK_W + NO_W + DEL_W;
  colOrder.forEach(k => w += widthOf(k));
  return w;
}

/* =========================================================
   9) 화면 그리기 (월 → 기간 2단 그룹, 컬럼 순서 반영)
   ========================================================= */
function render() {
  updateStats();

  const COLSPAN = colOrder.length + 3;   // 체크박스 + # + 삭제
  const filtered = getFiltered();
  let bodyRows = "";

  if (filtered.length === 0) {
    bodyRows = `<tr class="empty-row"><td colspan="${COLSPAN}">
      ${rows.length === 0
        ? `아직 등록된 내용이 없어요.<br><br><button class="primary" onclick="addRow()">＋ 첫 행 추가</button> 또는 상단의 <b>📂 엑셀 업로드</b>로 시작하세요.`
        : "검색 결과가 없어요.<br>검색어를 지우면 전체가 다시 보입니다."}
    </td></tr>`;
  } else {
    // 1단계: 연도별
    const years = {};
    filtered.forEach(r => { const y = yearKeyRow(r); (years[y] = years[y] || []).push(r); });
    const yKeys = Object.keys(years).sort((a, b) => {
      if (a === "no-date") return 1;
      if (b === "no-date") return -1;
      return b.localeCompare(a);
    });

    yKeys.forEach(yk => {
      const yList = years[yk];
      const yFoldKey = "Y:" + yk;
      const yFold = folded.has(yFoldKey);
      const ySum = sumAmount(yList);

      bodyRows += `<tr class="year-bar ${yFold ? "collapsed" : ""}" onclick="toggleFold('${yFoldKey}')">
        <td colspan="${COLSPAN}">
          <span class="arrow">▼</span>
          <span class="ytitle">${yearTitle(yk)}</span>
          <span class="count">${yList.length}건</span>
          ${ySum ? `<span class="msum">${ySum.toLocaleString("ko-KR")}원</span>` : ""}
        </td></tr>`;
      if (yFold) return;

      // 2단계: 월별
      const months = {};
      yList.forEach(r => { const k = monthKeyRow(r); (months[k] = months[k] || []).push(r); });
      const mKeys = Object.keys(months).sort((a, b) => {
        if (a === "no-date") return 1;
        if (b === "no-date") return -1;
        return b.localeCompare(a);
      });

      mKeys.forEach(mk => {
        const mList = months[mk];
        const mFoldKey = "M:" + mk;
        const mFold = folded.has(mFoldKey);
        const mSum = sumAmount(mList);

        bodyRows += `<tr class="month-bar ${mFold ? "collapsed" : ""}" onclick="toggleFold('${mFoldKey}')">
          <td colspan="${COLSPAN}">
            <span class="arrow">▼</span>
            <span class="mtitle">${monthShort(mk)}</span>
            <span class="count">${mList.length}건</span>
            ${mSum ? `<span class="msum">${mSum.toLocaleString("ko-KR")}원</span>` : ""}
            <span class="grp-tools" onclick="event.stopPropagation()">
              <button class="grp-copy" onclick="copyMonth('${mk}')">📋 이 달 복사</button>
              <button class="grp-del" onclick="deleteMonth('${mk}')">🗑 이 달 삭제</button>
            </span>
          </td></tr>`;
        if (mFold) return;

        // 3단계: 덩어리(gid)별 — 복사본은 날짜가 같아도 별도 덩어리로 표시됨
        const chunks = {};
        const order = [];
        mList.forEach(r => {
          if (!chunks[r.gid]) { chunks[r.gid] = []; order.push(r.gid); }
          chunks[r.gid].push(r);
        });
        const origIdx = {};
        order.forEach((g, i) => { origIdx[g] = i; });
        order.sort((a, b) => {
          const sa = (chunks[a][0].start || "￿"), sb = (chunks[b][0].start || "￿");
          return sa.localeCompare(sb) || origIdx[a] - origIdx[b];
        });

        order.forEach(gid => {
          const rList = chunks[gid];
          const s = rList[0].start || "", e = rList[0].end || "";
          const rFoldKey = "G:" + gid;
          const rFold = folded.has(rFoldKey);
          const rSum = sumAmount(rList);

          bodyRows += `<tr class="range-bar ${rFold ? "collapsed" : ""}">
            <td colspan="${COLSPAN}">
              <span class="rtoggle" onclick="toggleFold('${rFoldKey}')">
                <span class="arrow">▼</span>
                <span class="rtitle">${rangeTitle(s, e)}</span>
                <span class="count">${rList.length}건</span>
                ${rSum ? `<span class="msum">${rSum.toLocaleString("ko-KR")}원</span>` : ""}
              </span>
              <span class="grp-tools" onclick="event.stopPropagation()">
                <input type="date" class="gs" value="${s}">
                <span class="tilde">~</span>
                <input type="date" class="ge" value="${e}">
                <button class="grp-add" onclick="addRowToChunk('${gid}')">＋ 행 추가</button>
                <button class="grp-apply" onclick="applyGroupDate('${gid}', this)">이 그룹 날짜 일괄 지정</button>
                <button class="grp-copy" onclick="copyGroup('${gid}')">📋 그룹 복사</button>
                <button class="grp-del" onclick="deleteGroup('${gid}')">🗑 그룹 삭제</button>
              </span>
            </td></tr>`;

          if (!rFold) {
            let showList = rList;
            if (sortState) {
              const { key, dir } = sortState, sign = dir === "asc" ? 1 : -1;
              showList = rList.slice().sort((a, b) => cmpVals(key, valueOf(a, key), valueOf(b, key)) * sign);
            }
            bodyRows += showList.map((r, i) => rowHtml(r, i + 1)).join("");
          }
        });
      });
    });
  }

  // colgroup (너비)
  let colgroup = `<col style="width:${CHK_W}px"><col id="col-no" style="width:${NO_W}px">`;
  colOrder.forEach(k => { colgroup += `<col id="col-${k}" style="width:${widthOf(k)}px">`; });
  colgroup += `<col id="col-del" style="width:${DEL_W}px">`;

  // thead (드래그 재정렬 + 리사이즈 핸들)
  let head = `<th class="col-chk"><input type="checkbox" id="chkAll" class="rowchk" title="전체 선택" onchange="selectAll(this.checked)"></th><th class="col-no">#</th>`;
  colOrder.forEach(k => {
    const c = COL_DEFS[k];
    const active = colFilters[k] ? " active" : "";
    const arrow = (sortState && sortState.key === k) ? (sortState.dir === "asc" ? " ▲" : " ▼") : "";
    head += `<th class="th-move ${c.type === "status" ? "col-status" : ""}" draggable="true" data-key="${k}"
        ondragstart="onDragStart(event,'${k}')" ondragover="onDragOver(event)"
        ondragenter="onDragEnter(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${k}')">
        <span class="th-label">${c.label}${arrow}</span>
        <span class="th-filter${active}" title="필터·정렬" onmousedown="event.stopPropagation()" onclick="event.stopPropagation(); openColMenu('${k}', this)">▼</span>
        <span class="col-resize" onmousedown="startResize(event,'${k}')"></span>
      </th>`;
  });
  head += `<th class="col-del"></th>`;

  document.getElementById("content").innerHTML = `
    <div class="table-card">
      <div class="table-scroll">
        <table id="feeTable" style="width:${tableWidth()}px">
          <colgroup>${colgroup}</colgroup>
          <thead><tr>${head}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
    </div>`;

  document.querySelectorAll(".memo-ta").forEach(autoGrow);
  refreshDelBtn();
  syncHeaderCheckbox();
}

/* 상태 드롭다운(완료/미완료) — 원형 배지, 컬럼별 색상 */
function statusStyle(field, value) {
  const th = STATUS_THEME[field] || { solid: "#555", tint: "#eee", ink: "#333" };
  return value === "완료"
    ? `background:${th.solid};color:#fff;border-color:${th.solid};`
    : `background:${th.tint};color:${th.ink};border-color:${th.tint};`;
}
function statusSelect(r, field) {
  const cur = r[field];
  return `<button type="button" class="status-btn" style="${statusStyle(field, cur)}"
      onclick="toggleStatus('${r.id}','${field}', this)">${cur}</button>`;
}
/* 클릭할 때마다 완료 ↔ 미완료 토글 */
function toggleStatus(id, field, el) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  const nv = row[field] === "완료" ? "미완료" : "완료";
  row[field] = nv;
  el.textContent = nv;
  el.setAttribute("style", statusStyle(field, nv));
  save();
  updateStats();
}

/* 컬럼 타입별 셀 내용 */
function cellHtml(r, key) {
  const c = COL_DEFS[key];
  switch (c.type) {
    case "date":
      return `<input type="date" value="${r[key] || ""}" onchange="setRowDate('${r.id}','${key}',this.value)">`;
    case "acct":
      return `<input value="${esc(r[key])}" placeholder="계좌번호" oninput="updateField('${r.id}','${key}',this.value)">`;
    case "amount":
      return `<input inputmode="numeric" value="${fmtAmount(r[key])}" placeholder="0" oninput="updateAmount('${r.id}', this)">`;
    case "status":
      return statusSelect(r, key);
    default: // text
      if (key === "memo")
        return `<textarea class="memo-ta" rows="1" placeholder="메모" oninput="updateField('${r.id}','${key}',this.value); autoGrow(this)">${esc(r[key])}</textarea>`;
      return `<input value="${esc(r[key])}" placeholder="${c.label}" oninput="updateField('${r.id}','${key}',this.value)">`;
  }
}
function cellClass(key) {
  if (key === "memo") return "memo";
  const t = COL_DEFS[key].type;
  if (t === "status") return "col-status";
  if (t === "acct") return "acct";
  if (t === "amount") return "amount";
  if (t === "date") return "date";
  return "";
}

/* 메모 입력 시 내용이 다 보이도록 높이 자동 확장 */
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* 데이터 행 하나를 HTML로 (컬럼 순서 반영) */
function rowHtml(r, no) {
  const sel = selected.has(r.id);
  let tds = `<td class="col-chk"><input type="checkbox" class="rowchk" ${sel ? "checked" : ""} onchange="toggleSelect('${r.id}', this)"></td>`;
  tds += `<td class="col-no">${no}</td>`;
  colOrder.forEach(k => { tds += `<td class="${cellClass(k)}">${cellHtml(r, k)}</td>`; });
  tds += `<td class="col-del"><button class="del-btn" title="삭제" onclick="deleteRow('${r.id}')">×</button></td>`;
  return `<tr class="data-row${sel ? " sel" : ""}">${tds}</tr>`;
}

function fmtAmount(v) {
  const digits = String(v ?? "").replace(/[^\d]/g, "");
  return digits ? Number(digits).toLocaleString("ko-KR") : "";
}
function esc(s) {
  return String(s ?? "").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* =========================================================
   10) 엑셀 내보내기 (입력 양식 / 데이터)
   현재 컬럼 순서 그대로 헤더를 만듭니다.
   ========================================================= */
function exportHeaders() {
  return colOrder.map(k => COL_DEFS[k].label);
}
function rowToRecord(r) {
  return colOrder.map(k => {
    if (COL_DEFS[k].type === "amount") return r[k] ? Number(r[k]) : "";
    return r[k] != null ? String(r[k]) : "";
  });
}
function saveWorkbook(aoa, filename) {
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = colOrder.map(k => ({ wch: Math.max(10, Math.round(widthOf(k) / 8)) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "수수료");
  XLSX.writeFile(wb, filename);
}
/* 빈 입력 양식(헤더만) 다운로드 */
function downloadTemplate() {
  saveWorkbook([exportHeaders()], "수수료_입력양식.xlsx");
}
/* 현재 데이터 전체를 엑셀로 다운로드 */
function downloadExcel() {
  if (rows.length === 0) { alert("내보낼 데이터가 없어요."); return; }
  const aoa = [exportHeaders(), ...rows.map(rowToRecord)];
  const today = new Date().toISOString().slice(0, 10);
  saveWorkbook(aoa, `수수료_지급표_${today}.xlsx`);
}

/* =========================================================
   11) 엑셀 업로드 (계좌번호 원본 유지)
   ========================================================= */
function normStatus(v) {
  return String(v || "").trim() === "완료" ? "완료" : "미완료";
}
function uploadExcel(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const table = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });

    if (table.length < 2) {
      alert("엑셀에 내용이 없어요. 첫 줄은 제목, 그 아래에 데이터가 있어야 합니다.");
      event.target.value = "";
      return;
    }

    const headers = table[0].map(h => String(h).replace(/\s/g, ""));
    const find = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(k)));
    const idx = {
      start:   find(["시작일", "시작", "정산날짜", "날짜"]),
      end:     find(["종료일", "종료", "마감", "끝"]),
      branch:  find(["지사", "협력사", "소속"]),
      ceo:     find(["대표자", "이름", "대표"]),
      acct:    find(["계좌번호", "계좌"]),
      bank:    find(["은행"]),
      amount:  find(["금액", "지급액", "지급금액", "이체금액"]),
      form:    find(["양식전달", "양식", "전달현황"]),
      pay:     find(["지급현황"]),
      invoice: find(["세금계산서", "계산서", "발행"]),
      memo:    find(["메모", "비고"]),
    };

    let added = 0;
    for (let i = 1; i < table.length; i++) {
      const line = table[i];
      const get = (n) => (n >= 0 && line[n] != null) ? String(line[n]).trim() : "";
      const branch = get(idx.branch), ceo = get(idx.ceo);
      const acct = get(idx.acct);   // 원본 그대로 유지
      const bank = get(idx.bank);
      const amount = get(idx.amount).replace(/[^\d]/g, "");
      const start = normalizeDate(get(idx.start));
      const end = normalizeDate(get(idx.end));
      const memo = get(idx.memo);

      if (!branch && !ceo && !acct && !bank && !amount && !start && !end && !memo) continue;

      rows.push(fixOrder({
        id: newId(), start, end, branch, ceo, acct, bank, amount,
        form: normStatus(get(idx.form)),
        pay: normStatus(get(idx.pay)),
        invoice: normStatus(get(idx.invoice)),
        memo
      }));
      added++;
    }

    save();
    render();
    alert(added + "건을 불러왔어요!");
    event.target.value = "";
  };
  reader.readAsArrayBuffer(file);
}

function normalizeDate(v) {
  if (!v) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const nums = v.match(/\d+/g);
  if (nums && nums.length >= 3) {
    const [y, m, d] = nums;
    return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  return "";
}

/* 시작 */
render();
cloudLoad(); // ← 클라우드에서 최신 데이터 불러오기 (연결됐을 때만)
</script>



</body></html>
</template>
