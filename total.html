          <th>정산현황<span class="filter-btn" data-key="settle" onclick="toggleFilterPanel(event,'settle')"><i class="ti ti-filter"></i></span></th>
          <th>세금계산서 발행<span class="filter-btn" data-key="tax" onclick="toggleFilterPanel(event,'tax')"><i class="ti ti-filter"></i></span></th>
          <th>메모</th>
          <th style="width:36px"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="filterPanel"></div>
</div>

<script>
const today = new Date().toISOString().split('T')[0];

// ── Supabase ──────────────────────────────────────────────
const _SB_URL  = 'https://micquonnaxyhwxwksctf.supabase.co';
const _SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pY3F1b25uYXh5aHd4d2tzY3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTY0MDgsImV4cCI6MjA5NjY5MjQwOH0.9S0DhscVBWUw1nerK5weF5GMoJaTTZHLtL91yOaqHR0';
const _RECORD  = 'main';
const sb = supabase.createClient(_SB_URL, _SB_KEY);
// ─────────────────────────────────────────────────────────

// ── 앱 시작 (로그인 없이 바로 실행) ──────────────────────────
window.addEventListener('DOMContentLoaded', init);
// ─────────────────────────────────────────────────────────────

// localStorage로 즉시 초기 렌더링 (Supabase 로드 전 빠른 표시)
let rows = JSON.parse(localStorage.getItem('settle_rows') || 'null') || [
  {startDate:today,endDate:today,company:'',rep:'',acct:'',bank:'',settleType:'',amount:'',settle:'미완료',tax:'미완료',memo:''}
];
function migrateRows(arr){
  arr.forEach(r=>{
    if(r.startDate===undefined) r.startDate = r.date || today;
    if(r.endDate===undefined) r.endDate = r.date || today;
    if(!r.settle) r.settle = '미완료';
    if(!r.tax)    r.tax    = '미완료';
    if(r.settleType===undefined) r.settleType = '';
    if(r.memo===undefined) r.memo = '';
    if(r.amount && String(r.amount).includes('.')){const _n=parseFloat(r.amount);if(!isNaN(_n))r.amount=String(Math.round(_n));}
  });
}
migrateRows(rows);

let collapsedGroups    = JSON.parse(localStorage.getItem('settle_collapsed')     || '[]');
let collapsedSubGroups = JSON.parse(localStorage.getItem('settle_sub_collapsed') || '[]');
let acctMap            = JSON.parse(localStorage.getItem('settle_acctmap')       || '{}');
let sectionTarget = null;
function setSectionTarget(indices, startDate, endDate){
  sectionTarget = {indices, startDate: startDate||today, endDate: endDate||today};
}
const FILTER_COLS = {
  startDate:{label:'정산시작일'},
  endDate:{label:'정산종료일'},
  company:{label:'소속 협력사'},
  rep:{label:'대표자'},
  acct:{label:'계좌번호'},
  bank:{label:'은행'},
  settleType:{label:'정산구분', display:v=>v||'-'},
  amount:{label:'이체금액', numeric:true, display:v=>v===''?'(공백)':formatAmount(v)},
  settle:{label:'정산현황', display:v=>v==='완료'?'✓ 완료':v==='미완료'?'✗ 미완료':'-'},
  tax:{label:'세금계산서 발행', display:v=>v==='완료'?'✓ 완료':v==='미완료'?'✗ 미완료':'-'}
};

let columnFilters = {}; // key -> Set of allowed raw values (없으면 전체 허용)
let searchQuery = '';
let searchField = 'rep';

function matchesFilters(r){
  if(searchQuery){
    const val = (r[searchField]||'').toLowerCase();
    if(!val.includes(searchQuery.toLowerCase())) return false;
  }
  for(const key in columnFilters){
    if(!columnFilters[key].has(r[key]||'')) return false;
  }
  return true;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function toggleFilterPanel(e,key){
  e.stopPropagation();
  const panel = document.getElementById('filterPanel');
  const wasOpenForKey = panel.classList.contains('open') && panel.dataset.key===key;
  panel.classList.remove('open');
  if(wasOpenForKey) return;

  panel.dataset.key = key;
  panel.innerHTML = buildFilterPanel(key);

  const rect = e.currentTarget.getBoundingClientRect();
  let left = rect.left;
  const maxLeft = window.innerWidth - 220;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  panel.style.top = (rect.bottom + 4) + 'px';
  panel.style.left = left + 'px';
  panel.classList.add('open');
}

document.addEventListener('click', (e)=>{
  const panel = document.getElementById('filterPanel');
  if(panel.classList.contains('open') && !e.target.closest('#filterPanel') && !e.target.closest('.filter-btn')){
    panel.classList.remove('open');
  }
});

function buildFilterPanel(key){
  const col = FILTER_COLS[key];
  const valuesSet = new Set();
  rows.forEach(r=> valuesSet.add(r[key] || ''));
  const values = Array.from(valuesSet).sort((a,b)=>{
    if(col.numeric) return (parseFloat(String(a).replace(/[^0-9.\-]/g,''))||0) - (parseFloat(String(b).replace(/[^0-9.\-]/g,''))||0);
    return String(a).localeCompare(String(b),'ko');
  });

  const active = columnFilters[key];
  const checkedSet = active || new Set(values);

  const itemsHtml = values.map(v=>{
    const label = col.display ? col.display(v) : (v===''?'(공백)':v);
    const checked = checkedSet.has(v);
    return `<label class="fp-item"><input type="checkbox" value="${escapeHtml(v)}" ${checked?'checked':''}><span>${escapeHtml(label)}</span></label>`;
  }).join('');

  return `
    <div class="fp-sort">
      <button onclick="sortByColumn('${key}','asc')"><i class="ti ti-sort-ascending-2"></i> 오름차순 정렬</button>
      <button onclick="sortByColumn('${key}','desc')"><i class="ti ti-sort-descending-2"></i> 내림차순 정렬</button>
    </div>
    <input type="text" class="fp-search" placeholder="검색" oninput="filterFpList(this,'${key}')">
    <div class="fp-actions">
      <a onclick="fpSelectAll('${key}',true)">모두 선택</a>
      <a onclick="fpSelectAll('${key}',false)">모두 지우기</a>
    </div>
    <div class="fp-list" id="fp-list-${key}">${itemsHtml}</div>
    <div class="fp-buttons">
      <button onclick="closeFilterPanel()">취소</button>
      <button class="primary" onclick="applyFilter('${key}')">확인</button>
    </div>
  `;
}

function filterFpList(input,key){
  const term = input.value.trim().toLowerCase();
  document.querySelectorAll(`#fp-list-${key} .fp-item`).forEach(item=>{
    item.style.display = item.textContent.toLowerCase().includes(term) ? '' : 'none';
  });
}

function fpSelectAll(key,checked){
  document.querySelectorAll(`#fp-list-${key} .fp-item`).forEach(item=>{
    if(item.style.display !== 'none') item.querySelector('input').checked = checked;
  });
}

function closeFilterPanel(){
  document.getElementById('filterPanel').classList.remove('open');
}

function doSearch(){
  searchQuery = document.getElementById('searchInput').value.trim();
  searchField = document.getElementById('searchField').value;
  const clearBtn = document.getElementById('searchClear');
  const tag = document.getElementById('searchResultTag');
  clearBtn.classList.toggle('visible', searchQuery.length > 0);
  if(!searchQuery){ tag.textContent = ''; render(); return; }
  render();
  const matchCount = rows.filter(r=>matchesFilters(r)).length;
  tag.textContent = `${matchCount}건`;
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('searchClear').classList.remove('visible');
  document.getElementById('searchResultTag').textContent = '';
  render();
}

function applyFilter(key){
  const checked = new Set();
  let allChecked = true;
  document.querySelectorAll(`#fp-list-${key} .fp-item input`).forEach(cb=>{
    if(cb.checked) checked.add(cb.value); else allChecked = false;
  });
  if(allChecked) delete columnFilters[key];
  else columnFilters[key] = checked;
  closeFilterPanel();
  render();
}

function sortByColumn(key,dir){
  const col = FILTER_COLS[key];
  rows.sort((a,b)=>{
    const av = a[key]||'', bv = b[key]||'';
    let cmp = col.numeric
      ? (parseFloat(String(av).replace(/[^0-9.\-]/g,''))||0) - (parseFloat(String(bv).replace(/[^0-9.\-]/g,''))||0)
      : String(av).localeCompare(String(bv),'ko');
    return dir==='asc' ? cmp : -cmp;
  });
  closeFilterPanel();
  autoSave();
  render();
}

function buildAcctLookup(){
  // acctMap(계좌정보 업로드) + 기존 행에 직접 입력된 데이터를 합산
  const map = Object.assign({}, acctMap);
  rows.forEach(r=>{
    if(r.company && (r.rep||r.acct||r.bank||r.settleType)){
      map[r.company] = {
        rep:        r.rep        || (map[r.company]||{}).rep        || '',
        acct:       r.acct       || (map[r.company]||{}).acct       || '',
        bank:       r.bank       || (map[r.company]||{}).bank       || '',
        settleType: r.settleType || (map[r.company]||{}).settleType || ''
      };
    }
  });
  return map;
}

function applyAcctMap(){
  rows.forEach(r=>{
    if(r.company && acctMap[r.company]){
      r.rep = acctMap[r.company].rep;
      r.acct = acctMap[r.company].acct;
      r.bank = acctMap[r.company].bank;
    }
  });
}

// 엑셀 업로드 후 자동완성: 비어있는 필드만 채움
function autoFillNewRows(){
  const map = buildAcctLookup();
  rows.forEach(r=>{
    if(r.company && map[r.company]){
      const m = map[r.company];
      if(!r.rep && !r.acct && !r.bank){
        r.rep = m.rep; r.acct = m.acct; r.bank = m.bank;
      }
      if(!r.settleType && m.settleType) r.settleType = m.settleType;
    }
  });
}

function onCompanyBlur(i){
  const company = rows[i].company;
  const map = buildAcctLookup();
  if(company && map[company]){
    const m = map[company];
    rows[i].rep = m.rep; rows[i].acct = m.acct; rows[i].bank = m.bank;
    if(!rows[i].settleType && m.settleType) rows[i].settleType = m.settleType;
    autoSave();
    render();
  }
}

function groupKey(dateStr){
  if(!dateStr) return '날짜없음';
  const [y,m] = dateStr.split('-');
  return `${y.slice(2)}년 ${parseInt(m,10)}월`;
}

function formatShortDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m,10)}.${parseInt(d,10)}`;
}

function dateRangeLabel(start,end){
  if(!start && !end) return '날짜없음';
  if(start===end) return formatShortDate(start);
  return `${formatShortDate(start)} ~ ${formatShortDate(end)}`;
}

function toggleGroup(key){
  const idx = collapsedGroups.indexOf(key);
  if(idx>=0) collapsedGroups.splice(idx,1); else collapsedGroups.push(key);
  autoSave();
  render();
}

function toggleSubGroup(key){
  const idx = collapsedSubGroups.indexOf(key);
  if(idx>=0) collapsedSubGroups.splice(idx,1); else collapsedSubGroups.push(key);
  autoSave();
  render();
}

function rowHtml(r,i){
  return `
      <td class="row-num">${i+1}</td>
      <td><input class="editable" type="date" value="${r.startDate}" onchange="rows[${i}].startDate=this.value;autoSave()"></td>
      <td><input class="editable" type="date" value="${r.endDate}" onchange="rows[${i}].endDate=this.value;autoSave();render()"></td>
      <td><input class="editable" placeholder="협력사명" value="${r.company}" oninput="rows[${i}].company=this.value;autoSave()" onblur="onCompanyBlur(${i})" style="min-width:100px"></td>
      <td><input class="editable" placeholder="대표자명" value="${r.rep}" oninput="rows[${i}].rep=this.value;autoSave()" style="min-width:80px"></td>
      <td><input class="editable" placeholder="계좌번호" value="${r.acct}" oninput="rows[${i}].acct=this.value;autoSave()" style="min-width:140px"></td>
      <td><input class="editable" placeholder="은행명" value="${r.bank}" oninput="rows[${i}].bank=this.value;autoSave()" style="min-width:80px"></td>
      <td>
        <button type="button" class="status-btn ${settleTypeClass(r.settleType)}" onclick="toggleSettleType(${i},this)">${settleTypeLabel(r.settleType)}</button>
      </td>
      <td><input class="editable amount-input" placeholder="0" value="${formatAmount(r.amount)}" onfocus="const _v=parseFloat(rows[${i}].amount);this.value=isNaN(_v)?'':Math.round(_v)" onblur="this.value=formatAmount(rows[${i}].amount)" oninput="rows[${i}].amount=this.value;autoSave();updateSummary()" style="min-width:110px"></td>
      <td>
        <button type="button" class="status-btn ${statusClass(r.settle)}" onclick="toggleStatus(${i},'settle',this)">${r.settle==='완료'?'✓ 완료':'✗ 미완료'}</button>
      </td>
      <td>
        <button type="button" class="status-btn ${statusClass(r.tax)}" onclick="toggleStatus(${i},'tax',this)">${r.tax==='완료'?'✓ 완료':'✗ 미완료'}</button>
      </td>
      <td><input class="editable" placeholder="메모" value="${escapeHtml(r.memo||'')}" oninput="rows[${i}].memo=this.value;autoSave()"></td>
      <td><button class="del-btn" onclick="delRow(${i})" title="삭제">✕</button></td>
    `;
}

function render(){
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';

  // 정산종료일 기준 연/월 그룹으로 묶기 (필터 적용)
  const groups = {};
  rows.forEach((r,i)=>{
    if(!matchesFilters(r)) return;
    const key = groupKey(r.endDate);
    (groups[key] = groups[key] || []).push(i);
  });
  const sortedKeys = Object.keys(groups).sort((a,b)=>{
    const da = rows[groups[a][0]].endDate || '';
    const db = rows[groups[b][0]].endDate || '';
    return db.slice(0,7).localeCompare(da.slice(0,7));
  });

  if(sortedKeys.length===0){
    tb.innerHTML = '<tr><td colspan="12" style="text-align:center;color:#888780;padding:20px">검색 결과가 없어요.</td></tr>';
    updateSummary();
    updateFilterBtnStates();
    return;
  }

  sortedKeys.forEach(key=>{
    const indices = groups[key];
    const collapsed = collapsedGroups.includes(key);

    const headerTr = document.createElement('tr');
    headerTr.className = 'group-header'+(collapsed?' collapsed':'');
    headerTr.innerHTML = `<td colspan="12" onclick="toggleGroup('${key}')"><i class="ti ti-chevron-down"></i>${key}<span class="group-count">${indices.length}건</span></td>`;
    tb.appendChild(headerTr);

    if(!collapsed){
      // 정산시작일~정산종료일 구간(주차)별로 다시 묶기
      const subGroups = {};
      indices.forEach(i=>{
        const r = rows[i];
        const subKey = `${r.startDate}__${r.endDate}`;
        (subGroups[subKey] = subGroups[subKey] || []).push(i);
      });
      const subKeys = Object.keys(subGroups).sort((a,b)=>{
        const sa = rows[subGroups[a][0]].startDate || '';
        const sb = rows[subGroups[b][0]].startDate || '';
        return sa.localeCompare(sb);
      });

      subKeys.forEach(subKey=>{
        const subIndices = subGroups[subKey];
        const first = rows[subIndices[0]];
        const label = dateRangeLabel(first.startDate, first.endDate);
        const subCollapsed = collapsedSubGroups.includes(subKey);
        const escapedSubKey = subKey.replace(/'/g,"\\'");

        const subHeaderTr = document.createElement('tr');
        subHeaderTr.className = 'subgroup-header' + (subCollapsed ? ' collapsed' : '');
        subHeaderTr.innerHTML = `<td colspan="12" onclick="toggleSubGroup('${escapedSubKey}')"><div style="display:flex;align-items:center;gap:6px"><i class="ti ti-chevron-down sub-ti"></i>${label}<span class="group-count">${subIndices.length}건</span><span style="margin-left:auto;display:flex;gap:4px"><button class="sec-btn" onclick="event.stopPropagation();setSectionTarget([${subIndices.join(',')}],'${first.startDate}','${first.endDate}');document.getElementById('excelInput').click()" title="이 구간 엑셀 업로드"><i class="ti ti-file-spreadsheet" style="font-size:11px"></i> 엑셀 업로드</button><button class="sec-btn" onclick="event.stopPropagation();setSectionTarget([${subIndices.join(',')}]);document.getElementById('acctInput').click()" title="이 구간 계좌정보 업로드"><i class="ti ti-building-bank" style="font-size:11px"></i> 계좌 업로드</button><button class="sec-btn" onclick="event.stopPropagation();resetSectionExcel([${subIndices.join(',')}])" title="이 구간 협력사·이체금액·정산일 초기화"><i class="ti ti-eraser" style="font-size:11px"></i> 초기화</button><button class="sec-btn" onclick="event.stopPropagation();resetSectionAcct([${subIndices.join(',')}])" title="이 구간 대표자·계좌·은행 초기화"><i class="ti ti-trash" style="font-size:11px"></i> 계좌 초기화</button><button class="sec-btn" style="color:#E24B4A;border-color:#F5C0BF" onclick="event.stopPropagation();deleteSectionRows([${subIndices.join(',')}])" title="이 구간 행 전체 삭제"><i class="ti ti-trash-x" style="font-size:11px"></i> 전체 삭제</button></span></div></td>`;
        tb.appendChild(subHeaderTr);

        if(!subCollapsed){
          subIndices.forEach(i=>{
            const tr = document.createElement('tr');
            tr.dataset.idx = i;
            tr.innerHTML = rowHtml(rows[i], i);
            tb.appendChild(tr);
          });

          const subtotal = subIndices.reduce((s,i)=>s+(parseFloat(String(rows[i].amount).replace(/[^0-9.\-]/g,''))||0),0);
          const subtotalTr = document.createElement('tr');
          subtotalTr.className = 'group-subtotal';
          subtotalTr.innerHTML = `<td colspan="8" class="subtotal-label">${label} 이체 합계</td><td class="subtotal-amt">${formatAmount(subtotal)}</td><td colspan="4"></td>`;
          tb.appendChild(subtotalTr);
        }
      });
    }
  });

  updateSummary();
  updateFilterBtnStates();
}

function updateFilterBtnStates(){
  document.querySelectorAll('#headRow .filter-btn').forEach(btn=>{
    btn.classList.toggle('active', !!columnFilters[btn.dataset.key]);
  });
}

function statusClass(v){
  return v==='완료' ? 'done' : v==='미완료' ? 'pending' : 'none';
}

// 완료 ↔ 미완료 토글 (정산현황·세금계산서)
function toggleStatus(i, field, btn){
  const val = rows[i][field]==='완료' ? '미완료' : '완료';
  rows[i][field] = val;
  btn.className = 'status-btn ' + statusClass(val);
  btn.textContent = val==='완료' ? '✓ 완료' : '✗ 미완료';
  autoSave();
  if(field==='settle') updateSummary();
}

function settleTypeClass(v){
  return v==='일선정산' ? 'type-il' : v==='주정산' ? 'type-ju' : v==='보험료 소급' ? 'type-so' : 'none';
}

function settleTypeLabel(v){
  return v==='일선정산' ? '일선정산' : v==='주정산' ? '주정산' : v==='보험료 소급' ? '보험료 소급' : '-';
}

// 일선정산 → 주정산 → 보험료 소급 순환 (빈칸 → 일선정산 → 주정산 → 보험료 소급 → 일선정산 ...)
function toggleSettleType(i, btn){
  const cur = rows[i].settleType;
  const val = cur==='일선정산' ? '주정산' : cur==='주정산' ? '보험료 소급' : '일선정산';
  rows[i].settleType = val;
  btn.className = 'status-btn ' + settleTypeClass(val);
  btn.textContent = settleTypeLabel(val);
  autoSave();
}

function resetSectionExcel(indices){
  if(!confirm(`이 구간 ${indices.length}건의 협력사명·이체금액·정산시작일·정산종료일을 초기화할까요?`)) return;
  indices.forEach(i=>{
    rows[i].company=''; rows[i].amount='';
    rows[i].startDate=today; rows[i].endDate=today;
  });
  autoSave(); render();
}

function resetSectionAcct(indices){
  if(!confirm(`이 구간 ${indices.length}건의 대표자·계좌번호·은행을 초기화할까요?`)) return;
  indices.forEach(i=>{ rows[i].rep=''; rows[i].acct=''; rows[i].bank=''; });
  autoSave(); render();
}

function deleteSectionRows(indices){
  if(!confirm(`이 구간 ${indices.length}건을 모두 삭제할까요?\n되돌릴 수 없어요.`)) return;
  const idxSet = new Set(indices);
  rows = rows.filter((_,i)=>!idxSet.has(i));
  if(rows.length===0) rows.push({startDate:today,endDate:today,company:'',rep:'',acct:'',bank:'',settleType:'',amount:'',settle:'미완료',tax:'미완료',memo:''});
  autoSave(); render();
}

function formatAmount(v){
  if(v===''||v===null||v===undefined) return '';
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  if(isNaN(n)) return '';
  return n.toLocaleString('ko-KR',{maximumFractionDigits:0});
}

function updateSummary(){
  const total = rows.length;
  const done = rows.filter(r=>r.settle==='완료').length;
  const pending = total - done;
  const totalAmt = rows.reduce((s,r)=>s+(parseFloat(String(r.amount).replace(/[^0-9.\-]/g,''))||0),0);
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="stat-label">전체 건수</div><div class="stat-val amber">${total}건</div></div>
    <div class="stat"><div class="stat-label">정산 완료</div><div class="stat-val green">${done}건</div></div>
    <div class="stat"><div class="stat-label">정산 미완료</div><div class="stat-val amber">${pending}건</div></div>
    <div class="stat"><div class="stat-label">총 이체금액</div><div class="stat-val amber">${totalAmt.toLocaleString()}원</div></div>
  `;
}

function addRow(){
  const newIdx = rows.length;
  rows.push({startDate:today,endDate:today,company:'',rep:'',acct:'',bank:'',settleType:'',amount:'',settle:'미완료',tax:'미완료',memo:''});
  autoSave();
  render();
  setTimeout(()=>{
    const tr = document.querySelector(`#tbody tr[data-idx="${newIdx}"]`);
    const inputs = tr ? tr.querySelectorAll('input') : [];
    if(inputs[2]) inputs[2].focus();
  },50);
}

function delRow(i){
  if(rows.length<=1){alert('마지막 행은 삭제할 수 없어요.');return;}
  if(confirm('이 행을 삭제할까요?')){rows.splice(i,1);autoSave();render();}
}

let autoTimer;
let _lastSyncStr = null; // 내 저장으로 발생한 realtime 이벤트 무시용

function setSaveStatus(state){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  if(state==='saving'){
    el.className='save-status saving';
    el.innerHTML='<i class="ti ti-loader-2"></i><span>저장 중...</span>';
  } else if(state==='loading'){
    el.className='save-status saving';
    el.innerHTML='<i class="ti ti-loader-2"></i><span>불러오는 중...</span>';
  } else {
    const now = new Date();
    const t = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
    el.className='save-status saved';
    el.innerHTML='<i class="ti ti-cloud-check"></i><span>저장됨 '+t+'</span>';
  }
}

async function saveToDB(){
  const payload = {
    id: _RECORD,
    rows,
    acct_map: acctMap,
    collapsed_groups: collapsedGroups,
    collapsed_sub_groups: collapsedSubGroups,
    updated_at: new Date().toISOString()
  };
  _lastSyncStr = JSON.stringify(rows);
  // localStorage 백업
  localStorage.setItem('settle_rows',           JSON.stringify(rows));
  localStorage.setItem('settle_collapsed',       JSON.stringify(collapsedGroups));
  localStorage.setItem('settle_sub_collapsed',   JSON.stringify(collapsedSubGroups));
  localStorage.setItem('settle_acctmap',         JSON.stringify(acctMap));
  const { error } = await sb.from('settlement_data').upsert(payload);
  if(error) console.error('Supabase 저장 오류:', error);
}

function autoSave(){
  setSaveStatus('saving');
  clearTimeout(autoTimer);
  autoTimer = setTimeout(async ()=>{
    await saveToDB();
    setSaveStatus('saved');
  }, 400);
}

function forceSave(){
  clearTimeout(autoTimer);
  saveToDB().then(()=>setSaveStatus('saved'));
}

function subscribeToChanges(){
  sb.channel('settlement-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'settlement_data', filter:`id=eq.${_RECORD}`}, payload=>{
      if(!payload.new || !payload.new.rows) return;
      const d = payload.new;
      // 내 저장으로 발생한 이벤트 무시
      if(_lastSyncStr && JSON.stringify(d.rows) === _lastSyncStr){ _lastSyncStr=null; return; }
      _lastSyncStr = null;
      rows              = d.rows;
      acctMap           = d.acct_map           || {};
      collapsedGroups    = d.collapsed_groups    || [];
      collapsedSubGroups = d.collapsed_sub_groups|| [];
      migrateRows(rows);
      render();
      setSaveStatus('saved');
    })
    .subscribe();
}

async function init(){
  setSaveStatus('loading');
  try {
    const { data, error } = await sb.from('settlement_data').select('*').eq('id', _RECORD).single();
    if(!error && data && data.rows){
      rows              = data.rows.length ? data.rows : rows;
      acctMap           = data.acct_map            || {};
      collapsedGroups    = data.collapsed_groups    || [];
      collapsedSubGroups = data.collapsed_sub_groups|| [];
      migrateRows(rows);
    }
  } catch(e){ console.warn('Supabase 로드 실패, localStorage 사용:', e); }
  render();
  initColResize();
  setSaveStatus('saved');
  subscribeToChanges();
}

function excelDateToStr(v){
  if(v instanceof Date && !isNaN(v)) {
    return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  }
  if(typeof v==='string'){
    const m = v.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
    if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    return v;
  }
  if(typeof v==='number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
  }
  return today;
}

function importExcel(file){
  if(!file) return;
  const target = sectionTarget; sectionTarget = null;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    if(aoa.length < 2){ alert('데이터가 없는 파일이에요.'); return; }

    const header = aoa[0].map(h=>String(h||'').trim());
    const startCol = header.findIndex(h=>h.includes('정산시작일'));
    const endCol = header.findIndex(h=>h.includes('정산종료일'));
    let companyCol = header.findIndex(h=>h.includes('협력사명'));
    if(companyCol===-1) companyCol = header.findIndex(h=>h.includes('협력사')&&!h.includes('아이디')&&!h.toUpperCase().includes('ID'));
    const amountCol = header.findIndex(h=>h.includes('정산예정금액'));

    if(companyCol===-1||amountCol===-1){
      alert('필요한 컬럼(협력사명/정산예정금액)을 찾을 수 없어요.');
      return;
    }

    const dataRows = aoa.slice(1).filter(r=>r && r[companyCol]);

    if(target){
      // 섹션별 업로드: 해당 섹션 행 순서대로 업데이트, 초과분은 섹션 날짜로 신규 추가
      let updated = 0, added = 0;
      dataRows.forEach((r, idx)=>{
        const rowIdx = target.indices[idx];
        if(rowIdx !== undefined){
          rows[rowIdx].company = String(r[companyCol]);
          rows[rowIdx].amount  = Number(r[amountCol]||0).toFixed(0);
          rows[rowIdx].startDate = target.startDate;
          rows[rowIdx].endDate   = target.endDate;
          updated++;
        } else {
          rows.push({startDate:target.startDate, endDate:target.endDate,
            company:String(r[companyCol]), rep:'', acct:'', bank:'',
            settleType:'', amount:Number(r[amountCol]||0).toFixed(0), settle:'미완료', tax:'미완료', memo:''});
          added++;
        }
      });
      autoFillNewRows(); render(); autoSave();
      alert(`${updated}건 업데이트, ${added}건 신규 추가했어요.`);
    } else {
      // 전체 업로드
      if(startCol===-1||endCol===-1){
        alert('필요한 컬럼(정산시작일/정산종료일)을 찾을 수 없어요.'); return;
      }
      if(rows.length===1 && !rows[0].company && !rows[0].amount) rows = [];
      let added = 0;
      dataRows.forEach(r=>{
        rows.push({startDate:excelDateToStr(r[startCol]), endDate:excelDateToStr(r[endCol]),
          company:String(r[companyCol]), rep:'', acct:'', bank:'',
          settleType:'', amount:Number(r[amountCol]||0).toFixed(0), settle:'미완료', tax:'미완료', memo:''});
        added++;
      });
      autoFillNewRows(); render(); autoSave();
      alert(`${added}건의 데이터를 불러왔어요.`);
    }
  };
  reader.readAsArrayBuffer(file);
  document.getElementById('excelInput').value='';
}

function importAccountInfo(file){
  if(!file) return;
  const target = sectionTarget; sectionTarget = null;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    if(aoa.length < 2){ alert('데이터가 없는 파일이에요.'); return; }

    const header = aoa[0].map(h=>String(h||'').trim());
    let companyCol = header.findIndex(h=>h.includes('협력사명'));
    if(companyCol===-1) companyCol = header.findIndex(h=>h.includes('협력사')&&!h.includes('아이디')&&!h.toUpperCase().includes('ID'));
    const repCol = header.findIndex(h=>h.includes('대표자'));
    let acctCol = header.findIndex(h=>h.includes('계좌번호'));
    if(acctCol===-1) acctCol = header.findIndex(h=>h.includes('계좌'));
    let bankCol = header.findIndex(h=>h.includes('은행명'));
    if(bankCol===-1) bankCol = header.findIndex(h=>h.includes('은행'));

    if(companyCol===-1||repCol===-1||acctCol===-1||bankCol===-1){
      alert('필요한 컬럼(소속협력사/대표자/계좌번호/은행)을 찾을 수 없어요.');
      return;
    }

    const infoMap = {};
    for(let i=1;i<aoa.length;i++){
      const r = aoa[i];
      const company = String(r[companyCol]||'').trim();
      if(!company) continue;
      infoMap[company] = {
        rep: String(r[repCol]||'').trim(),
        acct: String(r[acctCol]||'').trim(),
        bank: String(r[bankCol]||'').trim()
      };
    }

    // 섹션 또는 전체에서 협력사명 기준 매칭
    const targetIndices = target ? target.indices : rows.map((_,i)=>i);
    let updated = 0;
    targetIndices.forEach(i=>{
      const r = rows[i];
      if(r.company && infoMap[r.company]){
        const info = infoMap[r.company];
        r.rep = info.rep; r.acct = info.acct; r.bank = info.bank;
        acctMap[r.company] = info;
        updated++;
      }
    });

    const unmatched = Object.keys(infoMap).filter(c=>!targetIndices.some(i=>rows[i].company===c)).length;

    localStorage.setItem('settle_acctmap', JSON.stringify(acctMap));
    render(); autoSave();

    let msg = `${updated}건의 계좌정보를 갱신했어요.`;
    if(unmatched>0) msg += `\n소속협력사가 일치하지 않는 ${unmatched}건은 반영되지 않았어요.`;
    alert(msg);
  };
  reader.readAsArrayBuffer(file);
  document.getElementById('acctInput').value='';
}

function resetExcelFields(){
  if(!confirm('모든 행의 협력사명·이체금액·정산시작일·정산종료일을 초기화할까요?\n(대표자·계좌·은행·정산현황은 유지됩니다)')) return;
  rows.forEach(r=>{
    r.company = '';
    r.amount = '';
    r.startDate = today;
    r.endDate = today;
  });
  autoSave();
  render();
}

function resetAccountFields(){
  if(!confirm('모든 행의 대표자·계좌번호·은행을 초기화할까요?')) return;
  rows.forEach(r=>{ r.rep=''; r.acct=''; r.bank=''; });
  acctMap = {};
  localStorage.setItem('settle_acctmap', JSON.stringify(acctMap));
  autoSave();
  render();
}

function exportCSV(){
  const headers=['정산시작일','정산종료일','소속협력사','대표자','계좌','은행','정산구분','이체금액','정산현황','세금계산서발행','메모'];
  const lines=['\uFEFF'+headers.join(',')];
  rows.forEach(r=>lines.push([r.startDate,r.endDate,'"'+r.company+'"','"'+r.rep+'"','"'+r.acct+'"','"'+r.bank+'"',r.settleType||'',r.amount,r.settle,r.tax,'"'+(r.memo||'')+'"'].join(',')));
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='정산현황_'+today+'.csv';a.click();
}

function initColResize(){
  const cols = document.querySelectorAll('#tbl colgroup col');
  const ths = document.querySelectorAll('#headRow th');
  const LAYOUT_VER = '3';
  if(localStorage.getItem('settle_layout_ver') !== LAYOUT_VER){
    localStorage.removeItem('settle_colwidths');
    localStorage.setItem('settle_layout_ver', LAYOUT_VER);
  }
  const saved = JSON.parse(localStorage.getItem('settle_colwidths')||'null');
  if(saved){
    cols.forEach((col,i)=>{ if(saved[i]) col.style.width = saved[i]+'px'; });
  }
  ths.forEach((th,i)=>{
    if(i>=cols.length-1) return; // 마지막(삭제) 컬럼은 크기 조절 제외
    const resizer = document.createElement('span');
    resizer.className = 'col-resizer';
    th.appendChild(resizer);
    resizer.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      const startX = e.pageX;
      const startW = cols[i].getBoundingClientRect().width;
      resizer.classList.add('active');
      function onMove(ev){
        const w = Math.max(30, startW + (ev.pageX - startX));
        cols[i].style.width = w+'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        resizer.classList.remove('active');
        const widths = Array.from(cols).map(c=>c.getBoundingClientRect().width);
        localStorage.setItem('settle_colwidths', JSON.stringify(widths));
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

window.addEventListener('beforeunload', forceSave);
</script>
</body>
</html>

  .cell .plus{opacity:0;background:none;border:none;color:var(--muted);font-size:17px;width:22px;height:22px;border-radius:4px;line-height:1}
  .cell:hover .plus{opacity:1}
  .cell .plus:hover{background:#333;color:var(--ink)}
  .dn{font-size:12.5px;color:var(--muted);padding:1px 5px}
  .cell.sun .dn{color:#e07b7b}
  .cell.sat .dn{color:#7ba7e0}
  .cell.today .dn{background:var(--today);color:#fff;border-radius:999px;font-weight:700}
  .cell.first .dn b{font-weight:700;color:var(--ink);margin-right:1px}

  .task{background:var(--card);border-radius:6px;padding:7px 8px;margin-bottom:5px;box-shadow:0 0 0 1px #333 inset;cursor:pointer}
  .task:hover{background:var(--card-h)}
  .task .tt{font-weight:700;font-size:13px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
  .task .tr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px}
  .task input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex:none}
  .task.done .tt{color:var(--faint);text-decoration:line-through}
  .task.dragging{opacity:.4}
  .tag{display:inline-block;border-radius:3px;padding:1px 6px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .more{font-size:12px;color:var(--muted);padding:2px 4px}

  /* ── 과목별 ── */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
  .col{background:#1d1d1d;border-radius:10px;padding:10px;min-height:120px}
  .col.drop{background:#1f2a36}
  .col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .col-h .n{color:var(--muted);font-size:12px}
  .col-h .p{margin-left:auto;background:none;border:none;color:var(--muted);font-size:17px;border-radius:4px;width:24px;height:24px}
  .col-h .p:hover{background:#333;color:var(--ink)}
  .task .dd{font-size:11.5px;color:var(--muted)}

  /* ── 목록 ── */
  .tbl-wrap{overflow-x:auto;margin-top:8px}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid #262626;vertical-align:top}
  tr.row{cursor:pointer}
  tr.row:hover td{background:#1f1f1f}
  tr.row.done .ttl{color:var(--faint);text-decoration:line-through}
  td input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .memo-s{color:var(--muted);font-size:12.5px;white-space:pre-wrap}

  /* ── 입력 창 ── */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px;z-index:50}
  .modal-bg[hidden]{display:none}
  .modal{background:#252525;border:1px solid #363636;border-radius:12px;width:min(520px,100%);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .modal .title-in{width:100%;background:none;border:none;outline:none;font-size:22px;font-weight:800;margin-bottom:14px}
  .modal .title-in::placeholder{color:#555}
  .prop{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;padding:5px 0}
  .prop label{color:var(--muted);font-size:13px}
  .prop input[type=date],.prop select{background:#1e1e1e;border:1px solid var(--line2);border-radius:6px;padding:6px 8px;color-scheme:dark;max-width:220px}
  .prop input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
  .modal textarea{width:100%;min-height:90px;margin-top:10px;background:#1e1e1e;border:1px solid var(--line2);border-radius:8px;padding:10px;resize:vertical;outline:none}
  .m-actions{display:flex;gap:8px;margin-top:16px}
  .m-actions .del{background:none;border:1px solid #5a2e2e;color:#f08c8c;border-radius:6px;padding:7px 12px}
  .m-actions .del:hover{background:#3a2020}
  .m-actions .sp{flex:1}
  .m-actions .cancel{background:none;border:1px solid var(--line2);border-radius:6px;padding:7px 14px}
  .m-actions .cancel:hover{background:#2e2e2e}

  .cat-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .cat-row input[type=text]{flex:1;background:#1e1e1e;border:1px solid var(--line2);border-radius:6px;padding:6px 8px}
  .cat-row select{background:#1e1e1e;border:1px solid var(--line2);border-radius:6px;padding:6px}
  .cat-row .x{background:none;border:none;color:var(--faint);font-size:18px}
  .cat-row .x:hover{color:var(--today)}
  .add-cat{background:none;border:1px dashed var(--line2);border-radius:6px;padding:6px 10px;color:var(--muted);width:100%}

  @media(max-width:860px){
    .wrap{padding:20px 14px 40px}
    .top{grid-template-columns:1fr;gap:18px}
    .cell{min-height:90px;padding:4px 2px}
    .task{padding:5px}
    .task .tag{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>업무 투두 리스트 <span class="cloud" id="cloud"></span></h1>

  <!-- 윗부분 -->
  <div class="top">
    <div class="quick" id="quick"></div>

    <div>
      <div class="sec-title">📋 개인 메모</div>
      <div class="callout">
        <h3>💡 개인 할 일</h3>
        <div id="notes"></div>
        <div class="addnote">＋ <input id="noteIn" placeholder="할 일을 적고 Enter" onkeydown="if(event.key==='Enter'&&!event.isComposing)addNote()"></div>
      </div>
    </div>
  </div>

  <!-- 캘린더 -->
  <div class="main-head">
    <h2>확인 하세요</h2>
    <button class="btn-new" onclick="openTask(null, todayStr())">새로 만들기</button>
  </div>

  <div class="main-head">
    <div class="views" id="views">
      <button data-v="cal" onclick="setView('cal')">📅 캘린더</button>
      <button data-v="year" onclick="setView('year')">🗓 연간</button>
      <button data-v="board" onclick="setView('board')">▥ 과목별</button>
      <button data-v="list" onclick="setView('list')">☰ 목록</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="toolbar">
    <div class="yearsel">
      <button class="navbtn" onclick="moveYear(-1)">‹</button>
      <span id="yearLabel"></span>
      <button class="navbtn" onclick="moveYear(1)">›</button>
    </div>
    <div class="months" id="months"></div>
    <div class="spacer"></div>
    <label class="hide-done"><input type="checkbox" id="hideDone" onchange="S.hideDone=this.checked;saveLocalUi();render()"> 완료 숨기기</label>
  </div>

  <div id="view"></div>
</div>

<!-- 할 일 입력/수정 창 -->
<div class="modal-bg" id="taskModal" hidden onmousedown="if(event.target===this)closeModal()">
  <div class="modal">
    <input class="title-in" id="mTitle" placeholder="할 일 제목" onkeydown="if(event.key==='Enter'&&!event.isComposing)saveTask()">
    <div class="prop"><label>📅 날짜</label><input type="date" id="mDate"></div>
    <div class="prop"><label>🏷 분류</label><select id="mCat"></select></div>
    <div class="prop"><label>☑ 완료</label><input type="checkbox" id="mDone"></div>
    <textarea id="mMemo" placeholder="메모 (선택)"></textarea>
    <div class="m-actions">
      <button class="del" id="mDel" onclick="deleteTask()">삭제</button>
      <div class="sp"></div>
      <button class="cancel" onclick="closeModal()">취소</button>
      <button class="btn-new" onclick="saveTask()">저장</button>
    </div>
  </div>
</div>

<!-- 분류 편집 창 -->
<div class="modal-bg" id="catModal" hidden onmousedown="if(event.target===this)closeCats()">
  <div class="modal">
    <div class="title-in" style="margin-bottom:12px">분류 편집</div>
    <div id="catList"></div>
    <button class="add-cat" onclick="addCatRow()">＋ 분류 추가</button>
    <div class="m-actions">
      <div class="sp"></div>
      <button class="cancel" onclick="closeCats()">취소</button>
      <button class="btn-new" onclick="saveCats()">저장</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ★ 클라우드 저장 설정 (수수료 지급표와 같은 Supabase 사용)
   - 표(fee_state) 안에 id = "todo_main" 한 줄로 투두 전체를 저장합니다.
   ========================================================= */
const SB_URL = "https://micquonnaxyhwxwksctf.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pY3F1b25uYXh5aHd4d2tzY3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTY0MDgsImV4cCI6MjA5NjY5MjQwOH0.9S0DhscVBWUw1nerK5weF5GMoJaTTZHLtL91yOaqHR0";
const SB_TABLE = "fee_state";
const SB_ID = "todo_main";
const LS_DATA = "todo_data";
const LS_UI = "todo_ui";

let sb = null;
try { if (window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) { console.warn(e); }

/* ── 분류 색상 (노션 다크 태그 색) ── */
const COLORS = {
  gray:   { bg:"#373737", fg:"#d4d4d4", name:"회색" },
  green:  { bg:"#2b593f", fg:"#c7ecd6", name:"초록" },
  red:    { bg:"#6e3630", fg:"#f6d0cb", name:"빨강" },
  purple: { bg:"#492f64", fg:"#e3d2f6", name:"보라" },
  blue:   { bg:"#28456c", fg:"#cfe1f7", name:"파랑" },
  orange: { bg:"#854c1d", fg:"#f8dcc3", name:"주황" },
  yellow: { bg:"#89632a", fg:"#f8e8c3", name:"노랑" },
  pink:   { bg:"#69314c", fg:"#f5d2e3", name:"분홍" },
  brown:  { bg:"#603b2c", fg:"#ecd8cd", name:"갈색" },
};
const DEFAULT_CATS = [
  { id:"tax",  name:"소득신고",   color:"gray" },
  { id:"fee",  name:"수수료 정산", color:"green" },
  { id:"mine", name:"개인 진행",  color:"red" },
  { id:"etc",  name:"기타 업무",  color:"purple" },
];

/* ── 데이터 ── */
let D = loadJSON(LS_DATA, null) || { tasks: [], notes: [], cats: DEFAULT_CATS };
if (!Array.isArray(D.cats) || !D.cats.length) D.cats = DEFAULT_CATS;
D.tasks = D.tasks || []; D.notes = D.notes || [];

/* ── 화면 상태 (이 브라우저에만 저장) ── */
const now = new Date();
let S = Object.assign({ view:"cal", year: now.getFullYear(), month: now.getMonth(), hideDone:false, off:[] }, loadJSON(LS_UI, {}));
S.year = S.year || now.getFullYear();
let editingId = null;

function loadJSON(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
function saveLocalUi() { try { localStorage.setItem(LS_UI, JSON.stringify(S)); } catch (e) {} }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function todayStr() { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); }
function catOf(id) { return D.cats.find(c => c.id === id) || { id, name:"(분류 없음)", color:"gray" }; }
function tagHtml(id) { const c = catOf(id), col = COLORS[c.color] || COLORS.gray; return `<span class="tag" style="background:${col.bg};color:${col.fg}">${esc(c.name)}</span>`; }
function visible(t) { return !(S.hideDone && t.done) && !S.off.includes(t.cat); }

/* =========================================================
   저장 (브라우저 + 클라우드)
   ========================================================= */
let pushTimer = null;
function save() {
  try { localStorage.setItem(LS_DATA, JSON.stringify(D)); } catch (e) {}
  if (!sb) return;
  setCloud("saving");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 600);
}
async function pushNow() {
  try {
    const { error } = await sb.from(SB_TABLE).upsert({ id: SB_ID, data: D, updated_at: new Date().toISOString() });
    if (error) throw error;
    setCloud("ok");
  } catch (e) { console.warn("투두 저장 실패:", e.message || e); setCloud("err"); }
}
async function loadCloud() {
  if (!sb) { setCloud("local"); return; }
  setCloud("loading");
  try {
    const { data, error } = await sb.from(SB_TABLE).select("data").eq("id", SB_ID).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      D = data.data;
      if (!Array.isArray(D.cats) || !D.cats.length) D.cats = DEFAULT_CATS;
      D.tasks = D.tasks || []; D.notes = D.notes || [];
      try { localStorage.setItem(LS_DATA, JSON.stringify(D)); } catch (e) {}
      renderAll();
      setCloud("ok");
    } else {
      await pushNow();   // 클라우드에 아직 없으면 지금 내용을 올림
    }
  } catch (e) { console.warn("투두 불러오기 실패:", e.message || e); setCloud("err"); }
}
function setCloud(st) {
  const el = document.getElementById("cloud");
  const map = { local:["💾 이 브라우저에만 저장",""], loading:["☁️ 불러오는 중…",""], saving:["☁️ 저장 중…",""], ok:["☁️ 클라우드 저장됨","ok"], err:["⚠️ 클라우드 저장 실패","err"] };
  const [t, c] = map[st] || map.local;
  el.textContent = t; el.className = "cloud " + c;
}

/* =========================================================
   윗부분: 빠른 추가 / 개인 할 일
   ========================================================= */
function renderQuick() {
  document.getElementById("quick").innerHTML =
    `<div class="qt">빠른 추가 (오늘 날짜)</div>` +
    D.cats.map(c => { const col = COLORS[c.color] || COLORS.gray;
      return `<button class="qbtn" style="background:${col.bg};color:${col.fg}" onclick="openTask(null, todayStr(), '${c.id}')"><b>+</b>${esc(c.name)}</button>`; }).join("") +
    `<button class="edit-cats" onclick="openCats()">⚙ 분류 편집</button>`;
}
function renderNotes() {
  document.getElementById("notes").innerHTML = D.notes.map(n => `
    <div class="note ${n.done ? "done" : ""}">
      <input type="checkbox" ${n.done ? "checked" : ""} onchange="toggleNote('${n.id}', this.checked)">
      <div class="nt" contenteditable="true" onblur="editNote('${n.id}', this.innerText)" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();this.blur()}">${esc(n.text)}</div>
      <button class="x" title="삭제" onclick="delNote('${n.id}')">×</button>
    </div>`).join("");
}
function addNote() {
  const el = document.getElementById("noteIn"), v = el.value.trim();
  if (!v) return;
  D.notes.push({ id: uid(), text: v, done: false });
  el.value = ""; save(); renderNotes();
}
function toggleNote(id, v) { const n = D.notes.find(x => x.id === id); if (n) { n.done = v; save(); renderNotes(); } }
function editNote(id, v) { const n = D.notes.find(x => x.id === id); if (n && n.text !== v.trim()) { n.text = v.trim(); if (!n.text) D.notes = D.notes.filter(x => x.id !== id); save(); renderNotes(); } }
function delNote(id) { D.notes = D.notes.filter(x => x.id !== id); save(); renderNotes(); }

/* =========================================================
   보기 전환 / 연도·월 이동 / 분류 필터
   ========================================================= */
function setView(v) { S.view = v; saveLocalUi(); render(); }
function moveYear(d) { S.year += d; saveLocalUi(); render(); }
function moveMonth(d) {
  S.month += d;
  if (S.month < 0) { S.month = 11; S.year--; }
  if (S.month > 11) { S.month = 0; S.year++; }
  saveLocalUi(); render();
}
function goMonth(m) { S.month = m; if (S.view === "year") S.view = "cal"; saveLocalUi(); render(); }
function goToday() { const t = new Date(); S.year = t.getFullYear(); S.month = t.getMonth(); saveLocalUi(); render(); }
function toggleFilter(id) { S.off = S.off.includes(id) ? S.off.filter(x => x !== id) : [...S.off, id]; saveLocalUi(); render(); }

function renderBars() {
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
  document.getElementById("yearLabel").textContent = S.year + "년";
  document.getElementById("hideDone").checked = S.hideDone;
  const counts = Array(12).fill(0);
  D.tasks.forEach(t => { if (t.date && +t.date.slice(0, 4) === S.year && !t.done) counts[+t.date.slice(5, 7) - 1]++; });
  document.getElementById("months").innerHTML = counts.map((c, i) =>
    `<button class="mchip ${S.view !== "year" && i === S.month ? "on" : ""}" onclick="goMonth(${i})" title="남은 일 ${c}건">${i + 1}월${c ? `<span class="c">${c}</span>` : ""}</button>`).join("");
  document.getElementById("filters").innerHTML = D.cats.map(c => { const col = COLORS[c.color] || COLORS.gray;
    return `<button class="fchip ${S.off.includes(c.id) ? "" : "on"}" style="background:${col.bg};color:${col.fg}" onclick="toggleFilter('${c.id}')" title="눌러서 보이기/숨기기">${esc(c.name)}</button>`; }).join("");
}

function render() {
  renderBars();
  const v = document.getElementById("view");
  if (S.view === "year") v.innerHTML = yearHtml();
  else if (S.view === "board") v.innerHTML = boardHtml();
  else if (S.view === "list") v.innerHTML = listHtml();
  else v.innerHTML = calHtml();
}
function renderAll() { renderQuick(); renderNotes(); render(); }

/* ── 할 일 카드 ── */
function taskCard(t, showDate) {
  return `<div class="task ${t.done ? "done" : ""}" draggable="true" data-id="${t.id}"
      onclick="event.stopPropagation(); openTask('${t.id}')"
      ondragstart="dragStart(event,'${t.id}')" ondragend="this.classList.remove('dragging')">
    <div class="tt">${esc(t.title) || "(제목 없음)"}</div>
    <div class="tr">${tagHtml(t.cat)}${showDate ? `<span class="dd">${t.date ? t.date.slice(5).replace("-", "/") : "날짜 없음"}</span>` : ""}</div>
    <div class="tr" style="margin-top:6px"><input type="checkbox" ${t.done ? "checked" : ""} onclick="event.stopPropagation()" onchange="toggleTask('${t.id}', this.checked)"></div>
  </div>`;
}
function toggleTask(id, v) { const t = D.tasks.find(x => x.id === id); if (t) { t.done = v; save(); render(); } }
function sortTasks(a, b) { return (a.done - b.done) || (a.order || 0) - (b.order || 0) || String(a.created).localeCompare(String(b.created)); }

/* ── 월 캘린더 ── */
function calHtml() {
  const y = S.year, m = S.month;
  const first = new Date(y, m, 1), startDow = first.getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const weeks = Math.ceil((startDow + days) / 7);
  const today = todayStr();
  const byDate = {};
  D.tasks.filter(visible).forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });

  let cells = "";
  for (let i = 0; i < weeks * 7; i++) {
    const dt = new Date(y, m, i - startDow + 1);
    const key = ymd(dt.getFullYear(), dt.getMonth(), dt.getDate());
    const out = dt.getMonth() !== m, dow = dt.getDay();
    const list = (byDate[key] || []).sort(sortTasks);
    const label = dt.getDate() === 1 ? `<b>${dt.getMonth() + 1}월</b> 1일` : dt.getDate();
    cells += `<div class="cell ${out ? "out" : ""} ${dow === 0 ? "sun" : dow === 6 ? "sat" : ""} ${key === today ? "today" : ""} ${dt.getDate() === 1 ? "first" : ""}"
        onclick="openTask(null,'${key}')" ondragover="dragOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="dropOn(event,this,'${key}')">
      <div class="dh"><button class="plus" title="이 날짜에 추가" onclick="event.stopPropagation(); openTask(null,'${key}')">+</button><span class="dn">${label}</span></div>
      ${list.map(t => taskCard(t)).join("")}
    </div>`;
  }
  return `<div class="monthtitle"><b>${y}년 ${m + 1}월</b>
      <div class="r"><button class="navbtn" onclick="moveMonth(-1)">‹</button><button class="today-btn" onclick="goToday()">오늘</button><button class="navbtn" onclick="moveMonth(1)">›</button></div></div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid">${cells}</div>`;
}

/* ── 연간 보기 (12개월 한눈에) ── */
function yearHtml() {
  const y = S.year, today = todayStr();
  const byDate = {};
  D.tasks.filter(visible).forEach(t => { if (t.date && +t.date.slice(0, 4) === y) (byDate[t.date] = byDate[t.date] || []).push(t); });
  let html = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:8px">`;
  for (let m = 0; m < 12; m++) {
    const sd = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    let g = "";
    for (let i = 0; i < sd; i++) g += `<div></div>`;
    for (let d = 1; d <= days; d++) {
      const key = ymd(y, m, d), list = byDate[key] || [];
      const left = list.filter(t => !t.done).length;
      const dow = (sd + d - 1) % 7;
      const bg = list.length ? (left ? "#28456c" : "#2b593f") : "transparent";
      const tip = list.map(t => (t.done ? "✔ " : "• ") + t.title).join("\n");
      g += `<div onclick="S.month=${m};setView('cal')" title="${esc(tip)}" style="cursor:pointer;text-align:center;padding:4px 0;border-radius:5px;font-size:12px;background:${bg};${key === today ? "outline:2px solid var(--today);" : ""}color:${list.length ? "#fff" : dow === 0 ? "#e07b7b" : dow === 6 ? "#7ba7e0" : "var(--muted)"}">${d}${list.length ? `<div style="font-size:9.5px;opacity:.85">${left || "✔"}</div>` : ""}</div>`;
    }
    const cnt = Object.keys(byDate).filter(k => +k.slice(5, 7) === m + 1).reduce((s, k) => s + byDate[k].filter(t => !t.done).length, 0);
    html += `<div class="col"><div class="col-h"><b style="cursor:pointer" onclick="goMonth(${m})">${m + 1}월</b><span class="n">${cnt ? `남은 일 ${cnt}건` : ""}</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;color:var(--faint);text-align:center;margin-bottom:4px"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${g}</div></div>`;
  }
  return html + `</div><p style="color:var(--faint);font-size:12px;margin-top:10px">파란 칸 = 남은 일이 있는 날(숫자 = 남은 건수) · 초록 칸 = 모두 완료 · 날짜를 누르면 그 달 캘린더로 이동</p>`;
}

/* ── 과목별 (분류별 보드) : 선택한 달 기준 ── */
function boardHtml() {
  const mk = `${S.year}-${pad(S.month + 1)}`;
  const inMonth = D.tasks.filter(t => (t.date || "").startsWith(mk)).filter(visible);
  const cols = D.cats.filter(c => !S.off.includes(c.id));
  return `<div class="monthtitle"><b>${S.year}년 ${S.month + 1}월 · 분류별</b>
      <div class="r"><button class="navbtn" onclick="moveMonth(-1)">‹</button><button class="today-btn" onclick="goToday()">오늘</button><button class="navbtn" onclick="moveMonth(1)">›</button></div></div>
    <div class="board">${cols.map(c => {
      const list = inMonth.filter(t => t.cat === c.id).sort((a, b) => (a.done - b.done) || a.date.localeCompare(b.date));
      return `<div class="col" ondragover="dragOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="dropCat(event,this,'${c.id}')">
        <div class="col-h">${tagHtml(c.id)}<span class="n">${list.length}</span><button class="p" title="추가" onclick="openTask(null, defaultDateInView(), '${c.id}')">+</button></div>
        ${list.map(t => taskCard(t, true)).join("") || `<div class="more">할 일이 없어요</div>`}
      </div>`; }).join("")}</div>`;
}
function defaultDateInView() {
  const t = new Date();
  if (t.getFullYear() === S.year && t.getMonth() === S.month) return todayStr();
  return ymd(S.year, S.month, 1);
}

/* ── 목록 (선택한 연도 전체) ── */
function listHtml() {
  const list = D.tasks.filter(t => (t.date || "").startsWith(S.year + "-") || !t.date).filter(visible)
    .sort((a, b) => (a.done - b.done) || String(a.date).localeCompare(String(b.date)));
  if (!list.length) return `<div class="empty">${S.year}년에 등록된 할 일이 없어요.</div>`;
  return `<div class="tbl-wrap"><table>
    <thead><tr><th style="width:44px">완료</th><th style="width:110px">날짜</th><th>할 일</th><th style="width:130px">분류</th><th>메모</th></tr></thead>
    <tbody>${list.map(t => `<tr class="row ${t.done ? "done" : ""}" onclick="openTask('${t.id}')">
      <td><input type="checkbox" ${t.done ? "checked" : ""} onclick="event.stopPropagation()" onchange="toggleTask('${t.id}', this.checked)"></td>
      <td>${t.date || "-"}</td><td class="ttl"><b>${esc(t.title)}</b></td><td>${tagHtml(t.cat)}</td><td class="memo-s">${esc(t.memo || "")}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* =========================================================
   끌어서 옮기기 (카드를 다른 날짜 / 다른 분류로)
   ========================================================= */
let dragId = null;
function dragStart(e, id) { dragId = id; e.dataTransfer.setData("text/plain", id); e.currentTarget.classList.add("dragging"); }
function dragOver(e, el) { if (!dragId) return; e.preventDefault(); el.classList.add("drop"); }
function dropOn(e, el, date) {
  e.preventDefault(); el.classList.remove("drop");
  const t = D.tasks.find(x => x.id === dragId); dragId = null;
  if (t && t.date !== date) { t.date = date; save(); render(); }
}
function dropCat(e, el, cat) {
  e.preventDefault(); el.classList.remove("drop");
  const t = D.tasks.find(x => x.id === dragId); dragId = null;
  if (t && t.cat !== cat) { t.cat = cat; save(); render(); }
}

/* =========================================================
   할 일 입력 창
   ========================================================= */
function openTask(id, date, cat) {
  editingId = id;
  const t = id ? D.tasks.find(x => x.id === id) : null;
  document.getElementById("mCat").innerHTML = D.cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  document.getElementById("mTitle").value = t ? t.title : "";
  document.getElementById("mDate").value = t ? (t.date || "") : (date || todayStr());
  document.getElementById("mCat").value = t ? t.cat : (cat || D.cats[0].id);
  document.getElementById("mDone").checked = t ? !!t.done : false;
  document.getElementById("mMemo").value = t ? (t.memo || "") : "";
  document.getElementById("mDel").style.visibility = t ? "visible" : "hidden";
  document.getElementById("taskModal").hidden = false;
  setTimeout(() => document.getElementById("mTitle").focus(), 30);
}
function closeModal() { document.getElementById("taskModal").hidden = true; editingId = null; }
function saveTask() {
  const title = document.getElementById("mTitle").value.trim();
  if (!title) { document.getElementById("mTitle").focus(); return; }
  const vals = {
    title,
    date: document.getElementById("mDate").value,
    cat: document.getElementById("mCat").value,
    done: document.getElementById("mDone").checked,
    memo: document.getElementById("mMemo").value,
  };
  if (editingId) Object.assign(D.tasks.find(x => x.id === editingId), vals);
  else D.tasks.push(Object.assign({ id: uid(), created: new Date().toISOString() }, vals));
  if (vals.date) { S.year = +vals.date.slice(0, 4); if (S.view !== "list" && S.view !== "year") S.month = +vals.date.slice(5, 7) - 1; saveLocalUi(); }
  save(); closeModal(); render();
}
function deleteTask() {
  if (!editingId || !confirm("이 할 일을 삭제할까요?")) return;
  D.tasks = D.tasks.filter(x => x.id !== editingId);
  save(); closeModal(); render();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeCats(); } });

/* =========================================================
   분류 편집
   ========================================================= */
let catDraft = [];
function openCats() { catDraft = D.cats.map(c => ({ ...c })); drawCats(); document.getElementById("catModal").hidden = false; }
function closeCats() { document.getElementById("catModal").hidden = true; }
function drawCats() {
  document.getElementById("catList").innerHTML = catDraft.map((c, i) => `
    <div class="cat-row">
      <input type="text" value="${esc(c.name)}" oninput="catDraft[${i}].name=this.value" placeholder="분류 이름">
      <select onchange="catDraft[${i}].color=this.value;drawCats()" style="background:${(COLORS[c.color] || COLORS.gray).bg}">
        ${Object.entries(COLORS).map(([k, v]) => `<option value="${k}" ${k === c.color ? "selected" : ""}>${v.name}</option>`).join("")}
      </select>
      <button class="x" title="삭제" onclick="removeCat(${i})">×</button>
    </div>`).join("");
}
function addCatRow() { catDraft.push({ id: "c" + uid(), name: "", color: "blue" }); drawCats(); }
function removeCat(i) {
  const used = D.tasks.filter(t => t.cat === catDraft[i].id).length;
  if (used && !confirm(`이 분류로 등록된 할 일이 ${used}건 있어요. 분류를 지워도 할 일은 남고 '(분류 없음)'으로 보여요. 지울까요?`)) return;
  catDraft.splice(i, 1); drawCats();
}
function saveCats() {
  const list = catDraft.filter(c => c.name.trim()).map(c => ({ ...c, name: c.name.trim() }));
  if (!list.length) { alert("분류가 하나 이상 있어야 해요."); return; }
  D.cats = list; save(); closeCats(); renderAll();
}

/* 시작 */
renderAll();
loadCloud();
</script>
</body>
