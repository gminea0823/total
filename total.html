async function prepImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("이미지를 열 수 없어요")); img.src = url; });
  let scale = img.width < 3400 ? Math.min(3, 3400 / img.width) : 1;
  scale = Math.min(scale, Math.sqrt(30e6 / (img.width * img.height)));   // 너무 큰 그림은 줄임
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.drawImage(img, 0, 0, c.width, c.height);
  const id = g.getImageData(0, 0, c.width, c.height), p = id.data, n = p.length / 4;
  const gray = new Uint8ClampedArray(n), hist = new Array(256).fill(0);
  let total = 0;
  // 색 글자(초록 '운영', 파랑 '배민' 등)도 진하게 남도록 밝기 대신 가장 어두운 색 성분을 씀
  for (let i = 0; i < n; i++) { const y = Math.min(p[i * 4], p[i * 4 + 1], p[i * 4 + 2]); gray[i] = y; hist[y]++; total += y; }
  const invert = total / n < 110;   // 어두운 화면 캡쳐면 반전
  // 오츠 방식으로 글자/배경 경계값을 찾아 또렷하게 (글자 가장자리는 부드럽게 남김)
  let sumAll = 0; for (let t = 0; t < 256; t++) sumAll += t * hist[t];
  let wB = 0, sumB = 0, best = 0, th = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sumAll - sumB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; th = t; }
  }
  for (let i = 0; i < n; i++) {
    let y = gray[i]; if (invert) y = 255 - y;
    const t = invert ? 255 - th : th;
    const v = y < t - 40 ? 0 : y > t + 25 ? 255 : Math.round((y - (t - 40)) * 255 / 65);
    p[i * 4] = p[i * 4 + 1] = p[i * 4 + 2] = v;
  }
  g.putImageData(id, 0, 0);
  return { canvas: c, url };
}

/* ── 글자 다듬기 ── */
const BANK_RE = /국민|신한|우리|하나|농협|NH|기업|IBK|SC|제일|카카오|토스|케이뱅크|K뱅크|새마을|우체국|수협|신협|산업|씨티|부산|대구|경남|광주|전북|제주|저축/i;
function cleanText(s) { return String(s || "").replace(/[|¦｜_]/g, " ").replace(/(?<=[가-힣])\s+(?=[가-힣])/g, "").replace(/\s+/g, " ").trim(); }
function digitsFix(s) { return String(s).replace(/[Oo○]/g, "0").replace(/[Il|!]/g, "1").replace(/[Ss]/g, "5").replace(/B/g, "8").replace(/Z/g, "2"); }
function isDate(s) { return /^(20)?\d{2}[-.\/]\d{1,2}[-.\/]\d{1,2}\.?$/.test(String(s).replace(/\s/g, "")); }
function looksAmount(s) {
  const t = digitsFix(String(s).replace(/\s/g, "")).replace(/원$/, "");
  return /^[-–—△▲(]?\d[\d,.]*\)?$/.test(t) && !isAcct(t) && !isDate(t);
}
function cleanAmount(s) {
  let t = digitsFix(String(s).replace(/\s/g, "")).replace(/원/g, "");
  const neg = /^[-–—△▲(]/.test(t) || /\)$/.test(t);
  t = t.replace(/[^0-9]/g, "");
  if (!t) return "";
  return (neg && +t ? "-" : "") + String(parseInt(t, 10));
}
function isAcct(s) {
  const t = digitsFix(String(s).replace(/\s/g, ""));
  if (t.includes(",") || isDate(t) || !/^\d[\d-]{7,}\d$/.test(t)) return false;
  return t.includes("-") || t.replace(/-/g, "").length >= 10;
}
function cleanAcct(s) { return digitsFix(String(s).replace(/\s/g, "")).replace(/[^0-9-]/g, ""); }
/* 은행 이름은 실제 은행 목록 중 가장 비슷한 것으로 맞춤 (예: 국민은현 → 국민은행) */
const BANKS = ["국민은행", "신한은행", "우리은행", "하나은행", "농협은행", "기업은행", "SC제일은행", "카카오뱅크", "토스뱅크", "케이뱅크",
  "새마을금고", "우체국", "수협은행", "신협", "산업은행", "씨티은행", "부산은행", "대구은행", "경남은행", "광주은행", "전북은행", "제주은행", "iM뱅크", "저축은행"];
function fixBank(s) {
  const t = String(s || "").replace(/[^가-힣A-Za-z]/g, "");
  if (!t) return "";
  let best = "", score = 0;
  BANKS.forEach(b => {
    const head = b.replace(/은행$/, "");
    let n = 0; [...head].forEach(ch => { if (t.includes(ch)) n++; });
    const sc = n / head.length + (t.includes(head) ? 1 : 0);
    if (sc > score) { score = sc; best = b; }
  });
  return score >= 0.5 ? best : t;
}
function emptyBm() { const r = {}; BM_FIELDS.forEach(f => r[f.k] = ""); return r; }
function finishRec(cellsByKey) {
  const r = emptyBm();
  Object.entries(cellsByKey).forEach(([k, parts]) => {
    const t = parts.join(" ");
    r[k] = BM_AMOUNT.includes(k) ? cleanAmount(t) : k === "acct" ? cleanAcct(t) : k === "bank" ? fixBank(t)
      : ["opState", "channel"].includes(k) ? cleanText(t).replace(/\s/g, "") : cleanText(t);

/* Tesseract 결과에서 글자 조각(단어)과 위치 꺼내기 */
function getWords(data) {

  if (!ws.length) (data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => (l.words || []).forEach(w => ws.push(w)))));
  return ws.map(w => ({ t: String(w.text || "").trim(), conf: w.confidence ?? 0, x0: w.bbox.x0, x1: w.bbox.x1, y0: w.bbox.y0, y1: w.bbox.y1 }))
    .filter(w => w.t && /[0-9A-Za-z가-힣]/.test(w.t))

/* 같은 높이의 단어끼리 한 줄, 줄 안에서 간격이 넓으면 다른 칸(cell) */
function groupLines(words, mh) {

    if (l && Math.abs(w.cy - l.cy) < mh * 0.6) { l.words.push(w); l.cy = l.words.reduce((s, x) => s + x.cy, 0) / l.words.length; }
    else lines.push({ cy: w.cy, words: [w] });

      const bothNum = c && looksAmount(c.words[c.words.length - 1].t) && looksAmount(w.t);
      if (c && gap < mh * 0.9 && !bothNum) { c.words.push(w); c.x1 = Math.max(c.x1, w.x1); c.t += " " + w.t; c.conf = Math.min(c.conf, w.conf); }
      else l.cells.push({ x0: w.x0, x1: w.x1, t: w.t, conf: w.conf, words: [w] });

    if (hit) { hit.t += c.t; hit.words.push(...c.words); hit.x0 = Math.min(hit.x0, c.x0); hit.x1 = Math.max(hit.x1, c.x1); hit.cx = (hit.x0 + hit.x1) / 2; }

      const found = {}, skips = [];

/* 못 찾은 머리글 칸 위치는 찾은 칸들 사이를 기본 너비 비율로 채움 */
function makeAnchors(found) {

function parseBaemin(data) {

/* 2차 확인: 칸 하나씩 잘라서 다시 읽음
   - 비어 있는 금액 칸 → 숫자만 읽기 (작은 '0' 같은 것)
   - 이름 칸(운영여부·주문채널·협력사명·계좌주) → 한 줄로 다시 읽어서 더 확실하면 바꿈 */

function targetWeekForPaste() {
  const w = W(activeWeek);

}
async function ocrFiles(files, wid) {
  files = (files || []).filter(f => f && f.type.startsWith("image/"));
  if (READONLY || !files.length) return;
  if (!ocr) ocr = { weekId: W(wid) ? wid : targetWeekForPaste(), images: [], rows: [], raw: "", status: "", progress: 0 };
  document.getElementById("ocrModal").hidden = false;
  try {
    ocr.status = "글자 인식 준비 중… (처음 한 번은 조금 걸려요)"; renderOcr();
    if (!window.Tesseract) await loadScript(TESSERACT_JS);
    const worker = await Tesseract.createWorker("kor+eng", 1, {
      logger: m => { if (ocr && m.status === "recognizing text") { ocr.progress = m.progress; renderOcrProgress(); } },
    });
    await worker.setParameters({ tessedit_pageseg_mode: "11", preserve_interword_spaces: "1" });
    for (let i = 0; i < files.length; i++) {
      if (!ocr) break;   // 도중에 닫음
      ocr.status = `캡쳐 ${i + 1} / ${files.length} 읽는 중…`; ocr.progress = 0; renderOcr();
      const { canvas, url } = await prepImage(files[i]);
      ocr.images.push(url);
      const { data } = await worker.recognize(canvas, {}, { text: true, blocks: true });
      if (!ocr) break;
      ocr.raw += (ocr.raw ? "\n\n" : "") + data.text;
      const parsed = parseBaemin(data);
      ocr.status = `캡쳐 ${i + 1} / ${files.length} 칸별로 다시 확인하는 중…`; renderOcr();
      await refineRows(worker, canvas, parsed);
      if (!ocr) break;
      ocr.rows.push(...parsed.rows);

    await worker.terminate();
    if (ocr) { ocr.status = ""; renderOcr(); }
  } catch (e) {
    console.warn(e);
    if (ocr) { ocr.status = "⚠ " + (e.message || "글자를 읽지 못했어요") + " — 다시 시도하거나 직접 입력해 주세요."; renderOcr(); }

}

  const thumbs = ocr.images.map(u => `<img src="${u}" alt="캡쳐">`).join("");
  let main;

  } else {

        <td style="text-align:center"><input type="checkbox" ${r.use ? "checked" : ""} onchange="ocr.rows[${i}].use=this.checked;this.closest('tr').className=this.checked?'':'off';ocrFootCount()"></td>
        ${BM_FIELDS.map(f => `<td><input type="text" class="${f.amount ? "n" : ""}" value="${f.amount ? fmt(r[f.k]) : esc(r[f.k])}" oninput="ocr.rows[${i}].${f.k}=this.value"></td>`).join("")}

/* ── 쿠팡: 엑셀에서 복사한 줄(칸은 탭으로 구분) → 행 추가 ── */
let activeSec = null;   // 마지막으로 누른 항목 { wid, sec }
document.addEventListener("mousedown", e => {
  const sec = e.target.closest && e.target.closest(".sec");
  activeSec = sec ? { wid: sec.dataset.wid, sec: e.target.closest(".fee-box") ? "fee" : sec.dataset.sec } : null;
});
function looksMoney(c) { const t = String(c).replace(/\s/g, ""); return /\d/.test(t) && /^[-–(]?[\d,]+(\.\d+)?\)?원?$/.test(t); }
function pasteCoupang(wid, text) {
  const w = W(wid); if (!w) return;
  const add = [];
  text.replace(/\r/g, "").split("\n").forEach(line => {
    const cells = line.split("\t").map(c => c.trim()).filter(Boolean);
    if (!cells.length) return;
    const nums = cells.filter(looksMoney), texts = cells.filter(c => !looksMoney(c));

    add.push({ id: uid(), company: texts.join(" "), amount: nums.length ? cleanAmount(nums[nums.length - 1]) : "" });
  });
  if (!add.length) { alert("붙여넣은 내용에서 행을 찾지 못했어요. 엑셀에서 협력사·결제금액 칸을 함께 복사해 주세요."); return; }
  w.coupang.rows.push(...add);

/* ── 배민: 정산 화면 표를 복사해서 붙여넣기 ──
   한 협력사 = 여러 줄 (계좌번호와 금액이 있는 줄에서 시작해서, 다음 그런 줄 전까지)
   계좌번호를 기준으로: 앞 4칸 = 운영여부·주문채널·협력사명·은행명, 뒤 = 계좌주 → 금액 8칸

function parseBaeminText(text) {
  const recs = [];
  let cur = null;
  text.replace(/\r/g, "").split("\n").forEach(line => {
    const cells = line.split("\t").map(c => c.trim()).filter(Boolean);
    if (!cells.length) return;

    r.acct = cleanAcct(at(i)); r.holder = at(i + 1);

  rows.forEach(r => w.baemin.push(Object.assign({ id: uid() }, r)));

}
async function pasteButton(wid, sec) {
  try {
    const text = await navigator.clipboard.readText();
    if (sec === "bm") pasteBaemin(wid, text); else if (sec === "fee") pasteFee(wid, text); else pasteCoupang(wid, text);
  } catch (e) { activeSec = { wid, sec }; alert("브라우저가 붙여넣기를 막았어요. 이 항목을 한 번 누른 뒤 키보드로 Ctrl+V 해 주세요."); }

function flash(msg) {
  let el = document.getElementById("flash");
  if (!el) { el = document.createElement("div"); el.id = "flash"; document.body.appendChild(el); }
  el.textContent = msg; el.className = "show";
  clearTimeout(flash.t); flash.t = setTimeout(() => el.className = "", 2200);
}

/* Ctrl+V : 표 글자(여러 칸·여러 줄) → 누른 항목(배민/쿠팡)에 행 추가 / 캡쳐 이미지 → 배민 글자 인식
   (엑셀에서 복사하면 그림도 함께 들어오므로 글자를 먼저 봄) */
document.addEventListener("paste", e => {
  if (READONLY || !e.clipboardData || !document.getElementById("ocrModal").hidden) return;
  const text = e.clipboardData.getData("text/plain") || "";
  const secEl = e.target.closest && e.target.closest('.sec[data-sec="bm"], .sec[data-sec="cp"]');
  const target = secEl ? { wid: secEl.dataset.wid, sec: e.target.closest(".fee-box") ? "fee" : secEl.dataset.sec } : (activeSec && activeSec.sec !== "rd" ? activeSec : null);
  const multi = /[\t\n]/.test(text.trim());
  if (target && multi) {
    e.preventDefault();
    if (target.sec === "bm") pasteBaemin(target.wid, text); else if (target.sec === "fee") pasteFee(target.wid, text); else pasteCoupang(target.wid, text);
    return;
  }
  const items = [...(e.clipboardData.items || [])];
  const files = items.filter(it => it.type.startsWith("image/")).map(it => it.getAsFile());
  if (files.length && !(e.target.tagName === "INPUT" && text)) {
    e.preventDefault();
    ocrFiles(files, ocr ? ocr.weekId : (target && target.sec === "bm" ? target.wid : targetWeekForPaste()));
  }
});

    --bg:#191919; --panel:#202020; --card:#2a2a2a; --card-h:#313131;
    --line:#2f2f2f; --line2:#3a3a3a; --ink:#e6e6e6; --muted:#9b9b9b; --faint:#6f6f6f;
    --accent:#2383e2; --accent-h:#1b6ec2; --today:#eb5757;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;min-height:100vh}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 32px 60px}

  h1{font-size:30px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
  .cloud{font-size:12px;font-weight:600;color:var(--faint)}
  .cloud.ok{color:#4dab9a} .cloud.err{color:var(--today)}

  /* ── 윗부분: 빠른 추가 + 개인 할 일 ── */
  .top{display:grid;grid-template-columns:250px 1fr;gap:40px;margin:26px 0 40px}
  .quick{background:var(--panel);border-radius:10px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;align-self:start}
  .quick .qt{font-size:12px;color:var(--muted);margin-bottom:2px}
  .qbtn{border:1px solid var(--line2);border-radius:6px;padding:5px 11px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .qbtn:hover{filter:brightness(1.2)}
  .qbtn b{font-size:17px;font-weight:400;line-height:1}
  .quick .edit-cats{background:none;border:none;color:var(--faint);font-size:12px;margin-top:4px;padding:2px}
  .quick .edit-cats:hover{color:var(--ink)}

  .sec-title{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .callout{background:var(--panel);border-radius:10px;padding:18px 22px}
  .callout h3{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .note{display:flex;align-items:center;gap:10px;padding:3px 4px;border-radius:5px}
  .note:hover{background:#262626}
  .note input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);flex:none}
  .note .nt{flex:1;outline:none;padding:2px 0;line-height:1.5}
  .note.done .nt{color:var(--faint);text-decoration:line-through}
  .note .x{opacity:0;background:none;border:none;color:var(--faint);font-size:16px;padding:0 4px}
  .note:hover .x{opacity:1}
  .note .x:hover{color:var(--today)}
  .addnote{display:flex;gap:10px;align-items:center;margin-top:6px;padding:3px 4px;color:var(--faint)}
  .addnote input{flex:1;background:none;border:none;outline:none;padding:3px 0}
  .addnote input::placeholder{color:var(--faint)}

  /* ── 캘린더 영역 ── */
  .main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .main-head h2{font-size:22px;font-weight:800}
  .btn-new{background:var(--accent);border:none;color:#fff;font-weight:700;border-radius:6px;padding:7px 14px}
  .btn-new:hover{background:var(--accent-h)}
  .views{display:flex;gap:4px}
  .views button{background:none;border:none;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:600}
  .views button.on{background:#2c2c2c;color:var(--ink)}
  .views button:hover{color:var(--ink)}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
  .yearsel{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16px}
  .navbtn{background:none;border:1px solid transparent;border-radius:6px;color:var(--muted);padding:3px 9px;font-size:15px}
  .navbtn:hover{background:#2c2c2c;color:var(--ink)}
  .months{display:flex;gap:4px;flex-wrap:wrap}
  .mchip{background:none;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
  .mchip:hover{color:var(--ink);border-color:#555}
  .mchip.on{background:var(--ink);color:#191919;border-color:var(--ink);font-weight:700}
  .mchip .c{font-size:11px;margin-left:3px;opacity:.75}
  .spacer{flex:1}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .fchip{border:none;border-radius:4px;padding:3px 8px;font-size:12px;font-weight:600;opacity:.4}
  .fchip.on{opacity:1}
  .hide-done{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .hide-done input{accent-color:var(--accent)}

  .monthtitle{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
  .monthtitle b{font-size:15px}
  .monthtitle .r{display:flex;align-items:center;gap:2px}
  .today-btn{background:none;border:none;color:var(--ink);font-weight:600;padding:3px 8px;border-radius:6px}
  .today-btn:hover{background:#2c2c2c}

  .dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--muted);font-size:12px;padding:6px 0}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .cell{min-height:130px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 5px 8px;position:relative;cursor:pointer}
  .cell:hover{background:#1e1e1e}
  .cell.out{background:#161616}
  .cell.out .dn{color:#555}
  .cell.drop{background:#1f2a36}
  .cell .dh{display:flex;justify-content:space-between;align-items:center;height:22px;margin-bottom:4px}
  .cell .plus{opacity:0;background:none;border:none;color:var(--muted);font-size:17px;width:22px;height:22px;border-radius:4px;line-height:1}
  .cell:hover .plus{opacity:1}
  .cell .plus:hover{background:#333;color:var(--ink)}
  .dn{font-size:12.5px;color:var(--muted);padding:1px 5px}
  .cell.sun .dn{color:#e07b7b}
  .cell.sat .dn{color:#7ba7e0}
  .cell.today .dn{background:var(--today);color:#fff;border-radius:999px;font-weight:700}
  .cell.first .dn b{font-weight:700;color:var(--ink);margin-right:1px}

  .task{background:var(--card);border-radius:6px;padding:7px 8px;margin-bottom:5px;box-shadow:0 0 0 1px #333 inset;cursor:pointer}
  .task:hover{background:var(--card-h)}
  .task .tt{font-weight:700;font-size:13px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
  .task .tr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px}
  .task input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex:none}
  .task.done .tt{color:var(--faint);text-decoration:line-through}
  .task.dragging{opacity:.4}
  .tag{display:inline-block;border-radius:3px;padding:1px 6px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .more{font-size:12px;color:var(--muted);padding:2px 4px}

  /* ── 과목별 ── */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
  .col{background:#1d1d1d;border-radius:10px;padding:10px;min-height:120px}
  .col.drop{background:#1f2a36}
  .col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .col-h .n{color:var(--muted);font-size:12px}
  .col-h .p{margin-left:auto;background:none;border:none;color:var(--muted);font-size:17px;border-radius:4px;width:24px;height:24px}
  .col-h .p:hover{background:#333;color:var(--ink)}
  .task .dd{font-size:11.5px;color:var(--muted)}

  /* ── 목록 ── */
  .tbl-wrap{overflow-x:auto;margin-top:8px}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid #262626;vertical-align:top}
  tr.row{cursor:pointer}
  tr.row:hover td{background:#1f1f1f}
  tr.row.done .ttl{color:var(--faint);text-decoration:line-through}
  td input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .memo-s{color:var(--muted);font-size:12.5px;white-space:pre-wrap}

  /* ── 입력 창 ── */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px;z-index:50}
  .modal-bg[hidden]{display:none}
  .modal{background:#252525;border:1px solid #363636;border-radius:12px;width:min(520px,100%);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .modal .title-in{width:100%;background:none;border:none;outline:none;font-size:22px;font-weight:800;margin-bottom:14px}
  .modal .title-in::placeholder{color:#555}
  .prop{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;padding:5px 0}
  .prop label{color:var(--muted);font-size:13px}
  .prop input[type=date],.prop select{background:#1e1e1e;border:1px solid var(--line2);border-radius:6px;padding:6px 8px;color-scheme:dark;max-width:220px}
  .prop input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
  .modal textarea{width:100%;min-height:90px;margin-top:10px;background:#1e1e1e;border:1px solid var(--line2);border-radius:8px;padding:10px;resize:vertical;outline:none}
  .m-actions{display:flex;gap:8px;margin-top:16px}
  .m-actions .del{background:none;border:1px solid #5a2e2e;color:#f08c8c;border-radius:6px;padding:7px 12px}
  .m-actions .del:hover{background:#3a2020}
  .m-actions .sp{flex:1}
  .m-actions .cancel{background:none;border:1px solid var(--line2);border-radius:6px;padding:7px 14px}
  .m-actions .cancel:hover{background:#2e2e2e}

  .cat-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .cat-row input[type=text]{flex:1;background:#1e1e1e;border:1px solid var(--line2);border-radius:6px;padding:6px 8px}
  .cat-row select{background:#1e1e1e;border:1px solid var(--line2);border-radius:6px;padding:6px}
  .cat-row .x{background:none;border:none;color:var(--faint);font-size:18px}
  .cat-row .x:hover{color:var(--today)}
  .add-cat{background:none;border:1px dashed var(--line2);border-radius:6px;padding:6px 10px;color:var(--muted);width:100%}

  @media(max-width:860px){
    .wrap{padding:20px 14px 40px}
    .top{grid-template-columns:1fr;gap:18px}
    .cell{min-height:90px;padding:4px 2px}
    .task{padding:5px}
    .task .tag{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>업무 투두 리스트 <span class="cloud" id="cloud"></span></h1>

  <!-- 윗부분 -->
  <div class="top">
    <div class="quick" id="quick"></div>

    <div>
      <div class="sec-title">📋 개인 메모</div>
      <div class="callout">
        <h3>💡 개인 할 일</h3>
        <div id="notes"></div>
        <div class="addnote">＋ <input id="noteIn" placeholder="할 일을 적고 Enter" onkeydown="if(event.key==='Enter'&&!event.isComposing)addNote()"></div>
      </div>
    </div>
  </div>

  <!-- 캘린더 -->
  <div class="main-head">
    <h2>확인 하세요</h2>
    <button class="btn-new" onclick="openTask(null, todayStr())">새로 만들기</button>
  </div>

  <div class="main-head">
    <div class="views" id="views">
      <button data-v="cal" onclick="setView('cal')">📅 캘린더</button>
      <button data-v="year" onclick="setView('year')">🗓 연간</button>
      <button data-v="board" onclick="setView('board')">▥ 과목별</button>
      <button data-v="list" onclick="setView('list')">☰ 목록</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="toolbar">
    <div class="yearsel">
      <button class="navbtn" onclick="moveYear(-1)">‹</button>
      <span id="yearLabel"></span>
      <button class="navbtn" onclick="moveYear(1)">›</button>
    </div>
    <div class="months" id="months"></div>
    <div class="spacer"></div>
    <label class="hide-done"><input type="checkbox" id="hideDone" onchange="S.hideDone=this.checked;saveLocalUi();render()"> 완료 숨기기</label>
  </div>

  <div id="view"></div>
</div>

<!-- 할 일 입력/수정 창 -->
<div class="modal-bg" id="taskModal" hidden onmousedown="if(event.target===this)closeModal()">
  <div class="modal">
    <input class="title-in" id="mTitle" placeholder="할 일 제목" onkeydown="if(event.key==='Enter'&&!event.isComposing)saveTask()">
    <div class="prop"><label>📅 날짜</label><input type="date" id="mDate"></div>
    <div class="prop"><label>🏷 분류</label><select id="mCat"></select></div>
    <div class="prop"><label>☑ 완료</label><input type="checkbox" id="mDone"></div>
    <textarea id="mMemo" placeholder="메모 (선택)"></textarea>
    <div class="m-actions">
      <button class="del" id="mDel" onclick="deleteTask()">삭제</button>
      <div class="sp"></div>
      <button class="cancel" onclick="closeModal()">취소</button>
      <button class="btn-new" onclick="saveTask()">저장</button>
    </div>
  </div>
</div>

<!-- 분류 편집 창 -->
<div class="modal-bg" id="catModal" hidden onmousedown="if(event.target===this)closeCats()">
  <div class="modal">
    <div class="title-in" style="margin-bottom:12px">분류 편집</div>
    <div id="catList"></div>
    <button class="add-cat" onclick="addCatRow()">＋ 분류 추가</button>
    <div class="m-actions">
      <div class="sp"></div>
      <button class="cancel" onclick="closeCats()">취소</button>
      <button class="btn-new" onclick="saveCats()">저장</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ★ 클라우드 저장 설정 (수수료 지급표와 같은 Supabase 사용)
   - 표(fee_state) 안에 id = "todo_main" 한 줄로 투두 전체를 저장합니다.
   ========================================================= */
const SB_URL = "https://micquonnaxyhwxwksctf.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pY3F1b25uYXh5aHd4d2tzY3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTY0MDgsImV4cCI6MjA5NjY5MjQwOH0.9S0DhscVBWUw1nerK5weF5GMoJaTTZHLtL91yOaqHR0";
const SB_TABLE = "fee_state";
const SB_ID = "todo_main";
const LS_DATA = "todo_data";
const LS_UI = "todo_ui";

let sb = null;
try { if (window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) { console.warn(e); }

/* ── 분류 색상 (노션 다크 태그 색) ── */
const COLORS = {
  gray:   { bg:"#373737", fg:"#d4d4d4", name:"회색" },
  green:  { bg:"#2b593f", fg:"#c7ecd6", name:"초록" },
  red:    { bg:"#6e3630", fg:"#f6d0cb", name:"빨강" },
  purple: { bg:"#492f64", fg:"#e3d2f6", name:"보라" },
  blue:   { bg:"#28456c", fg:"#cfe1f7", name:"파랑" },
  orange: { bg:"#854c1d", fg:"#f8dcc3", name:"주황" },
  yellow: { bg:"#89632a", fg:"#f8e8c3", name:"노랑" },
  pink:   { bg:"#69314c", fg:"#f5d2e3", name:"분홍" },
  brown:  { bg:"#603b2c", fg:"#ecd8cd", name:"갈색" },
};
const DEFAULT_CATS = [
  { id:"tax",  name:"소득신고",   color:"gray" },
  { id:"fee",  name:"수수료 정산", color:"green" },
  { id:"mine", name:"개인 진행",  color:"red" },
  { id:"etc",  name:"기타 업무",  color:"purple" },
];

/* ── 데이터 ── */
let D = loadJSON(LS_DATA, null) || { tasks: [], notes: [], cats: DEFAULT_CATS };
if (!Array.isArray(D.cats) || !D.cats.length) D.cats = DEFAULT_CATS;
D.tasks = D.tasks || []; D.notes = D.notes || [];

/* ── 화면 상태 (이 브라우저에만 저장) ── */
const now = new Date();
let S = Object.assign({ view:"cal", year: now.getFullYear(), month: now.getMonth(), hideDone:false, off:[] }, loadJSON(LS_UI, {}));
S.year = S.year || now.getFullYear();
let editingId = null;

function loadJSON(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
function saveLocalUi() { try { localStorage.setItem(LS_UI, JSON.stringify(S)); } catch (e) {} }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function todayStr() { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); }
function catOf(id) { return D.cats.find(c => c.id === id) || { id, name:"(분류 없음)", color:"gray" }; }
function tagHtml(id) { const c = catOf(id), col = COLORS[c.color] || COLORS.gray; return `<span class="tag" style="background:${col.bg};color:${col.fg}">${esc(c.name)}</span>`; }
function visible(t) { return !(S.hideDone && t.done) && !S.off.includes(t.cat); }

/* =========================================================
   저장 (브라우저 + 클라우드)
   ========================================================= */
let pushTimer = null;
function save() {
  try { localStorage.setItem(LS_DATA, JSON.stringify(D)); } catch (e) {}
  if (!sb) return;
  setCloud("saving");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 600);
}
async function pushNow() {
  try {
    const { error } = await sb.from(SB_TABLE).upsert({ id: SB_ID, data: D, updated_at: new Date().toISOString() });
    if (error) throw error;
    setCloud("ok");
  } catch (e) { console.warn("투두 저장 실패:", e.message || e); setCloud("err"); }
}
async function loadCloud() {
  if (!sb) { setCloud("local"); return; }
  setCloud("loading");
  try {
    const { data, error } = await sb.from(SB_TABLE).select("data").eq("id", SB_ID).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      D = data.data;
      if (!Array.isArray(D.cats) || !D.cats.length) D.cats = DEFAULT_CATS;
      D.tasks = D.tasks || []; D.notes = D.notes || [];
      try { localStorage.setItem(LS_DATA, JSON.stringify(D)); } catch (e) {}
      renderAll();
      setCloud("ok");
    } else {
      await pushNow();   // 클라우드에 아직 없으면 지금 내용을 올림
    }
  } catch (e) { console.warn("투두 불러오기 실패:", e.message || e); setCloud("err"); }
}
function setCloud(st) {
  const el = document.getElementById("cloud");
  const map = { local:["💾 이 브라우저에만 저장",""], loading:["☁️ 불러오는 중…",""], saving:["☁️ 저장 중…",""], ok:["☁️ 클라우드 저장됨","ok"], err:["⚠️ 클라우드 저장 실패","err"] };
  const [t, c] = map[st] || map.local;
  el.textContent = t; el.className = "cloud " + c;
}

/* =========================================================
   윗부분: 빠른 추가 / 개인 할 일
   ========================================================= */
function renderQuick() {
  document.getElementById("quick").innerHTML =
    `<div class="qt">빠른 추가 (오늘 날짜)</div>` +
    D.cats.map(c => { const col = COLORS[c.color] || COLORS.gray;
      return `<button class="qbtn" style="background:${col.bg};color:${col.fg}" onclick="openTask(null, todayStr(), '${c.id}')"><b>+</b>${esc(c.name)}</button>`; }).join("") +
    `<button class="edit-cats" onclick="openCats()">⚙ 분류 편집</button>`;
}
function renderNotes() {
  document.getElementById("notes").innerHTML = D.notes.map(n => `
    <div class="note ${n.done ? "done" : ""}">
      <input type="checkbox" ${n.done ? "checked" : ""} onchange="toggleNote('${n.id}', this.checked)">
      <div class="nt" contenteditable="true" onblur="editNote('${n.id}', this.innerText)" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();this.blur()}">${esc(n.text)}</div>
      <button class="x" title="삭제" onclick="delNote('${n.id}')">×</button>
    </div>`).join("");
}
function addNote() {
  const el = document.getElementById("noteIn"), v = el.value.trim();
  if (!v) return;
  D.notes.push({ id: uid(), text: v, done: false });
  el.value = ""; save(); renderNotes();
}
function toggleNote(id, v) { const n = D.notes.find(x => x.id === id); if (n) { n.done = v; save(); renderNotes(); } }
function editNote(id, v) { const n = D.notes.find(x => x.id === id); if (n && n.text !== v.trim()) { n.text = v.trim(); if (!n.text) D.notes = D.notes.filter(x => x.id !== id); save(); renderNotes(); } }
function delNote(id) { D.notes = D.notes.filter(x => x.id !== id); save(); renderNotes(); }

/* =========================================================
   보기 전환 / 연도·월 이동 / 분류 필터
   ========================================================= */
function setView(v) { S.view = v; saveLocalUi(); render(); }
function moveYear(d) { S.year += d; saveLocalUi(); render(); }
function moveMonth(d) {
  S.month += d;
  if (S.month < 0) { S.month = 11; S.year--; }
  if (S.month > 11) { S.month = 0; S.year++; }
  saveLocalUi(); render();
}
function goMonth(m) { S.month = m; if (S.view === "year") S.view = "cal"; saveLocalUi(); render(); }
function goToday() { const t = new Date(); S.year = t.getFullYear(); S.month = t.getMonth(); saveLocalUi(); render(); }
function toggleFilter(id) { S.off = S.off.includes(id) ? S.off.filter(x => x !== id) : [...S.off, id]; saveLocalUi(); render(); }

function renderBars() {
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
  document.getElementById("yearLabel").textContent = S.year + "년";
  document.getElementById("hideDone").checked = S.hideDone;
  const counts = Array(12).fill(0);
  D.tasks.forEach(t => { if (t.date && +t.date.slice(0, 4) === S.year && !t.done) counts[+t.date.slice(5, 7) - 1]++; });
  document.getElementById("months").innerHTML = counts.map((c, i) =>
    `<button class="mchip ${S.view !== "year" && i === S.month ? "on" : ""}" onclick="goMonth(${i})" title="남은 일 ${c}건">${i + 1}월${c ? `<span class="c">${c}</span>` : ""}</button>`).join("");
  document.getElementById("filters").innerHTML = D.cats.map(c => { const col = COLORS[c.color] || COLORS.gray;
    return `<button class="fchip ${S.off.includes(c.id) ? "" : "on"}" style="background:${col.bg};color:${col.fg}" onclick="toggleFilter('${c.id}')" title="눌러서 보이기/숨기기">${esc(c.name)}</button>`; }).join("");
}

function render() {
  renderBars();
  const v = document.getElementById("view");
  if (S.view === "year") v.innerHTML = yearHtml();
  else if (S.view === "board") v.innerHTML = boardHtml();
  else if (S.view === "list") v.innerHTML = listHtml();
  else v.innerHTML = calHtml();
}
function renderAll() { renderQuick(); renderNotes(); render(); }

/* ── 할 일 카드 ── */
function taskCard(t, showDate) {
  return `<div class="task ${t.done ? "done" : ""}" draggable="true" data-id="${t.id}"
      onclick="event.stopPropagation(); openTask('${t.id}')"
      ondragstart="dragStart(event,'${t.id}')" ondragend="this.classList.remove('dragging')">
    <div class="tt">${esc(t.title) || "(제목 없음)"}</div>
    <div class="tr">${tagHtml(t.cat)}${showDate ? `<span class="dd">${t.date ? t.date.slice(5).replace("-", "/") : "날짜 없음"}</span>` : ""}</div>
    <div class="tr" style="margin-top:6px"><input type="checkbox" ${t.done ? "checked" : ""} onclick="event.stopPropagation()" onchange="toggleTask('${t.id}', this.checked)"></div>
  </div>`;
}
function toggleTask(id, v) { const t = D.tasks.find(x => x.id === id); if (t) { t.done = v; save(); render(); } }
function sortTasks(a, b) { return (a.done - b.done) || (a.order || 0) - (b.order || 0) || String(a.created).localeCompare(String(b.created)); }

/* ── 월 캘린더 ── */
function calHtml() {
  const y = S.year, m = S.month;
  const first = new Date(y, m, 1), startDow = first.getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const weeks = Math.ceil((startDow + days) / 7);
  const today = todayStr();
  const byDate = {};
  D.tasks.filter(visible).forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });

  let cells = "";
  for (let i = 0; i < weeks * 7; i++) {
    const dt = new Date(y, m, i - startDow + 1);
    const key = ymd(dt.getFullYear(), dt.getMonth(), dt.getDate());
    const out = dt.getMonth() !== m, dow = dt.getDay();
    const list = (byDate[key] || []).sort(sortTasks);
    const label = dt.getDate() === 1 ? `<b>${dt.getMonth() + 1}월</b> 1일` : dt.getDate();
    cells += `<div class="cell ${out ? "out" : ""} ${dow === 0 ? "sun" : dow === 6 ? "sat" : ""} ${key === today ? "today" : ""} ${dt.getDate() === 1 ? "first" : ""}"
        onclick="openTask(null,'${key}')" ondragover="dragOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="dropOn(event,this,'${key}')">
      <div class="dh"><button class="plus" title="이 날짜에 추가" onclick="event.stopPropagation(); openTask(null,'${key}')">+</button><span class="dn">${label}</span></div>
      ${list.map(t => taskCard(t)).join("")}
    </div>`;
  }
  return `<div class="monthtitle"><b>${y}년 ${m + 1}월</b>
      <div class="r"><button class="navbtn" onclick="moveMonth(-1)">‹</button><button class="today-btn" onclick="goToday()">오늘</button><button class="navbtn" onclick="moveMonth(1)">›</button></div></div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid">${cells}</div>`;
}

/* ── 연간 보기 (12개월 한눈에) ── */
function yearHtml() {
  const y = S.year, today = todayStr();
  const byDate = {};
  D.tasks.filter(visible).forEach(t => { if (t.date && +t.date.slice(0, 4) === y) (byDate[t.date] = byDate[t.date] || []).push(t); });
  let html = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:8px">`;
  for (let m = 0; m < 12; m++) {
    const sd = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    let g = "";
    for (let i = 0; i < sd; i++) g += `<div></div>`;
    for (let d = 1; d <= days; d++) {
      const key = ymd(y, m, d), list = byDate[key] || [];
      const left = list.filter(t => !t.done).length;
      const dow = (sd + d - 1) % 7;
      const bg = list.length ? (left ? "#28456c" : "#2b593f") : "transparent";
      const tip = list.map(t => (t.done ? "✔ " : "• ") + t.title).join("\n");
      g += `<div onclick="S.month=${m};setView('cal')" title="${esc(tip)}" style="cursor:pointer;text-align:center;padding:4px 0;border-radius:5px;font-size:12px;background:${bg};${key === today ? "outline:2px solid var(--today);" : ""}color:${list.length ? "#fff" : dow === 0 ? "#e07b7b" : dow === 6 ? "#7ba7e0" : "var(--muted)"}">${d}${list.length ? `<div style="font-size:9.5px;opacity:.85">${left || "✔"}</div>` : ""}</div>`;
    }
    const cnt = Object.keys(byDate).filter(k => +k.slice(5, 7) === m + 1).reduce((s, k) => s + byDate[k].filter(t => !t.done).length, 0);
    html += `<div class="col"><div class="col-h"><b style="cursor:pointer" onclick="goMonth(${m})">${m + 1}월</b><span class="n">${cnt ? `남은 일 ${cnt}건` : ""}</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;color:var(--faint);text-align:center;margin-bottom:4px"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${g}</div></div>`;
  }
  return html + `</div><p style="color:var(--faint);font-size:12px;margin-top:10px">파란 칸 = 남은 일이 있는 날(숫자 = 남은 건수) · 초록 칸 = 모두 완료 · 날짜를 누르면 그 달 캘린더로 이동</p>`;
}

/* ── 과목별 (분류별 보드) : 선택한 달 기준 ── */
function boardHtml() {
  const mk = `${S.year}-${pad(S.month + 1)}`;
  const inMonth = D.tasks.filter(t => (t.date || "").startsWith(mk)).filter(visible);
  const cols = D.cats.filter(c => !S.off.includes(c.id));
  return `<div class="monthtitle"><b>${S.year}년 ${S.month + 1}월 · 분류별</b>
      <div class="r"><button class="navbtn" onclick="moveMonth(-1)">‹</button><button class="today-btn" onclick="goToday()">오늘</button><button class="navbtn" onclick="moveMonth(1)">›</button></div></div>
    <div class="board">${cols.map(c => {
      const list = inMonth.filter(t => t.cat === c.id).sort((a, b) => (a.done - b.done) || a.date.localeCompare(b.date));
      return `<div class="col" ondragover="dragOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="dropCat(event,this,'${c.id}')">
        <div class="col-h">${tagHtml(c.id)}<span class="n">${list.length}</span><button class="p" title="추가" onclick="openTask(null, defaultDateInView(), '${c.id}')">+</button></div>
        ${list.map(t => taskCard(t, true)).join("") || `<div class="more">할 일이 없어요</div>`}
      </div>`; }).join("")}</div>`;
}
function defaultDateInView() {
  const t = new Date();
  if (t.getFullYear() === S.year && t.getMonth() === S.month) return todayStr();
  return ymd(S.year, S.month, 1);
}

/* ── 목록 (선택한 연도 전체) ── */
function listHtml() {
  const list = D.tasks.filter(t => (t.date || "").startsWith(S.year + "-") || !t.date).filter(visible)
    .sort((a, b) => (a.done - b.done) || String(a.date).localeCompare(String(b.date)));
  if (!list.length) return `<div class="empty">${S.year}년에 등록된 할 일이 없어요.</div>`;
  return `<div class="tbl-wrap"><table>
    <thead><tr><th style="width:44px">완료</th><th style="width:110px">날짜</th><th>할 일</th><th style="width:130px">분류</th><th>메모</th></tr></thead>
    <tbody>${list.map(t => `<tr class="row ${t.done ? "done" : ""}" onclick="openTask('${t.id}')">
      <td><input type="checkbox" ${t.done ? "checked" : ""} onclick="event.stopPropagation()" onchange="toggleTask('${t.id}', this.checked)"></td>
      <td>${t.date || "-"}</td><td class="ttl"><b>${esc(t.title)}</b></td><td>${tagHtml(t.cat)}</td><td class="memo-s">${esc(t.memo || "")}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* =========================================================
   끌어서 옮기기 (카드를 다른 날짜 / 다른 분류로)
   ========================================================= */
let dragId = null;
function dragStart(e, id) { dragId = id; e.dataTransfer.setData("text/plain", id); e.currentTarget.classList.add("dragging"); }
function dragOver(e, el) { if (!dragId) return; e.preventDefault(); el.classList.add("drop"); }
function dropOn(e, el, date) {
  e.preventDefault(); el.classList.remove("drop");
  const t = D.tasks.find(x => x.id === dragId); dragId = null;
  if (t && t.date !== date) { t.date = date; save(); render(); }
}
function dropCat(e, el, cat) {
  e.preventDefault(); el.classList.remove("drop");
  const t = D.tasks.find(x => x.id === dragId); dragId = null;
  if (t && t.cat !== cat) { t.cat = cat; save(); render(); }
}

/* =========================================================
   할 일 입력 창
   ========================================================= */
function openTask(id, date, cat) {
  editingId = id;
  const t = id ? D.tasks.find(x => x.id === id) : null;
  document.getElementById("mCat").innerHTML = D.cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  document.getElementById("mTitle").value = t ? t.title : "";
  document.getElementById("mDate").value = t ? (t.date || "") : (date || todayStr());
  document.getElementById("mCat").value = t ? t.cat : (cat || D.cats[0].id);
  document.getElementById("mDone").checked = t ? !!t.done : false;
  document.getElementById("mMemo").value = t ? (t.memo || "") : "";
  document.getElementById("mDel").style.visibility = t ? "visible" : "hidden";
  document.getElementById("taskModal").hidden = false;
  setTimeout(() => document.getElementById("mTitle").focus(), 30);
}
function closeModal() { document.getElementById("taskModal").hidden = true; editingId = null; }
function saveTask() {
  const title = document.getElementById("mTitle").value.trim();
  if (!title) { document.getElementById("mTitle").focus(); return; }
  const vals = {
    title,
    date: document.getElementById("mDate").value,
    cat: document.getElementById("mCat").value,
    done: document.getElementById("mDone").checked,
    memo: document.getElementById("mMemo").value,
  };
  if (editingId) Object.assign(D.tasks.find(x => x.id === editingId), vals);
  else D.tasks.push(Object.assign({ id: uid(), created: new Date().toISOString() }, vals));
  if (vals.date) { S.year = +vals.date.slice(0, 4); if (S.view !== "list" && S.view !== "year") S.month = +vals.date.slice(5, 7) - 1; saveLocalUi(); }
  save(); closeModal(); render();
}
function deleteTask() {
  if (!editingId || !confirm("이 할 일을 삭제할까요?")) return;
  D.tasks = D.tasks.filter(x => x.id !== editingId);
  save(); closeModal(); render();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeCats(); } });

/* =========================================================
   분류 편집
   ========================================================= */
let catDraft = [];
function openCats() { catDraft = D.cats.map(c => ({ ...c })); drawCats(); document.getElementById("catModal").hidden = false; }
function closeCats() { document.getElementById("catModal").hidden = true; }
function drawCats() {
  document.getElementById("catList").innerHTML = catDraft.map((c, i) => `
    <div class="cat-row">
      <input type="text" value="${esc(c.name)}" oninput="catDraft[${i}].name=this.value" placeholder="분류 이름">
      <select onchange="catDraft[${i}].color=this.value;drawCats()" style="background:${(COLORS[c.color] || COLORS.gray).bg}">
        ${Object.entries(COLORS).map(([k, v]) => `<option value="${k}" ${k === c.color ? "selected" : ""}>${v.name}</option>`).join("")}
      </select>
      <button class="x" title="삭제" onclick="removeCat(${i})">×</button>
    </div>`).join("");
}
function addCatRow() { catDraft.push({ id: "c" + uid(), name: "", color: "blue" }); drawCats(); }
function removeCat(i) {
  const used = D.tasks.filter(t => t.cat === catDraft[i].id).length;
  if (used && !confirm(`이 분류로 등록된 할 일이 ${used}건 있어요. 분류를 지워도 할 일은 남고 '(분류 없음)'으로 보여요. 지울까요?`)) return;
  catDraft.splice(i, 1); drawCats();
}
function saveCats() {
  const list = catDraft.filter(c => c.name.trim()).map(c => ({ ...c, name: c.name.trim() }));
  if (!list.length) { alert("분류가 하나 이상 있어야 해요."); return; }
  D.cats = list; save(); closeCats(); renderAll();
}

/* 시작 */
renderAll();
loadCloud();
</script>
</body>
</html>
</template>
